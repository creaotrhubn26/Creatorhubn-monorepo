# Netlify-konfig — portet fra frontend/vercel.json (Vercel → Netlify-migrasjon).
#
# ⚠️ IKKE DNS-cutover ennå. Verifiser HELE ruting-tabellen på en Netlify deploy-preview
# (koble repoet, la denne grenen bygge, test rutene mot preview-URL-en) FØR domenet
# pekes om. Reverse-proxy-reglene under er load-bearing for theroleroom.no/-siden.
#
# Semantikk-forskjeller fra Vercel som er håndtert her:
#   • Vercel `rewrites` (URL uendret)      → Netlify [[redirects]] status = 200
#   • Vercel `redirects` (permanent)       → Netlify [[redirects]] status = 301
#   • Ekstern proxy (backend/R2/worker)    → status = 200 + force = true
#   • `(.*)`/`$1`  → `*`/`:splat` ;  første-treff-vinner (som Vercel-rekkefølgen)
#   • `force = true` der regelen ellers ville skygges av en ekte fil (/, /robots.txt, proxyer)

[build]
  # `frontend` er en npm-WORKSPACE → deps (vite m.fl.) hoistes til ROT-node_modules.
  # Derfor: base = repo-rot (install hoister alt), bygg workspacet, publiser dets dist.
  command = "npm run build --workspace creatorhub-frontend"
  publish = "frontend/client/dist"
  # Hopp over preview-bygg når committen ikke rører frontend/. main bygger alltid.
  # Netlify: exit 0 = hopp over, non-zero = bygg. (Samme churn-filter som vercel.json hadde.)
  ignore = "if [ \"$BRANCH\" = \"main\" ]; then exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- frontend"

[build.environment]
  NPM_FLAGS = "--legacy-peer-deps"   # matcher Vercel installCommand
  NODE_VERSION = "20"                # Vite 5 — juster ved behov

# ─────────────────────────── REDIRECTS (301) ───────────────────────────
# Vercel kjører redirects FØR rewrites → de må stå først (Netlify = første-treff).

[[redirects]]
  from = "/casting.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/theroleroom"
  to = "/"
  status = 301
  force = true
# ⚠️ MERK: denne 301-en skygger rewrite-en «/theroleroom → /theroleroom.html» lenger nede
#    (samme som på Vercel i dag). Verifiser at det er ØNSKET — ser ut som en utilsiktet
#    skygge i den eksisterende vercel.json.

[[redirects]]
  from = "/theroleroom/"
  to = "/"
  status = 301
  force = true

# MERK: Vercels «/talentportal/ → /talentportal» + «/utdanningsinstitusjon/ → …»
# (trailing-slash-stripping) er FJERNET — Netlify normaliserer trailing slash
# automatisk (Vercel gjør ikke), så reglene matchet «/talentportal» seg selv →
# 301-loop. Uten dem faller «/talentportal» gjennom til rewrite-en
# «/talentportal → /theroleroom.html» (200) som forventet.

# Skygget av reglene over (duplikat-source, første-treff vant på Vercel også) — beholdt
# som dokumentasjon, deaktivert:
#   /casting.html   → /theroleroom   (skygget av /casting.html → /)
#   /theroleroom/   → /theroleroom   (skygget av /theroleroom/ → /)

# ─────────────────────── PROXY-REWRITES (200, force) ───────────────────────
# Eksterne mål (Render-backend, R2, Cloudflare Worker) — må proxye selv om en fil matcher.

[[redirects]]
  from = "/api/showcase/cdn/*"
  to = "https://showcase-cdn.creatorhubn.workers.dev/api/showcase/cdn/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://creatorhub-backend-rtbl.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/g/*"
  to = "https://creatorhub-backend-rtbl.onrender.com/g/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/cdn/*"
  to = "https://pub-6556104b51da4540aebfd28b23c0ebea.r2.dev/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://creatorhub-backend-rtbl.onrender.com/api/theroleroom-sitemap.xml"
  status = 200
  force = true
# Skygget: /sitemap.xml → /creatorhubn-sitemap.xml (duplikat, første-treff vant)

# ─────────────────────── INTERNE REWRITES (200) ───────────────────────

[[redirects]]
  from = "/robots.txt"
  to = "/theroleroom-robots.txt"
  status = 200
  force = true
# Skygget: /robots.txt → /creatorhubn-robots.txt (duplikat, første-treff vant)

