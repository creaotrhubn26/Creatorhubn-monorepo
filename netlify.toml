# Rot: server den BYGDE index.html (SPA-entry) — ikke theroleroom-root.html.
# theroleroom-root.html (public/) er IKKE Vite-prosessert og peker på dev-kilden
# `/src/main.tsx` → laster ikke i prod → blank side. Netlify serverer derfor
# eksplisitt den bygde index.html. Appen setter SEO-meta klient-side
# (host-bevisst).
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/data-deletion"
  to = "/theroleroom-data-deletion.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/theroleroom-privacy.html"
  status = 200
[[redirects]]
  from = "/terms-and-conditions"
  to = "/theroleroom-terms.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/theroleroom-terms.html"
  status = 200

# ─────────────────────── SPA-FALLBACK (MÅ VÆRE SIST) ───────────────────────
# INGEN force → ekte filer (/assets/*.js, .css, bilder) serveres direkte.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
