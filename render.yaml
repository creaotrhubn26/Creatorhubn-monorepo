services:
  - type: web
    name: creatorhub-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    # Migrate-on-deploy lever i `backend/package.json`'s ``start``-script
    # (``./migrate.sh && node server.js``), ikke som preDeployCommand —
    # preDeployCommand krever Standard-plan ($25/md), denne servicen
    # er på Starter. Hvis vi oppgraderer til Standard, flytt
    # migreringen tilbake hit som ``preDeployCommand: cd /app/backend
    # && ./migrate.sh`` og fjern prefix fra start-scriptet, slik at
    # migrasjonen aborterer deployen før live-trafikken swappes
    # istedenfor å feile på første container-restart.
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Anthropic Claude for The Role Room Agent (generation tasks).
      # Sets feature flag to `false` so the agent falls back to Cohere/OpenAI
      # until the DPA is signed and the flag is flipped in Render UI.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ROLE_ROOM_AGENT_CLAUDE_ENABLED
        value: "false"
      - key: ROLE_ROOM_AGENT_CLAUDE_MODEL
        value: claude-sonnet-4-5
      # Producer-bootstrap synthesis routing. Default = OpenAI; set this to
      # "claude" to route the bootstrap agent through Anthropic instead.
      # Falls back to OpenAI automatically on Claude failures.
      - key: ROLE_ROOM_BOOTSTRAP_MODEL
        sync: false
      - key: ROLE_ROOM_BOOTSTRAP_CLAUDE_MODEL
        value: claude-sonnet-4-5
      # Enable multimodal vision analysis of the customer's og:image /
      # twitter:image in the bootstrap synthesis. Set to "false" to disable;
      # default is on when ROLE_ROOM_BOOTSTRAP_MODEL=claude.
      - key: ROLE_ROOM_BOOTSTRAP_VISION
        value: "true"
      # Tool-orchestrated bootstrap: Claude decides which data sources to
      # fetch. Default unset (deterministic pipeline). Set to "claude" to
      # opt in — falls through to deterministic if orchestrator yields
      # nothing useful.
      - key: ROLE_ROOM_BOOTSTRAP_ORCHESTRATOR
        sync: false
      # Cost-saving cache — serves same-question responses from DB for 30
      # min before re-charging Anthropic. Default on.
      - key: ROLE_ROOM_AGENT_CACHE
        value: "on"
      # Model router — pushes short info-lookup queries to Haiku
      # (~5× cheaper). Complex queries keep using Sonnet. Default on.
      - key: ROLE_ROOM_AGENT_MODEL_ROUTER
        value: "on"
      - key: ROLE_ROOM_AGENT_HAIKU_MODEL
        value: claude-haiku-4-5-20251001
      # Proactive daily scan — runs once a day and pushes risk findings
      # into producer_project_notifications. Default off; enable after
      # you've validated costs with a small pilot group.
      - key: ROLE_ROOM_AGENT_DAILY_SCAN_ENABLED
        value: "false"
      - key: ROLE_ROOM_AGENT_DAILY_SCAN_LIMIT
        value: "50"
      # Cost-safety rate limiter. Per-user / per-project caps enforced in
      # the API layer before the Claude call. Tune per pilot feedback.
      - key: ROLE_ROOM_AGENT_RATE_LIMIT
        value: "on"
      - key: ROLE_ROOM_AGENT_RL_USER_MIN
        value: "20"
      - key: ROLE_ROOM_AGENT_RL_USER_HOUR
        value: "200"
      - key: ROLE_ROOM_AGENT_RL_PROJECT_MIN
        value: "40"
      # Monetization — hybrid tier + add-on model for the Role Room Agent.
      # Pro/Enterprise subscribers auto-grant; Basic/Prototype can start a
      # trial or buy the add-on. Stripe price id is sync=false — set it in
      # Render UI once the Stripe product is published.
      - key: ROLE_ROOM_AGENT_TRIAL_DAYS
        value: "14"
      - key: ROLE_ROOM_AGENT_TRIAL_CALLS_PER_DAY
        value: "20"
      - key: ROLE_ROOM_AGENT_TRIAL_CALLS_TOTAL
        value: "150"
      # Global off-switch for new trials — set "false" to stop accepting
      # new prøveperioder without disabling the paid tiers.
      - key: ROLE_ROOM_AGENT_TRIALS_ENABLED
        value: "false"
      - key: ROLE_ROOM_AGENT_ADDON_PRICE_NOK
        value: "99"
      - key: ROLE_ROOM_AGENT_BASIC_INCLUDED
        value: "false"
      - key: STRIPE_ROLE_ROOM_AGENT_PRICE_ID
        sync: false
      - key: ROLE_ROOM_AGENT_CHECKOUT_SUCCESS_URL
        sync: false
      - key: ROLE_ROOM_AGENT_CHECKOUT_CANCEL_URL
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_MODELS_BUCKETS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ROLE_ROOM_GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_WORKSPACE_DOMAIN
        sync: false
      - key: GOOGLE_WORKSPACE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_IMPERSONATE_USER
        sync: false
      - key: GOOGLE_USE_IMPERSONATION
        sync: false
      - key: GOOGLE_TAG_MANAGER_ID
        sync: false
      - key: GOOGLE_ANALYTICS_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ROLE_ROOM_LINKEDIN_CLIENT_ID
        sync: false
      - key: ROLE_ROOM_LINKEDIN_CLIENT_SECRET
        sync: false
      - key: ROLE_ROOM_LINKEDIN_REDIRECT_URI
        sync: false
      # ── Meta / Instagram Graph API ─────────────────────────────────
      # App id + secret from developers.facebook.com → your app → Settings.
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      # OAuth redirect URI registered on the Meta App Dashboard under
      # "Facebook Login for Business" → Valid OAuth Redirect URIs.
      # Must match exactly, including protocol + path.
      - key: META_OAUTH_REDIRECT_URI
        sync: false
      # Hub.verify_token used for the initial GET /api/role-room/instagram/
      # webhook subscription handshake. Any opaque string — pasted into the
      # Meta Dashboard webhook config at the same time as this env.
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      # Optional — only set when using FB Login for Business's saved
      # configuration (scopes come from the config rather than inline).
      # Leave unset for classic FB Login.
      - key: META_LOGIN_CONFIG_ID
        sync: false
      # ── CreatorHub Google OAuth (iPad + web sign-in) ───────────────
      # The Google OAuth audience CreatorHub's /api/auth/google/token
      # accepts. Falls back to ROLE_ROOM_GOOGLE_CLIENT_ID when unset.
      - key: CREATORHUB_GOOGLE_CLIENT_ID
        sync: false
      # Public host used for the gallery share URL the photographer
      # hands to the client (app.creatorhubn.com/client/gallery/<token>).
      # Defaults to https://app.creatorhubn.com when unset.
      - key: CREATORHUB_PUBLIC_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: EVENDI_API_URL
        sync: false
      - key: PHOTO_ENHANCER_GFPGAN_URL
        value: https://creatorhub-gfpgan-runner.onrender.com/enhance
      # ── Audition reminders (Twilio + Gmail fallback) ──────────────
      # Branded SMS for The Role Room and CreatorHub. Each brand has
      # its own Messaging Service SID with an alphanumeric sender ID
      # registered with Telenor / Telia. Generic TWILIO_* are fallbacks.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: ROLE_ROOM_TWILIO_ACCOUNT_SID
        sync: false
      - key: ROLE_ROOM_TWILIO_AUTH_TOKEN
        sync: false
      - key: ROLE_ROOM_TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: CREATORHUB_TWILIO_ACCOUNT_SID
        sync: false
      - key: CREATORHUB_TWILIO_AUTH_TOKEN
        sync: false
      - key: CREATORHUB_TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: AUDITION_REMINDER_RUNNER_ENABLED
        value: "true"
      - key: AUDITION_REMINDER_INTERVAL_MINUTES
        value: "15"
      # SMS billing — pris stemples per rad i casting_sms_usage,
      # endringer her påvirker kun nye SMS, ikke historiske fakturaer.
      - key: CASTING_SMS_RETAIL_PRICE_NOK_EX_VAT
        value: "2.00"
      - key: CASTING_SMS_VAT_RATE
        value: "0.25"
      - key: CASTING_SMS_COST_NOK
        value: "0.65"
      # Stripe-faktura-sync — daglig sweep som pusher uavfakturerte
      # SMS-rader som invoice line-items på neste månedsfaktura.
      - key: CASTING_SMS_INVOICE_RUNNER_ENABLED
        value: "true"
      - key: CASTING_SMS_INVOICE_INTERVAL_HOURS
        value: "24"
      # ── WhatsApp Cloud API (multi-tenant BYO Meta) ──────────────
      # Hver bedrift kobler egen Meta-konto via settings; disse er
      # fallback for demo / The Role Room-egen-konto. Hemmeligheter
      # settes i UI (sync: false). Template-navn kan oppdateres når
      # Meta godkjenner med andre navn enn default.
      - key: META_APP_ACCESS_TOKEN
        sync: false
      - key: META_WHATSAPP_TEMPLATE_LANGUAGE
        value: "nb_NO"
      - key: META_WHATSAPP_TEMPLATE_24H_NAME
        value: "audition_reminder_24h_no"
      - key: META_WHATSAPP_TEMPLATE_1H_NAME
        value: "audition_reminder_1h_no"
      - key: META_WHATSAPP_TEMPLATE_TEAM_INVITE_NAME
        value: "production_team_invite_no"
      - key: CASTING_TEAM_INVITE_RUNNER_ENABLED
        value: "true"
      - key: CASTING_TEAM_INVITE_INTERVAL_MINUTES
        value: "10"
      - key: CASTING_WHATSAPP_RETAIL_PRICE_NOK_EX_VAT
        value: "0.80"
      - key: CASTING_WHATSAPP_VAT_RATE
        value: "0.25"
      - key: CASTING_WHATSAPP_COST_NOK
        value: "0.34"
      - key: CASTING_WHATSAPP_INVOICE_RUNNER_ENABLED
        value: "true"
      - key: CASTING_WHATSAPP_INVOICE_INTERVAL_HOURS
        value: "24"
  - type: web
    name: creatorhub-gfpgan-runner
    runtime: docker
    repo: https://github.com/creaotrhubn26/Creatorhubn-monorepo
    dockerfilePath: ./backend/gfpgan-runner/Dockerfile
    dockerContext: ./backend/gfpgan-runner
    plan: standard
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_MODELS_BUCKETS
        sync: false
      - key: GFPGAN_MAX_INPUT_EDGE
        value: "1600"
      - key: GFPGAN_UPSCALE
        value: "1"
      - key: GFPGAN_JPEG_QUALITY
        value: "95"
