services:
  - type: web
    name: creatorhub-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Anthropic Claude for The Role Room Agent (generation tasks).
      # Sets feature flag to `false` so the agent falls back to Cohere/OpenAI
      # until the DPA is signed and the flag is flipped in Render UI.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ROLE_ROOM_AGENT_CLAUDE_ENABLED
        value: "false"
      - key: ROLE_ROOM_AGENT_CLAUDE_MODEL
        value: claude-sonnet-4-5
      # Producer-bootstrap synthesis routing. Default = OpenAI; set this to
      # "claude" to route the bootstrap agent through Anthropic instead.
      # Falls back to OpenAI automatically on Claude failures.
      - key: ROLE_ROOM_BOOTSTRAP_MODEL
        sync: false
      - key: ROLE_ROOM_BOOTSTRAP_CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_MODELS_BUCKETS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ROLE_ROOM_GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_WORKSPACE_DOMAIN
        sync: false
      - key: GOOGLE_WORKSPACE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_IMPERSONATE_USER
        sync: false
      - key: GOOGLE_USE_IMPERSONATION
        sync: false
      - key: GOOGLE_TAG_MANAGER_ID
        sync: false
      - key: GOOGLE_ANALYTICS_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ROLE_ROOM_LINKEDIN_CLIENT_ID
        sync: false
      - key: ROLE_ROOM_LINKEDIN_CLIENT_SECRET
        sync: false
      - key: ROLE_ROOM_LINKEDIN_REDIRECT_URI
        sync: false
      - key: APP_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: EVENDI_API_URL
        sync: false
      - key: PHOTO_ENHANCER_GFPGAN_URL
        value: https://creatorhub-gfpgan-runner.onrender.com/enhance
  - type: web
    name: creatorhub-gfpgan-runner
    runtime: docker
    repo: https://github.com/creaotrhubn26/Creatorhubn-monorepo
    dockerfilePath: ./backend/gfpgan-runner/Dockerfile
    dockerContext: ./backend/gfpgan-runner
    plan: standard
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_MODELS_BUCKETS
        sync: false
      - key: GFPGAN_MAX_INPUT_EDGE
        value: "1600"
      - key: GFPGAN_UPSCALE
        value: "1"
      - key: GFPGAN_JPEG_QUALITY
        value: "95"
