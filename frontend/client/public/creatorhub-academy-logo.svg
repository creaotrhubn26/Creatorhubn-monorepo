<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- CreatorHub Norge Amber-Orange Gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Academy Icon - Graduation Cap with Book -->
  <g transform="translate(35, 15)">
    <!-- Graduation Cap Base -->
    <polygon points="25,25 0,40 25,55 50,40" fill="url(#logoGradient)" filter="url(#dropShadow)"/>
    
    <!-- Cap Top -->
    <polygon points="25,15 10,30 25,40 40,30" fill="#d97706"/>
    
    <!-- Tassel -->
    <line x1="25" y1="15" x2="25" y2="5" stroke="url(#logoGradient)" stroke-width="2"/>
    <circle cx="25" cy="5" r="3" fill="url(#logoGradient)"/>
    <path d="M25 5 Q35 10 35 20" stroke="url(#logoGradient)" stroke-width="2" fill="none"/>
    <circle cx="35" cy="20" r="2" fill="#f59e0b"/>
    
    <!-- Open Book Below Cap -->
    <path d="M10 60 Q25 55 25 65 Q25 55 40 60 L40 75 Q25 70 25 80 Q25 70 10 75 Z" 
          fill="url(#logoGradient)" opacity="0.9"/>
    
    <!-- Book Pages -->
    <line x1="25" y1="55" x2="25" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    
    <!-- Play Button (Video Learning) -->
    <circle cx="50" cy="70" r="10" fill="url(#logoGradient)" opacity="0.8"/>
    <polygon points="47,65 47,75 55,70" fill="#ffffff"/>
  </g>
  
  <!-- CreatorHub Text -->
  <text x="110" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
        fill="url(#logoGradient)" filter="url(#dropShadow)">CREATORHUB</text>
  
  <!-- Academy Text - Prominent -->
  <text x="110" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="#f59e0b">ACADEMY</text>
        
  <!-- By CreatorHub Norge Tagline -->
  <text x="110" y="90" font-family="Arial, sans-serif" font-size="10" font-weight="normal" 
        fill="#d97706" opacity="0.8">Et produkt av CreatorHub Norge</text>
        
  <!-- Video Learning Platform Tagline -->
  <text x="110" y="105" font-family="Arial, sans-serif" font-size="9" font-weight="normal" 
        fill="#92400e" opacity="0.6">Video-f�rst L�ringsplattform</text>
</svg>












