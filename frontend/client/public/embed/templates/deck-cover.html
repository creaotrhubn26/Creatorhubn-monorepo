<style>
  #wrap{position:relative;display:flex;flex-direction:column;justify-content:center;gap:18px;
    width:940px;min-height:480px;padding:64px 68px;box-sizing:border-box;overflow:hidden;
    font-family:Inter,"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
    background:radial-gradient(120% 140% at 0% 0%,#182338 0%,#0b1120 60%);
    border-radius:32px;box-shadow:0 32px 90px rgba(6,12,28,.45);opacity:0;transform:translateY(16px)}
  #wrap::after{content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,var(--a,#2f6df0) 0%,transparent 66%);opacity:.20}
  .bar{width:56px;height:6px;border-radius:0 0 5px 5px;background:var(--a,#2f6df0);opacity:0}
  .org{font-size:19px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--a,#2f6df0);opacity:0}
  .ttl{font-size:64px;font-weight:800;line-height:1.04;letter-spacing:-1.8px;color:#f6f8fc;max-width:18ch;margin:0;opacity:0;transform:translateY(12px)}
  .meta{display:flex;align-items:center;gap:12px;font-size:19px;color:#9fb0c8;font-weight:500;opacity:0}
  .dot{width:6px;height:6px;border-radius:50%;background:#3a4a63}
  .brand{margin-left:auto;font-size:15px;color:#6b7c96;font-weight:600;letter-spacing:.04em}
</style>
<div id="wrap">
  <div class="bar" data-d="0.04"></div>
  <div class="org" data-d="0.08"></div>
  <h1 class="ttl" data-d="0.16"></h1>
  <div class="meta" data-d="0.30">
    <span class="m-text"></span>
    <span class="dot"></span>
    <span class="brand"></span>
  </div>
</div>
<script>
  var CFG = window.__CFG__ || {};
  document.documentElement.style.setProperty('--a', CFG.accent || '#2f6df0');
  var org = document.querySelector('.org');
  org.textContent = CFG.org || '';
  if (!org.textContent) org.style.display = 'none';
  document.querySelector('.ttl').textContent = CFG.title || CFG.label || '';
  var mt = document.querySelector('.m-text');
  mt.textContent = CFG.meta || '';
  if (!mt.textContent) mt.style.display = 'none';
  var brand = document.querySelector('.brand');
  brand.textContent = CFG.brand || 'Pitch';
  var metaRow = document.querySelector('.meta');
  if (!mt.textContent && !brand.textContent) metaRow.style.display = 'none';
  else if (!mt.textContent) document.querySelector('.dot').style.display = 'none';
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
  window.setProgress = function (p) {
    var w = document.getElementById('wrap'); var e = ease(Math.min(1, p / .25));
    if (w) { w.style.opacity = e; w.style.transform = 'translateY(' + (16 * (1 - e)).toFixed(1) + 'px)'; }
    document.querySelectorAll('[data-d]').forEach(function (el) {
      var q = ease(Math.max(0, Math.min(1, (p - (+el.dataset.d)) / 0.5)));
      el.style.opacity = q;
      if (el.classList.contains('ttl')) el.style.transform = 'translateY(' + (12 * (1 - q)).toFixed(1) + 'px)';
    });
  };
  window.setProgress(0);
</script>
