<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Koble til The Role Room</title>
<style>
  :root { --accent:#8B5CF6; --ink:#0f1115; --muted:#6b7280; }
  * { box-sizing:border-box }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:#0a0a0a; color:#e9e9ee; margin:0; min-height:100vh; display:grid; place-items:center; padding:24px }
  .card { width:100%; max-width:460px; background:#141419; border:1px solid rgba(255,255,255,.09); border-radius:18px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.5) }
  .logo { width:44px; height:44px; border-radius:12px; background:rgba(139,92,246,.16); color:#c4b5fd; display:grid; place-items:center; font-weight:800; font-size:20px; margin-bottom:14px }
  h1 { font-size:19px; margin:0 0 6px }
  p { color:#b9b9c3; font-size:14px; line-height:1.5; margin:6px 0 }
  .app { font-weight:700; color:#fff }
  .scope { display:inline-block; background:rgba(139,92,246,.16); color:#c4b5fd; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700; margin:2px 4px 2px 0 }
  .row { display:flex; gap:10px; margin-top:22px }
  button { flex:1; border:0; border-radius:11px; padding:13px; font-weight:700; font-size:14px; cursor:pointer }
  .approve { background:var(--accent); color:#fff }
  .approve:hover { background:#7c3aed }
  .deny { background:#23232b; color:#cfcfd8 }
  .muted { color:#7a7a86; font-size:12.5px; margin-top:18px }
  .err { background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.35); color:#fca5a5; border-radius:10px; padding:12px; font-size:13.5px }
  a { color:#c4b5fd }
  code { background:rgba(255,255,255,.06); padding:1px 6px; border-radius:6px; font-size:12px; color:#d7d7de }
</style>
</head>
<body>
<div class="card" id="card"><p>Laster…</p></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var required = ["response_type","client_id","redirect_uri","code_challenge","code_challenge_method"];
  var card = document.getElementById("card");
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); };

  function fail(msg) {
    card.innerHTML = '<div class="logo">RR</div><h1>Kan ikke koble til</h1><div class="err">' + esc(msg) + '</div>' +
      '<p class="muted">Lukk dette vinduet og prøv på nytt fra appen.</p>';
  }

  // 1) Valider OAuth-parametere
  for (var i = 0; i < required.length; i++) {
    if (!q.get(required[i])) return fail("Mangler parameter: " + required[i]);
  }
  if (q.get("response_type") !== "code") return fail("Ustøttet response_type.");
  if (q.get("code_challenge_method") !== "S256") return fail("PKCE S256 kreves.");

  // 2) Les den innloggede Role Room-sesjonen (samme origin som appen)
  var token = null;
  try { token = localStorage.getItem("role_room_auth_token") || localStorage.getItem("creatorhub_auth_token"); } catch (e) {}
  if (!token || !token.trim()) {
    card.innerHTML = '<div class="logo">RR</div><h1>Logg inn på The Role Room</h1>' +
      '<p>Du må være innlogget på The Role Room i denne nettleseren for å godkjenne tilkoblingen.</p>' +
      '<div class="row"><a class="approve" style="text-decoration:none;text-align:center;line-height:1.4" href="/">Logg inn</a></div>' +
      '<p class="muted">Logg inn, og åpne denne lenken på nytt fra appen.</p>';
    return;
  }

  // 3) Samtykke-skjerm
  var scope = q.get("scope") || "mcp:read";
  var scopeLabel = scope.indexOf("mcp:write") >= 0 ? "Lese og lage utkast" : "Lese";
  card.innerHTML =
    '<div class="logo">RR</div>' +
    '<h1>Koble en app til The Role Room</h1>' +
    '<p>En ekstern app ber om tilgang til dine Role Room-data.</p>' +
    '<p>Tilgang: <span class="scope">' + esc(scopeLabel) + '</span></p>' +
    '<p class="muted">Appen kan lese produksjoner, roller, planlegging m.m. — og lage <b>upubliserte utkast</b> som du selv publiserer. Den kan aldri sende noe ut på dine vegne.</p>' +
    '<div class="row"><button class="approve" id="ok">Godkjenn</button><button class="deny" id="no">Avslå</button></div>' +
    '<p class="muted">Du kan når som helst trekke tilbake tilgangen i kontoinnstillingene.</p>';

  function post(decision) {
    var f = document.createElement("form");
    f.method = "POST";
    f.action = "/api/role-room/mcp/oauth/authorize"; // proxyet til backend (samme origin)
    var fields = {
      response_type: q.get("response_type"), client_id: q.get("client_id"),
      redirect_uri: q.get("redirect_uri"), code_challenge: q.get("code_challenge"),
      code_challenge_method: q.get("code_challenge_method"), state: q.get("state") || "",
      scope: scope, rr_session: token, decision: decision
    };
    Object.keys(fields).forEach(function (k) {
      var inp = document.createElement("input");
      inp.type = "hidden"; inp.name = k; inp.value = fields[k] == null ? "" : fields[k];
      f.appendChild(inp);
    });
    document.body.appendChild(f);
    f.submit();
  }
  document.getElementById("ok").onclick = function () { post("approve"); };
  document.getElementById("no").onclick = function () { post("deny"); };
})();
</script>
</body>
</html>
