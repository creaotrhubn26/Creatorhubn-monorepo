<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<title>Super Admin Emergency Login</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0f; color: #fff; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  h1 { color: #fbbf24; }
  .card { background: #1a1f2e; padding: 24px; border-radius: 12px; max-width: 600px; width: 100%; border: 1px solid #fbbf24; }
  button { background: #fbbf24; color: #0a0a0f; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px; }
  button:hover { background: #f59e0b; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  label { display: block; margin-top: 14px; color: #cbd5e1; }
  input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0a0a0f; color: #fff; }
  pre { background: #0a0a0f; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; color: #cbd5e1; max-height: 240px; }
  .ok { color: #34d399; }
  .err { color: #fda4af; }
</style>
</head>
<body>
<div class="card">
  <h1>Super Admin Emergency Login</h1>
  <p>Oppgi den konfigurerte emergency-identiteten og hemmeligheten. Verdiene lagres ikke i denne siden.</p>
  <label>E-post<input id="email" type="email" autocomplete="username" required></label>
  <label>Emergency-token<input id="token" type="password" autocomplete="off" required></label>
  <button id="loginBtn">Logg inn nå</button>
  <p id="status"></p>
  <pre id="output"></pre>
</div>

<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const btn = document.getElementById('loginBtn');
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const email = document.getElementById('email').value.trim();
  const token = document.getElementById('token').value;
  if (!email || !token) {
    status.textContent = '✗ E-post og token må fylles ut';
    status.className = 'err';
    return;
  }
  btn.disabled = true;
  status.textContent = 'Logger inn…';
  status.className = '';
  try {
    const r = await fetch('/api/super-admin/emergency-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, token })
    });
    document.getElementById('token').value = '';
    const b = await r.json();
    output.textContent = b.error ? `Feil: ${b.error}` : '';
    if (!b.token) {
      status.textContent = '✗ Login feilet (HTTP ' + r.status + ')';
      status.className = 'err';
      btn.disabled = false;
      return;
    }
    localStorage.setItem('creatorhub_auth_token', b.token);
    localStorage.setItem('creatorhub_auth_user', JSON.stringify(b.user));
    localStorage.setItem('userEmail', b.user.email);

    // Verifiser
    const test = await fetch('/api/admin-room/funding-apps', {
      headers: { Authorization: 'Bearer ' + b.token }
    });
    if (test.status === 200) {
      status.textContent = '✓ Innlogget — sender til Admin Room om 1 sek';
      status.className = 'ok';
      setTimeout(() => {
        window.location.href = '/admin-room?adminTab=marketing-cockpit';
      }, 1000);
    } else {
      status.textContent = '⚠ Login lagret men test-kall ga HTTP ' + test.status;
      status.className = 'err';
      btn.disabled = false;
    }
  } catch (e) {
    status.textContent = '✗ Feil: ' + e.message;
    status.className = 'err';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
