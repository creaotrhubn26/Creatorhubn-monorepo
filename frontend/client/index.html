        function setAttr(selector, attr, value) {
          var el = document.querySelector(selector);
          if (el) el.setAttribute(attr, value);

      (function setInitialBrandFavicon() {
        var pathname = window.location.pathname || '/';
        var isAcademyRoute = /^\/academy(?:$|[/-])/.test(pathname);
        var faviconHref = isAcademyRoute ? '/academy-favicon.svg' : '/creatorhub-icon.png';
        var faviconType = faviconHref.endsWith('.svg') ? 'image/svg+xml' : 'image/png';
        var rels = ['icon', 'shortcut icon', 'apple-touch-icon'];

        rels.forEach(function (rel) {
          var link = document.head.querySelector('link[rel="' + rel + '"]');
          if (!link) {
            link = document.createElement('link');
            link.setAttribute('rel', rel);
            document.head.appendChild(link);
          }
          if (rel !== 'apple-touch-icon') {
            link.setAttribute('type', faviconType);
          } else {
            link.removeAttribute('type');
          }
          link.setAttribute('href', faviconHref);
        });
      })();
    </script>
