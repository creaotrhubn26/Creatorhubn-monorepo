<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/academy-favicon.svg" />
    <link rel="apple-touch-icon" href="/academy-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorHub Norge - Professional Creative Platform</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6E5MJT8REW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      gtag('config', 'G-6E5MJT8REW');
    </script>

    <!-- Google Fonts - Optimized: Only Roboto with essential weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Google Picker API -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script>
      // Initialize Google Picker API
      function initializeGooglePicker() {
        if (window.gapi) {
          gapi.load('picker', function () {
            console.log('Google Picker API loaded successfully');
          });
        }
      }

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeGooglePicker);
      } else {
        initializeGooglePicker();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Catch module loading errors
      window.addEventListener('error', function(e) {
        console.error('[MODULE ERROR]', e.message, e.filename, e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[UNHANDLED REJECTION]', e.reason?.message || e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
