<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/academy-favicon.svg" />
    <link rel="apple-touch-icon" href="/academy-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CreatorHub Norge - Professional Creative Platform</title>

    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () {
        window.dataLayer.push(arguments);
      };

      function loadExternalScript(src, options) {
        var script = document.createElement('script');
        script.src = src;
        script.async = options && Object.prototype.hasOwnProperty.call(options, 'async') ? options.async : true;
        script.defer = options && Object.prototype.hasOwnProperty.call(options, 'defer') ? options.defer : false;
        if (options && typeof options.onload === 'function') script.onload = options.onload;
        if (options && typeof options.onerror === 'function') script.onerror = options.onerror;
        document.head.appendChild(script);
      }

      function initGooglePicker() {
        if (window.gapi && typeof window.gapi.load === 'function') {
          window.gapi.load('picker', function () {});
        }
      }

      (function initThirdPartyServices() {
        var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        var isOnline = navigator.onLine !== false;

        if (!isLocalhost && isOnline) {
          loadExternalScript('https://www.googletagmanager.com/gtag/js?id=G-6E5MJT8REW', {
            onload: function () {
              window.gtag('js', new Date());
              window.gtag('config', 'G-6E5MJT8REW');
            },
          });
        }

        if (isOnline) {
          loadExternalScript('https://apis.google.com/js/api.js', {
            onload: initGooglePicker,
          });
        }
      })();
    </script>

    <!-- Google Fonts - Optimized: Only Roboto with essential weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Catch module loading errors
      window.addEventListener('error', function(e) {
        console.error('[MODULE ERROR]', e.message, e.filename, e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[UNHANDLED REJECTION]', e.reason?.message || e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
