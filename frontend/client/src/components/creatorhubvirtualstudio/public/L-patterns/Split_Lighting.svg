<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Split Lighting</text>
  
  <!-- Subject (face circle) -->
  <circle cx="200" cy="200" r="60" fill="#5a5a5a" stroke="#777" stroke-width="2"/>
  
  <!-- Dark half (right side) -->
  <path d="M 200 140 L 200 260 Q 260 200 200 140 Z" fill="#1a1a1a" opacity="0.85"/>
  
  <!-- Lit half (left side) -->
  <path d="M 200 140 L 200 260 Q 140 200 200 140 Z" fill="#888" opacity="0.6"/>
  
  <!-- Split line -->
  <line x1="200" y1="140" x2="200" y2="260" stroke="#333" stroke-width="2"/>
  
  <!-- Eye on lit side -->
  <circle cx="175" cy="190" r="4" fill="#333"/>
  
  <!-- Eye on dark side (barely visible) -->
  <circle cx="225" cy="190" r="4" fill="#111" opacity="0.5"/>
  
  <!-- Nose on split line -->
  <line x1="200" y1="185" x2="200" y2="210" stroke="#444" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Key Light (90° to side) -->
  <g id="keyLight">
    <!-- Light source -->
    <rect x="60" y="170" width="35" height="60" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="77" cy="200" r="9" fill="#ffed4e"/>
    
    <!-- Light rays to left side only -->
    <line x1="95" y1="180" x2="135" y2="180" stroke="#ffed4e" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    <line x1="95" y1="195" x2="135" y2="195" stroke="#ffed4e" stroke-width="5" opacity="0.9" stroke-linecap="round"/>
    <line x1="95" y1="210" x2="135" y2="210" stroke="#ffed4e" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 95 175 L 140 165 L 140 235 L 95 225 Z" fill="#ffed4e" opacity="0.2"/>
    
    <!-- Label -->
    <text x="77" y="265" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Key Light</text>
    <text x="77" y="280" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">90° angle</text>
    <text x="77" y="293" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Directly side</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="340" y="185" width="40" height="30" fill="#555" rx="3"/>
    <circle cx="360" cy="200" r="8" fill="#333"/>
    <circle cx="360" cy="200" r="4" fill="#666"/>
    <text x="360" y="235" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Split indicator -->
  <g id="splitIndicator">
    <line x1="200" y1="120" x2="200" y2="280" stroke="#ff6b6b" stroke-width="2" opacity="0.6" stroke-dasharray="5,5"/>
    <text x="210" y="125" font-family="Arial, sans-serif" font-size="11" fill="#ff6b6b">Split Line</text>
  </g>
  
  <!-- Light/Dark labels -->
  <text x="160" y="200" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Lit</text>
  <text x="240" y="200" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Dark</text>
  
  <!-- 90° angle indicator -->
  <path d="M 200 200 L 140 200 L 140 190 L 130 190" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="3,3"/>
  <text x="135" y="185" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">90°</text>
  
  <!-- 50/50 indicator -->
  <g id="fiftyFifty">
    <rect x="150" y="280" width="40" height="20" fill="#4caf50" opacity="0.7" rx="3"/>
    <text x="170" y="294" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">50%</text>
    
    <rect x="210" y="280" width="40" height="20" fill="#666" opacity="0.7" rx="3"/>
    <text x="230" y="294" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">50%</text>
  </g>
  
  <!-- Description -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Half face bright, half in shadow</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Dramatic, strong contrast</text>
  
  <!-- Difficulty badge -->
  <rect x="10" y="10" width="80" height="25" fill="#ff9800" rx="12"/>
  <text x="50" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Intermediate</text>
  
  <!-- Use case -->
  <text x="380" y="370" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="end">Dramatic</text>
  <text x="380" y="383" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="end">Masculine</text>
</svg>

