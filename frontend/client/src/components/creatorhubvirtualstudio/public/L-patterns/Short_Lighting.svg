<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Short Lighting</text>
  
  <!-- Subject (face circle) -->
  <circle cx="200" cy="200" r="60" fill="#4a4a4a" stroke="#666" stroke-width="2"/>
  
  <!-- Face turned away from camera - shadow side facing camera -->
  <path d="M 200 140 Q 240 200 200 260" fill="#2a2a2a" opacity="0.8"/>
  
  <!-- Lit side (away from camera) -->
  <path d="M 200 140 Q 160 200 200 260" fill="#888" opacity="0.9"/>
  
  <!-- Eye on shadow side -->
  <circle cx="215" cy="190" r="4" fill="#333"/>
  
  <!-- Eye on lit side -->
  <circle cx="185" cy="190" r="4" fill="#666"/>
  
  <!-- Nose -->
  <line x1="200" y1="190" x2="205" y2="210" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Key Light (from behind, lighting far side) -->
  <g id="keyLight">
    <!-- Light source -->
    <rect x="80" y="170" width="30" height="60" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="95" cy="200" r="8" fill="#ffed4e"/>
    
    <!-- Light rays to far side of face -->
    <line x1="110" y1="180" x2="160" y2="180" stroke="#ffed4e" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <line x1="110" y1="200" x2="160" y2="200" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <line x1="110" y1="220" x2="160" y2="220" stroke="#ffed4e" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 110 175 L 165 165 L 165 235 L 110 225 Z" fill="#ffed4e" opacity="0.15"/>
    
    <!-- Label -->
    <text x="95" y="260" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Key Light</text>
    <text x="95" y="275" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">45-50°</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="340" y="185" width="40" height="30" fill="#555" rx="3"/>
    <circle cx="360" cy="200" r="8" fill="#333"/>
    <circle cx="360" cy="200" r="4" fill="#666"/>
    <text x="360" y="235" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Arrow showing face direction (turned away from camera) -->
  <path d="M 200 130 L 180 120 L 180 125 L 160 125 L 160 135 L 180 135 L 180 140 Z" fill="#ff6b6b" opacity="0.7"/>
  <text x="140" y="115" font-family="Arial, sans-serif" font-size="10" fill="#ff6b6b">Face turned</text>
  <text x="140" y="127" font-family="Arial, sans-serif" font-size="10" fill="#ff6b6b">away</text>
  
  <!-- Shadow indicator on near side -->
  <text x="240" y="200" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="start">Shadow</text>
  <text x="240" y="213" font-family="Arial, sans-serif" font-size="11" fill="#666" text-anchor="start">side</text>
  
  <!-- Description -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Side facing camera is in shadow</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Creates depth and dimension</text>
  
  <!-- Difficulty badge -->
  <rect x="320" y="10" width="70" height="25" fill="#ff6b6b" rx="12"/>
  <text x="355" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Advanced</text>
</svg>

