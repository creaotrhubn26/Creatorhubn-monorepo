<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Loop Lighting</text>
  
  <!-- Subject (face circle) -->
  <circle cx="200" cy="200" r="60" fill="#6a6a6a" stroke="#888" stroke-width="2"/>
  
  <!-- Slight shadow on right side -->
  <path d="M 200 140 Q 245 200 200 260" fill="#3a3a3a" opacity="0.5"/>
  
  <!-- Loop shadow from nose (doesn't connect to cheek) -->
  <ellipse cx="210" cy="215" rx="8" ry="12" fill="#2a2a2a" opacity="0.6" transform="rotate(-20 210 215)"/>
  
  <!-- Eyes -->
  <circle cx="185" cy="190" r="4" fill="#333"/>
  <circle cx="215" cy="190" r="4" fill="#333"/>
  
  <!-- Nose -->
  <line x1="200" y1="190" x2="203" y2="210" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Mouth -->
  <path d="M 185 225 Q 200 230 215 225" stroke="#555" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Key Light (30-45° to side, slightly above) -->
  <g id="keyLight">
    <!-- Light source -->
    <rect x="85" y="145" width="40" height="70" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="105" cy="180" r="10" fill="#ffed4e"/>
    
    <!-- Light rays -->
    <line x1="125" y1="165" x2="160" y2="175" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <line x1="125" y1="180" x2="160" y2="190" stroke="#ffed4e" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
    <line x1="125" y1="195" x2="160" y2="205" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 125 160 L 165 170 L 165 210 L 125 200 Z" fill="#ffed4e" opacity="0.2"/>
    
    <!-- Label -->
    <text x="105" y="255" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Key Light</text>
    <text x="105" y="270" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">30-45° angle</text>
    <text x="105" y="283" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Slightly above</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="340" y="185" width="40" height="30" fill="#555" rx="3"/>
    <circle cx="360" cy="200" r="8" fill="#333"/>
    <circle cx="360" cy="200" r="4" fill="#666"/>
    <text x="360" y="235" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Loop shadow indicator -->
  <g id="loopIndicator">
    <ellipse cx="210" cy="215" rx="8" ry="12" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.8" transform="rotate(-20 210 215)"/>
    <text x="230" y="220" font-family="Arial, sans-serif" font-size="11" fill="#ff6b6b">Loop</text>
    <text x="230" y="233" font-family="Arial, sans-serif" font-size="9" fill="#ff6b6b">shadow</text>
  </g>
  
  <!-- No connection line -->
  <line x1="218" y1="220" x2="235" y2="220" stroke="#4caf50" stroke-width="2" opacity="0.7" stroke-dasharray="3,3"/>
  <text x="240" y="223" font-family="Arial, sans-serif" font-size="9" fill="#4caf50">No connection</text>
  <text x="240" y="234" font-family="Arial, sans-serif" font-size="9" fill="#4caf50">to cheek</text>
  
  <!-- Angle indicator -->
  <path d="M 200 200 L 160 200 Q 165 185 175 172" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="3,3"/>
  <text x="165" y="190" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">30-45°</text>
  
  <!-- Description -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Small loop shadow - doesn't connect to cheek</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Flattering for most faces</text>
  
  <!-- Difficulty badge -->
  <rect x="10" y="10" width="70" height="25" fill="#4caf50" rx="12"/>
  <text x="45" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Beginner</text>
  
  <!-- Featured star -->
  <circle cx="370" cy="22" r="15" fill="#ffd700"/>
  <path d="M 370 14 L 372 20 L 378 20 L 373 24 L 375 30 L 370 26 L 365 30 L 367 24 L 362 20 L 368 20 Z" fill="#fff"/>
</svg>

