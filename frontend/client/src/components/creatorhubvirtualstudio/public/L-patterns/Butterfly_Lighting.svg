<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Butterfly Lighting</text>
  
  <!-- Subject (face circle) - evenly lit -->
  <circle cx="200" cy="200" r="60" fill="#7a7a7a" stroke="#999" stroke-width="2"/>
  
  <!-- Butterfly shadow under nose -->
  <path d="M 195 212 Q 200 218 205 212 Q 200 215 195 212 Z" fill="#3a3a3a" opacity="0.7"/>
  
  <!-- Eyes -->
  <circle cx="185" cy="190" r="5" fill="#333"/>
  <circle cx="215" cy="190" r="5" fill="#333"/>
  
  <!-- Eye highlights (catchlights) -->
  <circle cx="187" cy="188" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="217" cy="188" r="2" fill="#fff" opacity="0.8"/>
  
  <!-- Nose -->
  <line x1="200" y1="190" x2="200" y2="210" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Cheekbones highlighted -->
  <ellipse cx="175" cy="205" rx="12" ry="8" fill="#999" opacity="0.3"/>
  <ellipse cx="225" cy="205" rx="12" ry="8" fill="#999" opacity="0.3"/>
  
  <!-- Mouth -->
  <path d="M 185 225 Q 200 232 215 225" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Key Light (directly above and in front) -->
  <g id="keyLight">
    <!-- Light source -->
    <rect x="170" y="70" width="60" height="40" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="200" cy="90" r="12" fill="#ffed4e"/>
    
    <!-- Light rays downward -->
    <line x1="185" y1="110" x2="185" y2="145" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <line x1="200" y1="110" x2="200" y2="145" stroke="#ffed4e" stroke-width="6" opacity="0.9" stroke-linecap="round"/>
    <line x1="215" y1="110" x2="215" y2="145" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 165 110 L 150 150 L 250 150 L 235 110 Z" fill="#ffed4e" opacity="0.25"/>
    
    <!-- Label -->
    <text x="200" y="60" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Key Light</text>
    <text x="200" y="50" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Directly above</text>
  </g>
  
  <!-- Optional reflector below -->
  <g id="reflector" opacity="0.6">
    <rect x="170" y="290" width="60" height="20" fill="#ddd" opacity="0.5" rx="3"/>
    <line x1="185" y1="290" x2="185" y2="265" stroke="#e0e0e0" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <line x1="200" y1="290" x2="200" y2="265" stroke="#e0e0e0" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
    <line x1="215" y1="290" x2="215" y2="265" stroke="#e0e0e0" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <text x="200" y="325" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Optional Reflector</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="180" y="330" width="40" height="25" fill="#555" rx="3"/>
    <circle cx="200" cy="342" r="6" fill="#333"/>
    <circle cx="200" cy="342" r="3" fill="#666"/>
    <text x="200" y="370" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Butterfly shadow indicator -->
  <g id="butterflyIndicator">
    <path d="M 195 212 Q 200 218 205 212 Q 200 215 195 212 Z" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.8"/>
    <text x="220" y="218" font-family="Arial, sans-serif" font-size="11" fill="#ff6b6b">Butterfly</text>
    <text x="220" y="230" font-family="Arial, sans-serif" font-size="9" fill="#ff6b6b">shadow</text>
  </g>
  
  <!-- Symmetry indicator -->
  <line x1="200" y1="140" x2="200" y2="260" stroke="#4caf50" stroke-width="1" opacity="0.4" stroke-dasharray="5,5"/>
  <text x="120" y="200" font-family="Arial, sans-serif" font-size="10" fill="#4caf50">Symmetrical</text>
  
  <!-- Description -->
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Butterfly-shaped shadow under nose</text>
  
  <!-- Difficulty badge -->
  <rect x="10" y="10" width="70" height="25" fill="#4caf50" rx="12"/>
  <text x="45" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Beginner</text>
  
  <!-- Use case -->
  <text x="380" y="370" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="end">Glamour</text>
  <text x="380" y="383" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="end">Beauty</text>
</svg>

