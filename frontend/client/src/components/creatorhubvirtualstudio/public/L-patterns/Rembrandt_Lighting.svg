<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Rembrandt Lighting</text>
  
  <!-- Subject (face circle) -->
  <circle cx="200" cy="200" r="60" fill="#5a5a5a" stroke="#777" stroke-width="2"/>
  
  <!-- Shadow side (right half) -->
  <path d="M 200 140 Q 260 200 200 260 Z" fill="#2a2a2a" opacity="0.7"/>
  
  <!-- Rembrandt triangle (light triangle under eye on shadow side) -->
  <path d="M 215 195 L 225 205 L 215 210 Z" fill="#888" opacity="0.8"/>
  
  <!-- Eyes -->
  <circle cx="185" cy="190" r="4" fill="#333"/>
  <circle cx="215" cy="190" r="4" fill="#333"/>
  
  <!-- Nose with shadow -->
  <line x1="200" y1="190" x2="205" y2="210" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <path d="M 205 195 L 220 205" stroke="#2a2a2a" stroke-width="2" opacity="0.6"/>
  
  <!-- Key Light (45° to side, slightly above) -->
  <g id="keyLight">
    <!-- Light source -->
    <rect x="70" y="140" width="40" height="70" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="90" cy="175" r="10" fill="#ffed4e"/>
    
    <!-- Light rays -->
    <line x1="110" y1="160" x2="150" y2="170" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <line x1="110" y1="175" x2="150" y2="185" stroke="#ffed4e" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
    <line x1="110" y1="190" x2="150" y2="200" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 110 155 L 145 165 L 145 215 L 110 195 Z" fill="#ffed4e" opacity="0.2"/>
    
    <!-- Label -->
    <text x="90" y="250" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Key Light</text>
    <text x="90" y="265" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">45° angle</text>
    <text x="90" y="278" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Above eye</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="340" y="185" width="40" height="30" fill="#555" rx="3"/>
    <circle cx="360" cy="200" r="8" fill="#333"/>
    <circle cx="360" cy="200" r="4" fill="#666"/>
    <text x="360" y="235" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Triangle indicator -->
  <g id="triangleIndicator">
    <path d="M 215 195 L 225 205 L 215 210 Z" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
    <text x="240" y="205" font-family="Arial, sans-serif" font-size="11" fill="#ffd700">Triangle</text>
  </g>
  
  <!-- Angle indicator -->
  <path d="M 200 200 L 150 200 Q 160 180 170 165" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="3,3"/>
  <text x="155" y="185" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">45°</text>
  
  <!-- Description -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Triangle of light under eye on shadow side</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Classic dramatic portrait lighting</text>
  
  <!-- Difficulty badge -->
  <rect x="10" y="10" width="80" height="25" fill="#ff9800" rx="12"/>
  <text x="50" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Intermediate</text>
  
  <!-- Featured star -->
  <circle cx="370" cy="22" r="15" fill="#ffd700"/>
  <path d="M 370 14 L 372 20 L 378 20 L 373 24 L 375 30 L 370 26 L 365 30 L 367 24 L 362 20 L 368 20 Z" fill="#fff"/>
</svg>

