<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Backlight / Rim Lighting</text>
  
  <!-- Subject (face circle - mostly dark with rim light) -->
  <circle cx="200" cy="200" r="60" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  
  <!-- Rim light glow on left edge -->
  <path d="M 145 165 Q 140 200 145 235" stroke="#ffed4e" stroke-width="10" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M 148 170 Q 145 200 148 230" stroke="#fff" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Rim light glow on right edge -->
  <path d="M 255 165 Q 260 200 255 235" stroke="#ffed4e" stroke-width="10" fill="none" opacity="0.8" stroke-linecap="round"/>
  <path d="M 252 170 Q 255 200 252 230" stroke="#fff" stroke-width="4" fill="none" opacity="0.5" stroke-linecap="round"/>
  
  <!-- Hair glow on top -->
  <ellipse cx="200" cy="145" rx="50" ry="10" fill="#ffed4e" opacity="0.6"/>
  <ellipse cx="200" cy="145" rx="45" ry="7" fill="#fff" opacity="0.3"/>
  
  <!-- Shoulder glow -->
  <ellipse cx="160" cy="255" rx="20" ry="8" fill="#ffed4e" opacity="0.5" transform="rotate(-20 160 255)"/>
  <ellipse cx="240" cy="255" rx="20" ry="8" fill="#ffed4e" opacity="0.5" transform="rotate(20 240 255)"/>
  
  <!-- Face features (barely visible) -->
  <circle cx="185" cy="190" r="3" fill="#444" opacity="0.4"/>
  <circle cx="215" cy="190" r="3" fill="#444" opacity="0.4"/>
  
  <!-- Backlight / Rim Light (behind subject) -->
  <g id="backlight">
    <!-- Light source -->
    <rect x="180" y="80" width="40" height="30" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="200" cy="95" r="10" fill="#ffed4e"/>
    
    <!-- Light rays spreading outward -->
    <line x1="190" y1="110" x2="150" y2="150" stroke="#ffed4e" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <line x1="200" y1="110" x2="200" y2="140" stroke="#ffed4e" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <line x1="210" y1="110" x2="250" y2="150" stroke="#ffed4e" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    
    <!-- Light spreading cone -->
    <path d="M 180 110 L 140 160 L 260 160 L 220 110 Z" fill="#ffed4e" opacity="0.15"/>
    
    <!-- Label -->
    <text x="200" y="70" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Backlight</text>
    <text x="200" y="58" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Behind subject</text>
  </g>
  
  <!-- Optional front fill light (very subtle) -->
  <g id="fillLight" opacity="0.5">
    <rect x="185" y="310" width="30" height="20" fill="#87ceeb" opacity="0.6" rx="3"/>
    <line x1="195" y1="310" x2="190" y2="265" stroke="#b0e0e6" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <line x1="200" y1="310" x2="200" y2="265" stroke="#b0e0e6" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
    <line x1="205" y1="310" x2="210" y2="265" stroke="#b0e0e6" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <text x="200" y="345" font-family="Arial, sans-serif" font-size="10" fill="#87ceeb" text-anchor="middle">Optional Fill</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="180" y="330" width="40" height="25" fill="#555" rx="3"/>
    <circle cx="200" cy="342" r="6" fill="#333"/>
    <circle cx="200" cy="342" r="3" fill="#666"/>
    <text x="200" y="370" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Glow indicators -->
  <g id="glowIndicators">
    <text x="120" y="200" font-family="Arial, sans-serif" font-size="11" fill="#ffd700" text-anchor="end">Rim</text>
    <text x="120" y="213" font-family="Arial, sans-serif" font-size="11" fill="#ffd700" text-anchor="end">Glow</text>
    
    <text x="280" y="200" font-family="Arial, sans-serif" font-size="11" fill="#ffd700" text-anchor="start">Rim</text>
    <text x="280" y="213" font-family="Arial, sans-serif" font-size="11" fill="#ffd700" text-anchor="start">Glow</text>
    
    <text x="200" y="130" font-family="Arial, sans-serif" font-size="11" fill="#ffd700" text-anchor="middle">Hair Glow</text>
  </g>
  
  <!-- Arrows showing light direction -->
  <path d="M 200 120 L 150 155 L 155 150 M 150 155 L 155 160" stroke="#ffd700" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 200 120 L 250 155 L 245 150 M 250 155 L 245 160" stroke="#ffd700" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Description -->
  <text x="200" y="390" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Glowing outline around hair and shoulders</text>
  
  <!-- Difficulty badge -->
  <rect x="10" y="10" width="80" height="25" fill="#ff9800" rx="12"/>
  <text x="50" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Intermediate</text>
  
  <!-- Use case -->
  <text x="380" y="370" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="end">Cinematic</text>
  <text x="380" y="383" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="end">Dramatic</text>
</svg>

