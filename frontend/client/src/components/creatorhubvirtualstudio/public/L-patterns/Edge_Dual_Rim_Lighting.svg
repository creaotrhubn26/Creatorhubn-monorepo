<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Edge / Dual Rim Lighting</text>
  
  <!-- Subject (face circle) - mostly dark with edge highlights -->
  <circle cx="200" cy="200" r="60" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  
  <!-- Left edge highlight -->
  <path d="M 145 160 Q 140 200 145 240" stroke="#ffed4e" stroke-width="8" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M 148 165 Q 145 200 148 235" stroke="#fff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Right edge highlight -->
  <path d="M 255 160 Q 260 200 255 240" stroke="#ffed4e" stroke-width="8" fill="none" opacity="0.9" stroke-linecap="round"/>
  <path d="M 252 165 Q 255 200 252 235" stroke="#fff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Face features (barely visible) -->
  <circle cx="185" cy="190" r="3" fill="#444" opacity="0.5"/>
  <circle cx="215" cy="190" r="3" fill="#444" opacity="0.5"/>
  
  <!-- Left Rim Light -->
  <g id="leftRimLight">
    <!-- Light source -->
    <rect x="50" y="170" width="30" height="60" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="65" cy="200" r="8" fill="#ffed4e"/>
    
    <!-- Light rays to left edge -->
    <line x1="80" y1="180" x2="135" y2="170" stroke="#ffed4e" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <line x1="80" y1="200" x2="135" y2="200" stroke="#ffed4e" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    <line x1="80" y1="220" x2="135" y2="230" stroke="#ffed4e" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 80 175 L 140 155 L 140 245 L 80 225 Z" fill="#ffed4e" opacity="0.15"/>
    
    <!-- Label -->
    <text x="65" y="270" font-family="Arial, sans-serif" font-size="11" fill="#ffd700" text-anchor="middle">Left Rim</text>
    <text x="65" y="283" font-family="Arial, sans-serif" font-size="9" fill="#999" text-anchor="middle">Behind</text>
  </g>
  
  <!-- Right Rim Light -->
  <g id="rightRimLight">
    <!-- Light source -->
    <rect x="320" y="170" width="30" height="60" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="335" cy="200" r="8" fill="#ffed4e"/>
    
    <!-- Light rays to right edge -->
    <line x1="320" y1="180" x2="265" y2="170" stroke="#ffed4e" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <line x1="320" y1="200" x2="265" y2="200" stroke="#ffed4e" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
    <line x1="320" y1="220" x2="265" y2="230" stroke="#ffed4e" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 320 175 L 260 155 L 260 245 L 320 225 Z" fill="#ffed4e" opacity="0.15"/>
    
    <!-- Label -->
    <text x="335" y="270" font-family="Arial, sans-serif" font-size="11" fill="#ffd700" text-anchor="middle">Right Rim</text>
    <text x="335" y="283" font-family="Arial, sans-serif" font-size="9" fill="#999" text-anchor="middle">Behind</text>
  </g>
  
  <!-- Optional front fill (very subtle) -->
  <g id="frontFill" opacity="0.4">
    <rect x="185" y="310" width="30" height="20" fill="#87ceeb" opacity="0.6" rx="3"/>
    <line x1="200" y1="310" x2="200" y2="265" stroke="#b0e0e6" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <text x="200" y="345" font-family="Arial, sans-serif" font-size="10" fill="#87ceeb" text-anchor="middle">Optional Fill</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="180" y="320" width="40" height="25" fill="#555" rx="3"/>
    <circle cx="200" cy="332" r="6" fill="#333"/>
    <circle cx="200" cy="332" r="3" fill="#666"/>
    <text x="200" y="365" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Glow effect around edges -->
  <ellipse cx="145" cy="200" rx="8" ry="40" fill="#ffed4e" opacity="0.2"/>
  <ellipse cx="255" cy="200" rx="8" ry="40" fill="#ffed4e" opacity="0.2"/>
  
  <!-- Description -->
  <text x="200" y="385" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Dramatic edge highlights on both sides</text>
  
  <!-- Difficulty badge -->
  <rect x="10" y="10" width="80" height="25" fill="#ff9800" rx="12"/>
  <text x="50" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Intermediate</text>
  
  <!-- Use case -->
  <text x="380" y="370" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="end">Fashion</text>
  <text x="380" y="383" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="end">Editorial</text>
</svg>

