<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Broad Lighting</text>
  
  <!-- Subject (face circle - turned slightly away from camera) -->
  <ellipse cx="200" cy="200" rx="55" ry="60" fill="#6a6a6a" stroke="#888" stroke-width="2"/>
  
  <!-- Broad side (facing camera) - lit -->
  <path d="M 200 140 Q 250 200 200 260" fill="#888" opacity="0.7"/>
  
  <!-- Narrow side (away from camera) - darker -->
  <path d="M 200 140 Q 150 200 200 260" fill="#3a3a3a" opacity="0.6"/>
  
  <!-- Eyes -->
  <circle cx="210" cy="190" r="4" fill="#333"/>
  <circle cx="180" cy="192" r="3" fill="#444" opacity="0.7"/>
  
  <!-- Nose (angled) -->
  <line x1="195" y1="190" x2="200" y2="210" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Face turned indicator -->
  <path d="M 200 200 Q 190 200 185 195" stroke="#666" stroke-width="1" fill="none"/>
  
  <!-- Key Light (lighting the broad/camera-facing side) -->
  <g id="keyLight">
    <!-- Light source -->
    <rect x="280" y="160" width="40" height="70" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="300" cy="195" r="10" fill="#ffed4e"/>
    
    <!-- Light rays to broad side -->
    <line x1="280" y1="175" x2="245" y2="180" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <line x1="280" y1="195" x2="245" y2="200" stroke="#ffed4e" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
    <line x1="280" y1="215" x2="245" y2="220" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 280 170 L 250 175 L 250 225 L 280 220 Z" fill="#ffed4e" opacity="0.2"/>
    
    <!-- Label -->
    <text x="300" y="265" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Key Light</text>
    <text x="300" y="280" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">~40° angle</text>
    <text x="300" y="293" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="middle">Lights broad side</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="340" y="185" width="40" height="30" fill="#555" rx="3"/>
    <circle cx="360" cy="200" r="8" fill="#333"/>
    <circle cx="360" cy="200" r="4" fill="#666"/>
    <text x="360" y="235" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Face direction arrow -->
  <path d="M 200 130 L 180 120 L 180 125 L 160 125 L 160 135 L 180 135 L 180 140 Z" fill="#87ceeb" opacity="0.7"/>
  <text x="140" y="115" font-family="Arial, sans-serif" font-size="10" fill="#87ceeb">Face turned</text>
  <text x="140" y="127" font-family="Arial, sans-serif" font-size="10" fill="#87ceeb">slightly away</text>
  
  <!-- Broad side indicator -->
  <g id="broadSide">
    <rect x="230" y="190" width="50" height="20" fill="#ffd700" opacity="0.3" rx="3"/>
    <text x="255" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffd700" text-anchor="middle">Broad</text>
    <text x="255" y="225" font-family="Arial, sans-serif" font-size="9" fill="#ffd700" text-anchor="middle">(Lit side)</text>
  </g>
  
  <!-- Narrow side indicator -->
  <g id="narrowSide">
    <rect x="120" y="190" width="50" height="20" fill="#666" opacity="0.5" rx="3"/>
    <text x="145" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ccc" text-anchor="middle">Narrow</text>
    <text x="145" y="225" font-family="Arial, sans-serif" font-size="9" fill="#999" text-anchor="middle">(Shadow)</text>
  </g>
  
  <!-- Angle indicator -->
  <path d="M 200 200 L 250 200 Q 245 185 235 175" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="3,3"/>
  <text x="245" y="190" font-family="Arial, sans-serif" font-size="10" fill="#ffd700">~40°</text>
  
  <!-- Description -->
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Side facing camera is lit (broad side)</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="middle">Makes face appear wider</text>
  
  <!-- Difficulty badge -->
  <rect x="10" y="10" width="80" height="25" fill="#ff9800" rx="12"/>
  <text x="50" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Intermediate</text>
  
  <!-- Use case -->
  <text x="20" y="370" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="start">Fashion</text>
  <text x="20" y="383" font-family="Arial, sans-serif" font-size="10" fill="#999" text-anchor="start">Editorial</text>
</svg>

