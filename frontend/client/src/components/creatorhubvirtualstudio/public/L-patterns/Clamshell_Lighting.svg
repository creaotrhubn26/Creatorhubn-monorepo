<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Clamshell Lighting</text>
  
  <!-- Subject (face circle) -->
  <circle cx="200" cy="200" r="60" fill="#6a6a6a" stroke="#888" stroke-width="2"/>
  
  <!-- Face features -->
  <circle cx="185" cy="190" r="4" fill="#333"/>
  <circle cx="215" cy="190" r="4" fill="#333"/>
  <ellipse cx="200" cy="215" rx="15" ry="8" fill="#555" opacity="0.3"/>
  
  <!-- Nose -->
  <line x1="200" y1="190" x2="200" y2="210" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Top Light (Key) -->
  <g id="topLight">
    <!-- Light source -->
    <rect x="170" y="60" width="60" height="30" fill="#ffd700" opacity="0.8" rx="5"/>
    <circle cx="200" cy="75" r="10" fill="#ffed4e"/>
    
    <!-- Light rays downward -->
    <line x1="180" y1="90" x2="180" y2="140" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <line x1="200" y1="90" x2="200" y2="140" stroke="#ffed4e" stroke-width="5" opacity="0.8" stroke-linecap="round"/>
    <line x1="220" y1="90" x2="220" y2="140" stroke="#ffed4e" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 165 90 L 140 145 L 260 145 L 235 90 Z" fill="#ffed4e" opacity="0.2"/>
    
    <!-- Label -->
    <text x="200" y="55" font-family="Arial, sans-serif" font-size="12" fill="#ffd700" text-anchor="middle">Top Light</text>
  </g>
  
  <!-- Bottom Light (Fill) - Reflector or light -->
  <g id="bottomLight">
    <!-- Light source / Reflector -->
    <rect x="170" y="310" width="60" height="30" fill="#87ceeb" opacity="0.8" rx="5"/>
    <circle cx="200" cy="325" r="10" fill="#b0e0e6"/>
    
    <!-- Light rays upward -->
    <line x1="180" y1="310" x2="180" y2="260" stroke="#b0e0e6" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    <line x1="200" y1="310" x2="200" y2="260" stroke="#b0e0e6" stroke-width="4" opacity="0.7" stroke-linecap="round"/>
    <line x1="220" y1="310" x2="220" y2="260" stroke="#b0e0e6" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
    
    <!-- Light cone -->
    <path d="M 165 310 L 140 255 L 260 255 L 235 310 Z" fill="#b0e0e6" opacity="0.15"/>
    
    <!-- Label -->
    <text x="200" y="355" font-family="Arial, sans-serif" font-size="12" fill="#87ceeb" text-anchor="middle">Fill / Reflector</text>
  </g>
  
  <!-- Camera position indicator -->
  <g id="camera">
    <rect x="340" y="185" width="40" height="30" fill="#555" rx="3"/>
    <circle cx="360" cy="200" r="8" fill="#333"/>
    <circle cx="360" cy="200" r="4" fill="#666"/>
    <text x="360" y="235" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="middle">Camera</text>
  </g>
  
  <!-- Clamshell shape indicator -->
  <path d="M 140 145 Q 200 120 260 145" stroke="#ffd700" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="5,5"/>
  <path d="M 140 255 Q 200 280 260 255" stroke="#87ceeb" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="5,5"/>
  
  <!-- Arrows showing light direction -->
  <path d="M 200 100 L 200 130 L 195 125 M 200 130 L 205 125" stroke="#ffd700" stroke-width="2" fill="none"/>
  <path d="M 200 300 L 200 270 L 195 275 M 200 270 L 205 275" stroke="#87ceeb" stroke-width="2" fill="none"/>
  
  <!-- Description -->
  <text x="200" y="380" font-family="Arial, sans-serif" font-size="13" fill="#ccc" text-anchor="middle">Soft, even lighting from top and bottom</text>
  
  <!-- Difficulty badge -->
  <rect x="10" y="10" width="70" height="25" fill="#4caf50" rx="12"/>
  <text x="45" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Beginner</text>
  
  <!-- Pattern indicator -->
  <text x="20" y="370" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="start">Beauty</text>
  <text x="20" y="383" font-family="Arial, sans-serif" font-size="11" fill="#999" text-anchor="start">Fashion</text>
</svg>

