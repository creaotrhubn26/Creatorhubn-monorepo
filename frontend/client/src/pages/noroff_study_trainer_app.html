<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #0f172a;
      --fg: #ffffff;
      --header-bg: #1e3a8a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-soft: #0ea5e9;
      --border-subtle: #4b5563;
    }
    body.light {
      --bg: #f9fafb;
      --fg: #0f172a;
      --header-bg: #e5e7eb;
      --card-bg: #ffffff;
      --accent: #2563eb;
      --accent-soft: #3b82f6;
      --border-subtle: #cbd5f5;
    }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 0;
      transition: background 0.25s ease, color 0.25s ease;
    }
    header {
      background: var(--header-bg);
      padding: 20px 70px 20px 20px;
      text-align: center;
      position: relative;
    }
    h1 { margin: 0; }
    header p { margin: 6px 0 0; font-size: 0.9rem; opacity: 0.9; }
    #themeToggle {
      position: absolute;
      right: 16px;
      top: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--card-bg);
      color: var(--fg);
      cursor: pointer;
      font-size: 0.8rem;
    }
    .container { padding: 20px; max-width: 1200px; margin: 0 auto 40px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab {
      padding: 8px 16px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      background: transparent;
      color: var(--fg);
    }
    .tab.active {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
    }
    .section { display: none; }
    .section.active { display: block; }
    .module, .lexicon-entry, .notes-entry, .project, .exercise-box, .dataset-box {
      background: var(--card-bg);
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }
    .module h3 { margin-top: 0; }
    .task { display: flex; gap: 10px; align-items: flex-start; margin: 5px 0; font-size: 0.9rem; }
    .task input { margin-top: 3px; }
    .chart-container {
      width: 100%;
      height: 260px;
      margin-bottom: 8px;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 8px;
      border: 1px solid var(--border-subtle);
    }
    textarea {
      width: 100%;
      height: 140px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      padding: 10px;
      background: var(--bg);
      color: var(--fg);
      resize: vertical;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 0.9rem;
    }
    .primary { background: var(--accent); color: #0f172a; }
    .secondary { background: transparent; color: var(--fg); border: 1px solid var(--border-subtle); }
    a { color: var(--accent-soft); text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { padding-left: 18px; margin: 6px 0; }
    details summary { cursor: pointer; font-size: 0.85rem; margin-top: 4px; }
    pre { background: #020617; color: #e5e7eb; padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 0.8rem; }
    body.light pre { background: #0f172a; color: #e5e7eb; }
    small { font-size: 0.8rem; opacity: 0.8; }
  </style>
</head>

function applyTheme() {

  }

// ---------------- Tabs-aktivering ----------------
function activateTab(id) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  const activeTab = document.querySelector(`.tab[data-id="${id}"]`);
  if (activeTab) activeTab.classList.add("active");
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  const sec = document.getElementById(`section-${id}`);
  if (sec) sec.classList.add("active");
}

  tab.addEventListener('click', () => activateTab(tab.dataset.id));
});

// ---------------- Oppgaver + progresjon ----------------
function initTasks() {
  const checkboxes = document.querySelectorAll('.task input[type="checkbox"]');
  checkboxes.forEach((cb, idx) => {
    let key = cb.dataset.key || `task_${idx}`;
    cb.dataset.key = key;
    if (taskState[key]) {
      cb.checked = true;
    }
    cb.addEventListener('change', () => {
      taskState[key] = cb.checked;
      localStorage.setItem("noroff_tasks", JSON.stringify(taskState));
      drawProgressChart();
    });
  });
}

function computeProgress() {
  const checkboxes = document.querySelectorAll('.task input[type="checkbox"]');
  let total = 0, done = 0;
  let yearTotals = { year1: 0, year2: 0 };
  let yearDone = { year1: 0, year2: 0 };

  checkboxes.forEach(cb => {
    total++;
    const y = cb.dataset.year;
    if (y && yearTotals[y] !== undefined) yearTotals[y]++;
    if (cb.checked) {
      done++;
      if (y && yearDone[y] !== undefined) yearDone[y]++;
    }
  });

  const pctTotal = total ? Math.round((done / total) * 100) : 0;
  const pctY1 = yearTotals.year1 ? Math.round((yearDone.year1 / yearTotals.year1) * 100) : 0;
  const pctY2 = yearTotals.year2 ? Math.round((yearDone.year2 / yearTotals.year2) * 100) : 0;

  return { total, done, pctTotal, pctY1, pctY2, yearTotals, yearDone };
}

function drawProgressChart() {
  const canvas = document.getElementById('progressChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;

  const { pctTotal, pctY1, pctY2 } = computeProgress();

  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  // Bakgrunn
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg');
  ctx.fillRect(0, 0, w, h);

  const barWidth = 60;
  const gap = 40;
  const startX = (w - (3 * barWidth + 2 * gap)) / 2;
  const maxBarHeight = h - 60;

  const bars = [
    { label: 'År 1', value: pctY1 },
    { label: 'År 2', value: pctY2 },
    { label: 'Totalt', value: pctTotal }
  ];

  bars.forEach((b, i) => {
    const x = startX + i * (barWidth + gap);
    const barHeight = (b.value / 100) * maxBarHeight;
    const y = h - 30 - barHeight;

    // Bakgrunnsbar
    ctx.fillStyle = 'rgba(148,163,184,0.4)';
    ctx.fillRect(x, h - 30 - maxBarHeight, barWidth, maxBarHeight);

    // Fyll
    const gradient = ctx.createLinearGradient(x, y, x, h - 30);
    gradient.addColorStop(0, getComputedStyle(document.body).getPropertyValue('--accent-soft'));
    gradient.addColorStop(1, '#22c55e');
    ctx.fillStyle = gradient;
    ctx.fillRect(x, y, barWidth, barHeight);

    // Label
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--fg');
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, x + barWidth / 2, h - 14);
    ctx.fillText(b.value + '%', x + barWidth / 2, y - 4);
  });

  const p = computeProgress();
  const txtEl = document.getElementById('progressText');
  if (txtEl) {
    txtEl.textContent = `År 1: ${p.pctY1}% (${p.yearDone.year1}/${p.yearTotals.year1}) · År 2: ${p.pctY2}% (${p.yearDone.year2}/${p.yearTotals.year2}) · Totalt: ${p.pctTotal}% (${p.done}/${p.total})`;
  }
}

// ---------------- Notater ----------------
function initNotes() {
  const notesEl = document.getElementById('notesMain');
  if (!notesEl) return;
  notesEl.value = notesState;
  notesEl.addEventListener('input', () => {
    notesState = notesEl.value;

// ---------------- Datasett-opplasting ----------------
function renderDatasetList() {
  const listEl = document.getElementById('datasetList');
  if (!listEl) return;
  if (!datasetProjects.length) {
    listEl.innerHTML = "<small>Ingen datasett registrert ennå.</small>";
    return;
  }
  listEl.innerHTML = datasetProjects
    .map(d => `<div><strong>${d.name}</strong> <small>(${(d.size/1024).toFixed(1)} kB)</small></div>`)
    .join('');
}

function initDatasets() {
  const input = document.getElementById('datasetInput');
  const clearBtn = document.getElementById('clearDatasetsBtn');
  if (input) {
    input.addEventListener('change', () => {
      Array.from(input.files || []).forEach(file => {
        datasetProjects.push({
          name: file.name,
          size: file.size,
          lastModified: file.lastModified
        });
      });
      localStorage.setItem('noroff_datasets', JSON.stringify(datasetProjects));
      renderDatasetList();
      input.value = '';
    });
  }
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      datasetProjects = [];
      localStorage.setItem('noroff_datasets', JSON.stringify(datasetProjects));
      renderDatasetList();
    });
  }
  renderDatasetList();
}

  "Critical Thinking: Velg en graf fra media og skriv hva som kan være misvisende.«"
];

function initExerciseGenerator() {
  const box = document.getElementById('exerciseBox');
  const btn = document.getElementById('exerciseBtn');
  const clearBtn = document.getElementById('exerciseClearBtn');
  if (btn && box) {
    btn.addEventListener('click', () => {
      box.style.display = 'block';
      box.textContent = exerciseList[Math.floor(Math.random() * exerciseList.length)];
    });
  }
  if (clearBtn && box) {
    clearBtn.addEventListener('click', () => {
      box.style.display = 'none';
      box.textContent = '';
    });
  }
}

// ---------------- Init ----------------
initTasks();
initNotes();
initDatasets();
initExerciseGenerator();

// Draw initial progress (after layout)
setTimeout(drawProgressChart, 100);
window.addEventListener('resize', drawProgressChart);
</script>
