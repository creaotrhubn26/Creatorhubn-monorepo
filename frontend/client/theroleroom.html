  <script>
    // Per-route meta override for rewrites that share theroleroom.html.
    // The Vercel rewrite maps /talentportal and /utdanningsinstitusjon
    // both to this file, so the default head tags describe the root
    // landing. Update title + canonical + og tags in-place based on
    // pathname so Google indexes these URLs distinctly.
    (function () {
      var routes = {
        '/talentportal': {
          title: 'Talentportal — The Role Room',
          description: 'The Role Room Talentportal samler skuespillere, modeller og crew for norske produksjoner. Meld interesse og bli invitert til relevante auditions.',
          canonical: 'https://theroleroom.com/talentportal',
          ogImage: 'https://theroleroom.com/role-room-assets/landing_backdrop_with_logo.webp'
        },
        '/utdanningsinstitusjon': {
          title: 'For utdanningsinstitusjoner — The Role Room',
          description: 'The Role Room tilbyr utdanningsinstitusjoner innen film, TV og teater partner-tilgang for studenter som søker seg mot bransjen.',
          canonical: 'https://theroleroom.com/utdanningsinstitusjon',
          ogImage: 'https://theroleroom.com/role-room-assets/landing_backdrop_with_logo.webp'
        }
      };
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var route = routes[path];
      if (!route) return;
      function setAttr(sel, attr, val) {
        var el = document.querySelector(sel);
        if (el) el.setAttribute(attr, val);
      }
      document.title = route.title;
      setAttr('meta[name="description"]', 'content', route.description);
      setAttr('link[rel="canonical"]', 'href', route.canonical);
      setAttr('meta[property="og:title"]', 'content', route.title);
      setAttr('meta[property="og:description"]', 'content', route.description);
      setAttr('meta[property="og:url"]', 'content', route.canonical);
      setAttr('meta[property="og:image"]', 'content', route.ogImage);
      setAttr('meta[name="twitter:title"]', 'content', route.title);
      setAttr('meta[name="twitter:description"]', 'content', route.description);
      setAttr('meta[name="twitter:image"]', 'content', route.ogImage);
    })();
  </script>

        trimmedValue.charAt(0) === '%' &&
        trimmedValue.charAt(trimmedValue.length - 1) === '%' &&
        trimmedValue.indexOf('VITE_') === 1;

      if (!trimmedValue || looksLikeUnresolvedVitePlaceholder) {
        return fallback;
      }

      return trimmedValue;
    }

    var GOOGLE_TAG_MANAGER_ID = 'GTM-MFWW7X83';
    var ROLE_ROOM_GOOGLE_TAG_MANAGER_ID = 'GTM-TNWTVHSP';
    var ROLE_ROOM_GA_MEASUREMENT_ID = 'G-9T7K5TJVFX';

    window.__creatorhubAnalyticsConfig = {
      site: 'role-room',
      measurementId: ROLE_ROOM_GA_MEASUREMENT_ID,
      tagManagerId: ROLE_ROOM_GOOGLE_TAG_MANAGER_ID,
    };

    function readStoredConsent() {
      try {
        var rawConsent = window.localStorage.getItem('gdpr-consent');
        if (!rawConsent) {
          return null;
        }

        var parsedConsent = JSON.parse(rawConsent);
        return parsedConsent && typeof parsedConsent === 'object' ? parsedConsent : null;
      } catch (_error) {
        return null;
      }
    }

    function buildConsentPayload(consentSettings) {
      var analyticsGranted = !!(consentSettings && consentSettings.analytics);
      var marketingGranted = !!(consentSettings && consentSettings.marketing);
      var preferencesGranted = !!(consentSettings && consentSettings.preferences);

      return {
        analytics_storage: analyticsGranted ? 'granted' : 'denied',
        ad_storage: marketingGranted ? 'granted' : 'denied',
        ad_user_data: marketingGranted ? 'granted' : 'denied',
        ad_personalization: marketingGranted ? 'granted' : 'denied',
        functionality_storage: preferencesGranted ? 'granted' : 'denied',
        personalization_storage: preferencesGranted ? 'granted' : 'denied',
        security_storage: 'granted',
        wait_for_update: 500,

    }

    function applyAnalyticsConsent(consentSettings) {
      window.gtag('consent', 'update', buildConsentPayload(consentSettings));
    }

    function hasAnalyticsConsent(consentSettings) {
      return !!(consentSettings && consentSettings.analytics);

    (function initRoleRoomGoogleTag() {
      var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      var isOnline = navigator.onLine !== false;
      var hasLoadedTagManagerScript = false;
      var hasRequestedTagManagerScript = false;
      var hasLoadedAnalyticsScript = false;
      var hasRequestedAnalyticsScript = false;
      var hasSentInitialPageView = false;
      var storedConsent = readStoredConsent();

      window.gtag('consent', 'default', buildConsentPayload(storedConsent));

      function sendInitialPageView() {
        if (hasSentInitialPageView) {
          return;
        }

        hasSentInitialPageView = true;
        window.gtag('event', 'page_view', {
          page_path: window.location.pathname,
          page_title: document.title,
          page_location: window.location.href,

        tagManagerScript.setAttribute('data-creatorhub-gtm-bootstrap', 'true');
        tagManagerScript.onload = function () {
          hasLoadedTagManagerScript = true;
        };
        tagManagerScript.onerror = function () {
          hasRequestedTagManagerScript = false;
        };
        document.head.appendChild(tagManagerScript);
        return true;
      }

      function ensureAnalyticsLoaded(consentSettings) {
        if (
          isLocalhost ||
          !isOnline ||
          !hasAnalyticsConsent(consentSettings)
        ) {
          return false;
        }

        if (hasLoadedAnalyticsScript || hasRequestedAnalyticsScript) {
          applyAnalyticsConsent(consentSettings);
          ensureTagManagerLoaded(consentSettings);
          return true;
        }

        hasRequestedAnalyticsScript = true;
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + ROLE_ROOM_GA_MEASUREMENT_ID;
        script.setAttribute('data-creatorhub-ga-bootstrap', 'true');
        script.onload = function () {
          hasLoadedAnalyticsScript = true;
          window.gtag('js', new Date());
          window.gtag('config', ROLE_ROOM_GA_MEASUREMENT_ID, {
            send_page_view: false,
          });
          applyAnalyticsConsent(consentSettings);

          sendInitialPageView();
        };
        script.onerror = function () {

        };
        document.head.appendChild(script);
        return true;
      }

      window.__creatorhubApplyConsent = function (consentSettings) {
        applyAnalyticsConsent(consentSettings);
        if (hasAnalyticsConsent(consentSettings)) {
          ensureTagManagerLoaded(consentSettings);
          ensureAnalyticsLoaded(consentSettings);
        }
        return true;
      };
      window.__creatorhubLoadAnalytics = function (consentSettings) {
        var resolvedConsent = consentSettings || readStoredConsent();
        ensureTagManagerLoaded(resolvedConsent);
        return ensureAnalyticsLoaded(resolvedConsent);
      };

      if (isLocalhost || !isOnline) {
        return;
      }

      if (hasAnalyticsConsent(storedConsent)) {
        ensureTagManagerLoaded(storedConsent);
        ensureAnalyticsLoaded(storedConsent);
      }
    })();
