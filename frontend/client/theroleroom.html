  <script type="application/ld+json" data-seo-ld="faq">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "https://theroleroom.com/#faq",
      "inLanguage": "no-NO",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Hva er The Role Room?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Role Room er en norsk casting- og produksjonsplattform for film, TV og innholdsproduksjon. Den samler roller, kandidater, auditions, manus, storyboard, crew, lokasjoner og opptaksplan i ett arbeidsrom — som et nordisk alternativ til StudioBinder, Casting Networks, MovieMagic, Yamdu og Setkeeper, med norsk språk, GDPR-trygg datalagring i EU/EØS og integrert AI-agent."
          }
        },
        {
          "@type": "Question",
          "name": "Hvem står bak The Role Room?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Role Room er bygget av CreatorHub Norge AS — et norsk teknologiselskap som leverer produksjons- og samarbeidsverktøy for kreative team. Plattformen er utviklet i samarbeid med norske castere, regissører og produsenter."
          }
        },
        {
          "@type": "Question",
          "name": "Hvor mye koster The Role Room?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Basis-tilgang til The Role Room er gratis. Det inkluderer prosjekter, casting-pipeline, talent-database, manus, storyboard og audition-planlegging. Betalt plan kommer med Live Set Pro-modus, ubegrenset crew, avansert kalender og AI-agent-bruk over en gratis kvote."
          }
        },
        {
          "@type": "Question",
          "name": "Er The Role Room et alternativ til StudioBinder?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja. The Role Room er bygget som et nordisk alternativ til StudioBinder, men med flere forskjeller: hele appen er på norsk, data lagres i EU/EØS under GDPR, det er en integrert AI-agent uten ekstra abonnement, og det er en dedikert talentportal hvor skuespillere kan registrere seg direkte uten per-session-betaling."
          }
        },
        {
          "@type": "Question",
          "name": "Hvordan fungerer audition-planleggingen?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Casting director oppretter audition-økter med tids-slots og inviterer kandidater via lenke eller e-post. Kandidater bekrefter automatisk, og de kan også spille inn selvtape direkte i appen uten ekstern fil-deling. Alle opptak samles per rolle, og castet kan vurderes i grid eller via Kanban-status med 7 trinn."
          }
        },
        {
          "@type": "Question",
          "name": "Kan studenter bruke The Role Room?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja. Studenter ved norske film-, TV- og produksjons-utdanninger (Filmskolen, NISS, Westerdals, NTNU og lignende) kan bruke The Role Room gratis for studieoppgaver, eksamen og masterprosjekt. Plattformen dekker hele kjeden fra manus til opptak."
          }
        },
        {
          "@type": "Question",
          "name": "Hvor lagres dataene mine?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "All kundedata lagres i EU/EØS hos databehandlere som er godkjent under GDPR. The Role Room signerer databehandler-avtale (DPA) med alle kunder, og data deles ikke utenfor EU/EØS uten eksplisitt samtykke."
          }
        },
        {
          "@type": "Question",
          "name": "Støtter The Role Room norske barneskuespillere?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ja. Plattformen har innebygd AML-compliance-tracker som overvåker pause-tider og arbeidsregler for mindreårige skuespillere i tråd med norsk arbeidsmiljølov. Foresatt-samtykke og medvirkningsregler håndteres i samtykkemodulen."
          }
        }
      ]
    }
  </script>
