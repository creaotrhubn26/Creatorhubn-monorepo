services:
  - type: web
    name: creatorhub-backend
    runtime: docker
    dockerfilePath: ../Dockerfile
    dockerContext: ..
    plan: free
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      # Internal URL for the existing Render Key Value instance named "redis"
      # in the same Production environment and Oregon region. Configure the
      # value in Render; never commit its connection credentials.
      - key: REALTIME_REDIS_URL
        sync: false
      # Scaling is fail-closed: the backend must not accept traffic without
      # cross-instance fanout once this guard is enabled.
      - key: REALTIME_DISTRIBUTED_FANOUT_REQUIRED
        value: "true"
      # Set false only after the ticket-capable Capture build is the enforced
      # minimum supported version.
      - key: REALTIME_ALLOW_LEGACY_TOKEN
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      # Deklarasjoner av secrets som allerede er satt i Render-dashboardet
      # (verifisert 2026-07-10, integrasjonsanalysen) — verdiene lever i
      # dashboardet (sync: false), deklarasjonen gjør fila til komplett
      # credential-manifest for tjenesten.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: TIKTOK_BUSINESS_APP_ID
        sync: false
      - key: TIKTOK_BUSINESS_APP_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      # GEO Visibility (docs/integration-audit/08) — cron-token må settes;
      # PERPLEXITY_API_KEY er valgfri (motoren hoppes over til den finnes)
      - key: GEO_VISIBILITY_CRON_TOKEN
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: ROLE_ROOM_AGENT_MODEL
        value: gpt-5.4-mini
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_MODELS_BUCKETS
        sync: false
      - key: CREATORHUB_GOOGLE_CLIENT_ID
        sync: false
      - key: CREATORHUB_GOOGLE_CLIENT_SECRET
        sync: false
      - key: CREATORHUB_GOOGLE_REDIRECT_URI
        sync: false
      - key: CREATORHUB_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ROLE_ROOM_GOOGLE_CLIENT_ID
        sync: false
      - key: ROLE_ROOM_GOOGLE_CLIENT_SECRET
        sync: false
      - key: ROLE_ROOM_GOOGLE_REDIRECT_URI
        sync: false
      - key: ROLE_ROOM_PUBLIC_URL
        sync: false
      - key: ROLE_ROOM_GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: GOOGLE_CLOUD_QUOTA_PROJECT
        sync: false
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_WORKSPACE_DOMAIN
        sync: false
      - key: GOOGLE_WORKSPACE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_IMPERSONATE_USER
        sync: false
      - key: GOOGLE_USE_IMPERSONATION
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GOOGLE_TAG_MANAGER_ID
        sync: false
      - key: VITE_CREATORHUB_GOOGLE_TAG_MANAGER_ID
        sync: false
      - key: VITE_ROLE_ROOM_GOOGLE_TAG_MANAGER_ID
        sync: false
      - key: TIDUM_SYNC_API_BASE_URL
        sync: false
      - key: TIDUM_CREATORHUB_SYNC_SECRET
        sync: false
      - key: GOOGLE_ANALYTICS_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ROLE_ROOM_LINKEDIN_CLIENT_ID
        sync: false
      - key: ROLE_ROOM_LINKEDIN_CLIENT_SECRET
        sync: false
      - key: ROLE_ROOM_LINKEDIN_REDIRECT_URI
        sync: false
      - key: ROLE_ROOM_LINKEDIN_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: EVENDI_API_URL
        sync: false
