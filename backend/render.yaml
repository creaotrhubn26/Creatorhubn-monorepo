services:
  - type: web
    name: creatorhub-backend
    runtime: docker
    dockerfilePath: ../Dockerfile
    dockerContext: ..
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Deklarasjoner av secrets som allerede er satt i Render-dashboardet
      # (verifisert 2026-07-10, integrasjonsanalysen) — verdiene lever i
      # dashboardet (sync: false), deklarasjonen gjør fila til komplett
      # credential-manifest for tjenesten.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_ADS_DEVELOPER_TOKEN
        sync: false
      - key: GOOGLE_ADS_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_ADS_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_ADS_LOGIN_CUSTOMER_ID
        sync: false
      - key: TIKTOK_BUSINESS_APP_ID
        sync: false
      - key: TIKTOK_BUSINESS_APP_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_API_VERSION
        sync: false
      - key: LINKEDIN_MATCHED_AUDIENCES_ENABLED
        sync: false
      # GEO Visibility (docs/integration-audit/08) — cron-token må settes;
      # PERPLEXITY_API_KEY er valgfri (motoren hoppes over til den finnes)
      - key: GEO_VISIBILITY_CRON_TOKEN
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: ROLE_ROOM_AGENT_MODEL
        value: gpt-5.4-mini
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_MODELS_BUCKETS
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: CLOUDFLARE_STREAM_CUSTOMER_SUBDOMAIN
        sync: false
      - key: CLOUDFLARE_STREAM_REQUIRE_SIGNED_URLS
        value: "1"
      # Runtime AWS access uses Render-managed OIDC and short-lived STS
      # credentials. Render injects AWS_WEB_IDENTITY_TOKEN_FILE on deploy.
      - key: AWS_ROLE_ARN
        value: arn:aws:iam::745600963362:role/TheRoleRoomStorageRuntimeProd
      - key: ROLE_ROOM_STORAGE_PROVIDER
        value: aws_s3
      - key: AWS_ROLE_ROOM_BUCKET_NAME
        value: the-role-room-prod-745600963362-eu-north-1
      - key: AWS_ROLE_ROOM_REGION
        value: eu-north-1
      # Temporary migration/rollback fallback; remove after final B2 audit.
      - key: AWS_ROLE_ROOM_ACCESS_KEY_ID
        sync: false
      - key: AWS_ROLE_ROOM_SECRET_ACCESS_KEY
        sync: false
      - key: ROLE_ROOM_STORAGE_PRICE_EXTRA_100_GIB_MONTHLY
        value: price_1UE6FRApjenweKvPVb4iriwW
      - key: ROLE_ROOM_STORAGE_PRICE_EXTRA_1_TIB_MONTHLY
        value: price_1UE6FSApjenweKvPtozJY97b
      - key: ROLE_ROOM_STORAGE_1_TIB_CHECKOUT_ENABLED
        value: "false"
      - key: ROLE_ROOM_STORAGE_BILLING_PORTAL_CONFIGURATION_ID
        value: bpc_1UE6FSApjenweKvPbpPJLsLl
      - key: ROLE_ROOM_STORAGE_PAYMENT_GRACE_DAYS
        value: "7"
      - key: ROLE_ROOM_AFFILIATE_PAYOUTS_ENABLED
        value: "false"
      - key: ROLE_ROOM_AFFILIATE_PAYOUT_CRON_SECRET
        sync: false
      - key: ROLE_ROOM_STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: CREATORHUB_GOOGLE_CLIENT_ID
        sync: false
      - key: CREATORHUB_GOOGLE_CLIENT_SECRET
        sync: false
      - key: CREATORHUB_GOOGLE_REDIRECT_URI
        sync: false
      - key: CREATORHUB_PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: ROLE_ROOM_GOOGLE_CLIENT_ID
        sync: false
      - key: ROLE_ROOM_GOOGLE_CLIENT_SECRET
        sync: false
      - key: ROLE_ROOM_GOOGLE_REDIRECT_URI
        sync: false
      - key: ROLE_ROOM_PUBLIC_URL
        sync: false
      - key: ROLE_ROOM_GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: GOOGLE_CLOUD_QUOTA_PROJECT
        sync: false
      - key: GOOGLE_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_WORKSPACE_DOMAIN
        sync: false
      - key: GOOGLE_WORKSPACE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_IMPERSONATE_USER
        sync: false
      - key: GOOGLE_USE_IMPERSONATION
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GOOGLE_TAG_MANAGER_ID
        sync: false
      - key: VITE_CREATORHUB_GOOGLE_TAG_MANAGER_ID
        sync: false
      - key: VITE_ROLE_ROOM_GOOGLE_TAG_MANAGER_ID
        sync: false
      - key: TIDUM_SYNC_API_BASE_URL
        sync: false
      - key: TIDUM_CREATORHUB_SYNC_SECRET
        sync: false
      - key: GOOGLE_ANALYTICS_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: LEADGRID_WORKFLOW_EVENT_SIGNING_SECRETS_JSON
        sync: false
      - key: LEADGRID_WORKFLOW_EVENT_SERVICE_TOKEN
        sync: false
      - key: VITE_ROLE_ROOM_TURNSTILE_SITE_KEY
        sync: false
      - key: ROLE_ROOM_TURNSTILE_SECRET_KEY
        sync: false
      # Unset/0 ignores X-Forwarded-For. Configure only the verified number of
      # trusted proxy hops; the route reads the chain right-to-left.
      - key: LEADGRID_SELF_ONBOARD_TRUST_PROXY_HOPS
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ROLE_ROOM_LINKEDIN_CLIENT_ID
        sync: false
      - key: ROLE_ROOM_LINKEDIN_CLIENT_SECRET
        sync: false
      - key: ROLE_ROOM_LINKEDIN_REDIRECT_URI
        sync: false
      - key: ROLE_ROOM_LINKEDIN_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ALLOW_ORIGINS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: EVENDI_API_URL
        sync: false
