name: LeadMapApp
options:
  bundleIdPrefix: com.creatorhubn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # Swift 6 + complete strict concurrency — samme policy som CaptureApp.
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9TAUZCPK95"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  LeadMapApp:
    type: application
    platform: iOS
    sources:
      - path: LeadMapApp
    info:
      path: LeadMapApp/Generated/Info.plist
      properties:
        CFBundleDisplayName: Lead Map
        UILaunchScreen:
          UIColorName: LaunchSplashBackground
          UIImageName: LeadMapLogo
          UIImageRespectsSafeAreaInsets: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Bruker GPS til å auto-fylle visit_latitude/longitude ved fysiske besøk
        # + vise "leads i nærheten av meg"-sortering.
        NSLocationWhenInUseUsageDescription: Lead Map bruker din posisjon til å vise leads i nærheten + auto-fylle koordinater når du logger fysiske besøk.
        # Skanner QR-koden i Admin Room for pairing.
        NSCameraUsageDescription: Lead Map skanner QR-koden i Admin Room for å koble iPad til kontoen din.
        # Apple Pencil til notater i visit-loggen.
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.LeadMapApp
        INFOPLIST_FILE: LeadMapApp/Generated/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
