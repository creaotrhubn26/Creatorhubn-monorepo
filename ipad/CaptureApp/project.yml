name: CaptureApp
options:
  bundleIdPrefix: com.creatorhubn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Norsk-only produkt (all tekst er hardkodet norsk, ingen .lproj). Sett
  # utviklingsspråk til Bokmål → CFBundleDevelopmentRegion=nb: VoiceOver leser
  # med norsk uttale og system-formattering (dato/tall) faller til nb som standard.
  developmentLanguage: nb

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0

settings:
  base:
    # 2026-06-07: RE-ENABLED Swift 6 språkmodus + complete strict concurrency.
    # Verifisert med CLEAN build (EXIT 0, 0 errors) — den tidligere GRDB/
    # SessionStore-blokkeren er ryddet i mellomtiden. Kun benigne warnings igjen
    # (f.eks. «no async operations within await»). Hold på 6/complete så nye
    # data-race-feil blir hard errors og fanges i CI.
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9TAUZCPK95"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Apple Generic Versioning — kreves av fastlane increment_build_number
    VERSIONING_SYSTEM: apple-generic
    # Settes per utgivelse før `xcodegen generate`; TestFlight krever at
    # buildnummeret stiger innenfor samme MARKETING_VERSION-tog.
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

targets:
  CaptureApp:
    type: application
    platform: iOS
    sources:
      - path: CaptureApp
    dependencies:
      - package: GRDB
        product: GRDB
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: CaptureWidgets
        embed: true
    info:
      path: CaptureApp/Generated/Info.plist
      properties:
        CFBundleDisplayName: CreatorHub One
        # XcodeGen skriver ellers sine egne defaults (1.0 / 1) og ignorerer
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION. Da havner hvert TestFlight-
        # bygg på «1.0 (1)» uansett hva man bumper. Koble nøklene til
        # build-settings så bumpen faktisk får effekt.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Appen bruker kun standard HTTPS-kryptering (eksemptert). Setter dette
        # så TestFlight-bygg ikke blokkeres på «Missing Compliance» — uten det
        # er bygget VALID men «not in internally testable state» til noen svarer
        # på export-compliance manuelt i App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchSplashBackground
          UIImageName: CreatorHubOneLogo
          UIImageRespectsSafeAreaInsets: true
        UIRequiredDeviceCapabilities: [arm64]
        # Kreves av App Store for iPad (multitasking). Alle fire orienteringer.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Used to discover and communicate with your Canon camera over the local network during a shoot.
        NSBonjourServices: [_http._tcp]
        NSCameraUsageDescription: Not used. Present only to satisfy App Store review when tethering to external cameras.
        NSPhotoLibraryAddUsageDescription: Used only when you explicitly export a captured session to Photos.
        NSMicrophoneUsageDescription: Record short voice memos attached to individual shots so you can dictate retouch + delivery instructions while shooting continues.
        NSSpeechRecognitionUsageDescription: Transcribe your voice memos on-device so dictated retouch and delivery notes become searchable text.
        NSLocationWhenInUseUsageDescription: Used to show accurate golden-hour and weather for your current shoot location on the "I dag" dashboard.
        NSCalendarsWriteOnlyAccessUsageDescription: Add a shoot to your calendar. Write-only — the app never reads your existing events.
        # Official Google Sign-In iOS SDK configuration. The client is
        # registered for `com.creatorhubn.capture` in CreatorHub's Google
        # Cloud project; the reversed ID is the SDK callback scheme.
        GIDClientID: 256648631702-s96ihgei36g0pgc11t4o27arcjoc35g5.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.creatorhubn.capture.google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.256648631702-s96ihgei36g0pgc11t4o27arcjoc35g5
    entitlements:
      path: CaptureApp/Generated/CaptureApp.entitlements
      properties:
        # WeatherKit: golden hour / vær on-device. Krever at WeatherKit-
        # capability aktiveres for App ID-en i Apple Developer-portalen før
        # TestFlight-signering lykkes (se aktiverings-sjekklisten).
        com.apple.developer.weatherkit: true
        # Push: leverer kunde-/redigerer-hendelser når appen er lukket. Krever
        # Push Notifications-capability på App ID-en (aktiveres i portalen).
        aps-environment: development
        # Når vi først har en entitlements-fil MÅ keychain-gruppa deklareres
        # eksplisitt, ellers mister appen default-tilgangen (errSecMissing-
        # Entitlement -34018 på innlogging i simulator).
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.creatorhubn.capture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.capture
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Manuell signering for App Store (cloud signing feiler «Cloud signing
        # permission error» uten Apple-managed cert — samme som LeadMap).
        # Simulator-bygg signerer ikke, så dette påvirker kun archive/export.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "CreatorHub Capture AppStore"

  CaptureAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaptureAppTests
        excludes:
          - ScreenshotHarness.swift
    dependencies:
      - target: CaptureApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # XCUIApplication requires a UI-test runner with CaptureApp configured as
  # target application. Keeping this harness in the unit-test bundle made the
  # otherwise-green full suite fail before the first screenshot was taken.
  CaptureAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CaptureAppTests/ScreenshotHarness.swift
    dependencies:
      - target: CaptureApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Widget-extension: «shoot i gang»-Live Activity (låseskjerm + Dynamic
  # Island). Deler ShootActivityAttributes.swift med app-target-et.
  # NB (provisioning): egen bundle-id må registreres for TestFlight-signering —
  # fastlane -allowProvisioningUpdates + ASC-nøkkel oppretter den vanligvis auto.
  CaptureWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CaptureWidgets
      - path: CaptureApp/Core/LiveActivity/ShootActivityAttributes.swift
    info:
      path: CaptureWidgets/Generated/Info.plist
      properties:
        CFBundleDisplayName: CreatorHub Widgets
        # Extension må ha samme versjon som app-target-et.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.capture.widgets
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "CreatorHub Widgets AppStore"

schemes:
  CaptureApp:
    build:
      targets:
        CaptureApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CaptureAppTests
        - CaptureAppUITests
    archive:
      config: Release
