name: CaptureApp
options:
  bundleIdPrefix: com.creatorhubn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

settings:
  base:
    # Midlertidig downgrade fra Swift 6.0 → 5 2026-06-05 for å unblocke CI.
    # Swift 6.0 håndhever @MainActor-isolation som hard error uavhengig
    # av STRICT_CONCURRENCY-flagget. Pre-existing GRDB-violations i
    # SessionStore.swift krever refactor før vi kan re-enable 6.0.
    # Tracked: project_capture_strict_concurrency_pending.md
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9TAUZCPK95"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Apple Generic Versioning — kreves av fastlane increment_build_number
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  CaptureApp:
    type: application
    platform: iOS
    sources:
      - path: CaptureApp
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: CaptureApp/Generated/Info.plist
      properties:
        CFBundleDisplayName: CreatorHub One
        UILaunchScreen:
          UIColorName: LaunchSplashBackground
          UIImageName: CreatorHubOneLogo
          UIImageRespectsSafeAreaInsets: true
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: Used to discover and communicate with your Canon camera over the local network during a shoot.
        NSBonjourServices: [_http._tcp]
        NSCameraUsageDescription: Not used. Present only to satisfy App Store review when tethering to external cameras.
        NSPhotoLibraryAddUsageDescription: Used only when you explicitly export a captured session to Photos.
        NSMicrophoneUsageDescription: Record short voice memos attached to individual shots so you can dictate retouch + delivery instructions while shooting continues.
        # Google OAuth — one-time setup per Google Cloud project:
        #   1. Register an OAuth 2.0 Client ID of type "iOS" with bundle
        #      identifier `com.creatorhubn.capture`.
        #   2. Paste the resulting client ID below (format:
        #      `<num>-<hash>.apps.googleusercontent.com`).
        #   3. Replace the URL scheme with the reversed client ID
        #      (`com.googleusercontent.apps.<num>-<hash>`).
        # Until both are filled in, `GoogleOAuthCoordinator.isConfigured`
        # returns false and `SignInView` falls back to the paste-token
        # flow so builds stay usable pre-setup.
        GoogleOAuthClientID: 256648631702-s96ihgei36g0pgc11t4o27arcjoc35g5.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.creatorhubn.capture.google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.256648631702-s96ihgei36g0pgc11t4o27arcjoc35g5
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.capture
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  CaptureAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaptureAppTests
    dependencies:
      - target: CaptureApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
