name: CaptureApp
options:
  bundleIdPrefix: com.creatorhubn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CaptureApp:
    type: application
    platform: iOS
    supportedDestinations: [iPad]
    sources:
      - path: CaptureApp
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: CaptureApp/Generated/Info.plist
      properties:
        CFBundleDisplayName: CreatorHub Capture
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSLocalNetworkUsageDescription: Used to discover and communicate with your Canon camera over the local network during a shoot.
        NSBonjourServices: [_http._tcp]
        NSCameraUsageDescription: Not used. Present only to satisfy App Store review when tethering to external cameras.
        NSPhotoLibraryAddUsageDescription: Used only when you explicitly export a captured session to Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.capture
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  CaptureAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaptureAppTests
    dependencies:
      - target: CaptureApp
