disabled_rules:
  # BEVISST avskrudd for en stor, moden kodebase — re-enable ville gi tusenvis av
  # kosmetiske violations uten verdi (LiveCaptureView er ~7k linjer).
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - identifier_name
  # TODO-/FIXME-kommentarer er legitim sporing (43 stk), ikke violations.
  - todo
  # Idiomatisk SwiftUI: .sheet(onDismiss:){ content } trigger denne — kjent
  # false-positive for SwiftUI-modifikatorer.
  - multiple_closures_with_trailing_closure
  # 2026-06-07: Resten av den gamle «tech debt»-blokken er RYDDET (auto-fix +
  # manuelle fikser: comma, opening_brace, colon, syntactic_sugar, for_where,
  # unused_optional_binding, statement_position m.fl. — se git-historikk).
  # Følgende holdes avskrudd FORDI fiksen ville endre KAMERA-VERIFISERT kode
  # rett før release (regresjons-risiko > lint-verdi). Egen re-testet refaktor-task:
  - cyclomatic_complexity          # iboende komplekse kamera-state-maskiner / event-dispatch
  - function_parameter_count       # delivery/recorder-API-er (param-bunting = churn på verifisert kode)
  - large_tuple                    # 2 sites (ImageAnalysis/Debug) — minor, spores
  - nesting                        # 2 sites — minor, spores
  - non_optional_string_data_conversion  # eksisterende `?? Data()` er trygt; sitene er multipart-body i kamera-leveranse — editering risikerer å bryte opplasting

opt_in_rules:
  - implicit_return
  - unused_declaration
  - unused_import
  - closure_end_indentation
  - redundant_type_annotation

excluded:
  - CaptureApp/Generated
  - CaptureApp.xcodeproj
  # Tests bruker idiomatisk try!/force-unwrap for å fail-fast på
  # oppsetts-feil. Ekskluderer hele test-mappen fra linting.
  - CaptureAppTests

force_cast: error
force_try: error
