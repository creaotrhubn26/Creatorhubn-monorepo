name: ActionClapper
options:
  bundleIdPrefix: com.creatorhubn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: nb

settings:
  base:
    # Samme policy som CaptureApp/LeadMapApp: Swift 6 + complete strict concurrency.
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9TAUZCPK95"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"

targets:
  ActionClapper:
    type: application
    platform: iOS
    sources:
      - path: ActionClapper
    info:
      path: ActionClapper/Resources/Generated/Info.plist
      properties:
        CFBundleDisplayName: Role Room Clapper
        CFBundleName: ActionClapper
        # Kun standard HTTPS-kryptering — ingen egen krypto-kode. Slipper
        # manuell export-compliance i App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # Svart lansering — klaffen skal aldri "blinke" hvitt foran kamera.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities: [arm64]
        # iPad-only app: alle fire orienteringer (multitasking-krav).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.actionclapper
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
