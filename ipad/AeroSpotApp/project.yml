# AeroSpotApp — native iPhone-app for flyfotografer.
# Gjenbruker Canon CCAPI-stacken fra CaptureApp (delte source-filer, ingen
# duplisering). Generer: xcodegen generate (i denne mappen).
name: AeroSpotApp
options:
  bundleIdPrefix: com.creatorhubn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: nb

settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9TAUZCPK95"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  AeroSpot:
    type: application
    platform: iOS
    sources:
      - path: AeroSpot
      # Delt Canon CCAPI-integrasjon fra CaptureApp — eksisterende, testet kode
      - path: ../CaptureApp/CaptureApp/Core/Capture/CCAPIClient.swift
      - path: ../CaptureApp/CaptureApp/Core/Capture/CCAPITypes.swift
      - path: ../CaptureApp/CaptureApp/Core/Capture/CCAPIError.swift
      - path: ../CaptureApp/CaptureApp/Core/Capture/CCAPIInsecureTrust.swift
      - path: ../CaptureApp/CaptureApp/Core/Capture/CCAPISessionRecorder.swift
    settings:
      base:
        # Pin eksplisitt — ellers utleder xcodegen "com.creatorhubn.AeroSpot"
        # (stor S) fra target-navnet, som ikke matcher fastlane/ASC (lowercase).
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.aerospot
        TARGETED_DEVICE_FAMILY: "1" # iPhone
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: AeroSpot/Generated/Info.plist
      properties:
        CFBundleDisplayName: AeroSpot
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: >-
          AeroSpot bruker posisjonen din til å finne nærmeste flyplass, avstand
          til fly og de beste spottepunktene rundt deg.
        NSLocalNetworkUsageDescription: >-
          AeroSpot kobler til Canon-kameraet ditt over lokalt Wi-Fi (CCAPI) for
          live kamerainnstillinger og automatisk loggbok.
        NSPhotoLibraryUsageDescription: >-
          AeroSpot leser EXIF fra bildene du velger for å fylle ut loggboken
          automatisk.
        NSCameraUsageDescription: >-
          AeroSpot bruker kameraet som søker og gir deg live tips om
          komposisjon, horisont og eksponering mens du sikter på flyet.
        NSPhotoLibraryAddUsageDescription: >-
          AeroSpot lagrer bildene du tar med det tilkoblede kameraet i
          fotobiblioteket ditt når auto-nedlasting er på.
        NSAppTransportSecurity:
          # Canon CCAPI bruker self-signed cert på kameraets lokale IP —
          # trust håndteres eksplisitt i CCAPIInsecureTrustDelegate, kun for
          # kameraets host. Lokale IP-er er unntatt ATS by design.
          NSAllowsLocalNetworking: true

  AeroSpotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AeroSpotTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AeroSpot

schemes:
  AeroSpot:
    build:
      targets:
        AeroSpot: all
        AeroSpotTests: [test]
    test:
      targets:
        - AeroSpotTests
