name: Reiseguide
options:
  bundleIdPrefix: com.creatorhubn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Norsk er kildespråk i Localizable.xcstrings; engelsk er oversatt.
  # UI-språket følger språkvelgeren i appen (ikke bare systemspråket), se
  # Core/AppSettings.swift og L10n.swift.
  developmentLanguage: nb

settings:
  base:
    # Samme policy som CaptureApp/LeadMapApp: Swift 6 + complete strict
    # concurrency, så data-race-feil er harde feil fra første bygg.
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "9TAUZCPK95"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1"
    # Backend med /api/guide/* (backend/server/reiseguide-routes.ts).
    REISEGUIDE_API_BASE: "https://creatorhub-backend-rtbl.onrender.com"

targets:
  Reiseguide:
    type: application
    platform: iOS
    sources:
      - path: Reiseguide
    dependencies:
      # Live Activity (pakke 2, item 6): låseskjerm + Dynamic Island for
      # «Nå spilles». Samme mønster som LeadMapApp -> LeadMapWidget.
      - target: ReiseguideWidgets
        platformFilter: iOS
    info:
      path: Reiseguide/Generated/Info.plist
      properties:
        CFBundleDisplayName: SenseAid Explore
        CFBundleName: SenseAid Explore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        GuideAPIBaseURL: $(REISEGUIDE_API_BASE)
        # Konsept 2 er kun mørkt tema i POC (UI-spesifikasjon del 1).
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: bgBase
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Posisjon bes om først når brukeren trykker «Bruk posisjonen min»
        # (UI-spesifikasjon 6.1). Kun «når appen er i bruk» i POC; bakgrunns-
        # geofencing («alltid») er fase 2.
        NSLocationWhenInUseUsageDescription: SenseAid Explore bruker posisjonen din til å vise severdigheter i nærheten og starte fortellingen når du er nær en av dem.
        # Fortellingen skal spille videre med skjermen låst og fra lomma
        # (UI-spesifikasjon 8.4, punkt 9).
        UIBackgroundModes:
          - audio
        # Live Activity (pakke 2, item 6): «Nå spilles» på låseskjerm og i
        # Dynamic Island, se ReiseguideWidgets/.
        NSSupportsLiveActivities: true
        # Deep link fra delingssiden (backend /api/guide/share/{slug}):
        # senseaidexplore://poi/{slug}?lang=nb, se Core/DeepLink.swift.
        CFBundleURLTypes:
          - CFBundleURLName: com.creatorhubn.reiseguide.share
            CFBundleURLSchemes:
              - senseaidexplore
    settings:
      # Manuell Release-signering m/ App Store-profilen fastlane henter før
      # arkivering (samme mønster som LeadMapApp — se fastlane/Fastfile).
      # Debug er fortsatt automatisk (lokal utvikling upåvirket).
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "SenseAid Explore App Store"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.reiseguide
        # Kun iPhone i POC.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  # Widget Extension: kun Live Activity («Nå spilles»), ingen widget på
  # hjemskjermen (pakke 2, item 6). ActivityKit leverer dataflyten mellom
  # hovedappen og extension-prosessen selv — trenger ikke en App Group slik
  # LeadMapWidget gjør for sin hjemskjerm-widget.
  ReiseguideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ReiseguideWidgets
      # Delte ActivityKit-attributter — kompileres i begge targets.
      - path: Reiseguide/Core/PlayerActivityAttributes.swift
    info:
      path: ReiseguideWidgets/Generated/Info.plist
      properties:
        CFBundleDisplayName: SenseAid Explore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "SenseAid Explore Widgets App Store"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.reiseguide.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  ReiseguideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReiseguideTests
    dependencies:
      - target: Reiseguide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creatorhubn.reiseguide.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Reiseguide:
    build:
      targets:
        Reiseguide: all
        ReiseguideTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReiseguideTests
