name: Role Room 2nd AD E2E Gate

on:
  pull_request:
    paths:
      - 'frontend/client/src/components/role-room/**'
      - 'frontend/client/src/test-harness-casting.tsx'
      - 'frontend/e2e/role-room-second-ad-troll.spec.ts'
      - 'frontend/package.json'
      - 'backend/server/role-room-call-sheet-routes.ts'
      - 'backend/migrations/0583_role_room_call_sheet_reminders.sql'
      - 'backend/migrations/role-room-schema.ts'
      - '.github/workflows/role-room-second-ad-e2e-gate.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  group: role-room-second-ad-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authenticated-troll-flow:
    name: Authenticated Troll callsheet flow
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
        run: npm ci --workspaces=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated Troll workflow
        run: npm run test:e2e:role-room-troll

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-role-room-second-ad
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-role-room-second-ad
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
