concurrency:
  group: role-room-production-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authenticated-troll-flow:
    name: Authenticated Troll production flows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
        run: npm ci --workspaces=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated Troll workflow
        run: npm run test:e2e:role-room-troll

      - name: Run Story Graph unit tests (script engine, runtime, graph ops)
        run: npm run test:unit:narrative

      - name: Run Story Graph (game_studio) workflow
        run: npm run test:e2e:narrative

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-role-room-production
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-role-room-production
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
