name: Role Room Production E2E Gate

on:
  pull_request:
    paths:
      - 'frontend/client/src/components/role-room/**'
      - 'frontend/client/src/test-harness-casting.tsx'
      - 'frontend/e2e/role-room-second-ad-troll.spec.ts'
      - 'frontend/e2e/role-room-production-manager-troll.spec.ts'
      - 'frontend/e2e/role-room-production-coordinator-troll.spec.ts'
      - 'frontend/e2e/role-room-continuity-troll.spec.ts'
      - 'frontend/e2e/role-room-location-manager-troll.spec.ts'
      - 'frontend/e2e/narrative-board.spec.ts'
      - 'frontend/e2e/narrative-play.spec.ts'
      - 'frontend/e2e/narrative-exports.spec.ts'
      - 'frontend/e2e/narrative-story-play.spec.ts'
      - 'frontend/e2e/narrative-import-formats.spec.ts'
      - 'frontend/e2e/helpers/narrativeMocks.ts'
      - 'frontend/shared/narrative-script/**'
      - 'frontend/shared/narrative-runtime/**'
      - 'frontend/shared/narrative-format/**'
      - 'frontend/shared/narrative-player/**'
      - 'frontend/client/public/embed/narrative-player.js'
      - 'frontend/client/src/pages/story-play.tsx'
      - 'frontend/client/src/test-harness.tsx'
      - 'frontend/package.json'
      - 'backend/server/role-room-narrative-routes.ts'
      - 'backend/server/role-room-narrative-routes.test.ts'
      - 'backend/server/role-room-narrative-service.ts'
      - 'backend/migrations/0605_role_room_narrative_graph.sql'
      - 'backend/migrations/0606_ai_suggestions_narrative_source_type.sql'
      - 'backend/server/ai-narrative-element-agent.ts'
      - 'backend/server/ai-narrative-element-agent.test.ts'
      - 'backend/server/role-room-call-sheet-routes.ts'
      - 'backend/server/casting-production-routes.ts'
      - 'backend/server/casting-production-routes.test.ts'
      - 'backend/server/casting-production-location-media.ts'
      - 'backend/server/casting-production-location-media.test.ts'
      - 'backend/server/casting-production-location-s3.ts'
      - 'backend/server/casting-production-location-s3.test.ts'
      - 'backend/server/casting-project-ownership.ts'
      - 'backend/server/casting-project-ownership.test.ts'
      - 'backend/migrations/0583_role_room_call_sheet_reminders.sql'
      - 'backend/migrations/0584_role_room_call_sheet_revisions.sql'
      - 'backend/migrations/0586_role_room_production_management.sql'
      - 'backend/migrations/0604_role_room_scout_capture_2.sql'
      - 'backend/migrations/role-room-schema.ts'
      - 'scripts/role-room-*-live-e2e.mjs'
      - 'scripts/role-room-live-smoke.mjs'
      - '.github/workflows/role-room-second-ad-e2e-gate.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  group: role-room-production-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authenticated-troll-flow:
    name: Authenticated Troll production flows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        env:
          CHROMEDRIVER_SKIP_DOWNLOAD: 'true'
        run: npm ci --workspaces=false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated Troll workflow
        run: npm run test:e2e:role-room-troll

      - name: Run Story Graph unit tests (script engine, runtime, graph ops)
        run: npm run test:unit:narrative

      - name: Run Story Graph (game_studio) workflow
        run: npm run test:e2e:narrative

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-role-room-production
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-role-room-production
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
