name: Capture TestFlight

# Builds the iPad CaptureApp and uploads it to TestFlight via fastlane.
#
# MANUAL-ONLY for now (workflow_dispatch). The headless export step needs the
# App Store Connect API key to have **App Manager** (or Admin) role for cloud
# distribution signing — until key 9YKHP6L25P is elevated (ASC → Users and
# Access → Integrations), the export fails with "Cloud signing permission
# error". Once that's done, re-enable the push trigger below so it auto-runs on
# CaptureApp merges. (Local `fastlane ios beta` works today — it uses the
# signed-in Xcode account.)
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "ipad/CaptureApp/**"
  #     - ".github/workflows/capture-testflight.yml"

concurrency:
  group: capture-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ipad/CaptureApp
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record Xcode version
        run: echo "XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Install tooling
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build + upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_TEAM_ID: ${{ secrets.APP_STORE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          # Write the ASC API key to disk so xcodebuild can use it for
          # headless provisioning (-authenticationKey* in the Fastfile).
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          fastlane ios beta

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gym-log
          path: ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
