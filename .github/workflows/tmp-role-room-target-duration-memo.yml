name: One-shot Role Room target duration memo recovery

on:
  push:
    branches:
      - fix/role-room-target-duration-memo-20260815

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/role-room-target-duration-memo-20260815
          fetch-depth: 0

      - name: Apply exact memo comparator fix
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('frontend/client/src/components/role-room/components/ManuscriptPanel.tsx'); t=p.read_text(); old='  if (prevProps.onManuscriptChange !== nextProps.onManuscriptChange) return false;\\n  \\n  // All checks passed'; new='  if (prevProps.onManuscriptChange !== nextProps.onManuscriptChange) return false;\\n  if (prevProps.targetDurationMinutes !== nextProps.targetDurationMinutes) return false;\\n  \\n  // All checks passed'; assert t.count(old)==1, t.count(old); p.write_text(t.replace(old,new,1))"

      - name: Remove one-shot workflow
        run: rm .github/workflows/tmp-role-room-target-duration-memo.yml

      - name: Verify scope
        run: |
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git diff --exit-code -- . ':!.github/workflows/tmp-role-room-target-duration-memo.yml' ':!frontend/client/src/components/role-room/components/ManuscriptPanel.tsx'
          grep -F "if (prevProps.targetDurationMinutes !== nextProps.targetDurationMinutes) return false;" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx

      - name: Commit recovered fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/client/src/components/role-room/components/ManuscriptPanel.tsx .github/workflows/tmp-role-room-target-duration-memo.yml
          git commit -m "fix(role-room): re-render manuscript target duration"
          git push origin HEAD:fix/role-room-target-duration-memo-20260815
