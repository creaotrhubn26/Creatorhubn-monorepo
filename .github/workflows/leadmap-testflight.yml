name: LeadMap TestFlight

# Bygger LeadMapApp (iPad) og laster opp til TestFlight via fastlane.
# Manuell trigger (workflow_dispatch) for å ha kontroll på hver beta-release.
#
# Krever repo-secrets:
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_CONTENT   (.p8 base64-encoded)
#   BUILD_CERTIFICATE_BASE64            (Apple Distribution .p12 base64)
#   P12_PASSWORD                        (passord for .p12)
#   KEYCHAIN_PASSWORD                   (random passord for midlertidig CI-keychain)
#
# Engangs-steg (manuelt, kan ikke skriptes): App Store Connect-app-record for
# bundle-id com.creatorhubn.LeadMapApp må finnes + Apple Distribution-cert +
# App Store-profiler ("LeadMap App Store" + "LeadMap Widget App Store") må
# eksistere på Apple. Signering er manual (se fastlane/ExportOptions.plist).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA som skal bygges (tom = default branch)"
        required: false
        default: ""

concurrency:
  group: leadmap-testflight
  cancel-in-progress: false

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ipad/LeadMapApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install XcodeGen
        run: brew install xcodegen

      # Import Apple Distribution-cert til midlertidig keychain.
      # Standardmønster fra Apple-docs: "Customizing a self-hosted runner".
      # Keychain slettes automatisk når jobben er ferdig (VM destrueres).
      - name: Importér signing certificate til midlertidig keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        working-directory: ${{ github.workspace }}
        run: |
          # Skriv cert til midlertidig fil
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Lag midlertidig keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Importér cert
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Legg keychain i search-list (xcodebuild trenger dette)
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          echo "✅ Cert importert til $KEYCHAIN_PATH"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: fastlane ios beta (archive + upload TestFlight)
        run: fastlane ios beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"

      - name: Last opp IPA som artifact (feilsøking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadmap-ipa
          path: ipad/LeadMapApp/build/*.ipa
          if-no-files-found: ignore
