name: Build GFPGAN GPU image

# Builds the CUDA GPU runner image and pushes it to GHCR so RunPod (or any GPU
# host) can pull it. Manual — run when the runner Dockerfile.gpu/app changes.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # CUDA + torch + gfpgan is a multi-GB image — reclaim runner disk first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: backend/gfpgan-runner
          file: backend/gfpgan-runner/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ghcr.io/creaotrhubn26/gfpgan-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
