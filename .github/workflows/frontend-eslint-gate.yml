name: Frontend ESLint Gate

# Runs ESLint over the frontend source on every PR. The Frontend Typecheck Gate
# catches type errors; this catches the class ESLint owns that tsc does NOT —
# React hooks-rule violations, `no-undef`/parse errors in untyped `.js`, unused
# expressions, misleading regex char-classes, sparse arrays, etc. Runs with
# `--quiet` so only errors fail the PR (warnings are visible in `npm run lint`
# but are pre-existing debt being ratcheted down separately). The config lives
# in `frontend/eslint.config.js`; keep it at 0 errors so this gate stays green.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: frontend-eslint-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-eslint:
    name: Frontend ESLint (client/src)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint (errors only)
        # `--quiet` suppresses warnings and exits non-zero ONLY on errors. The
        # config is baselined to 0 errors; ~12.7k pre-existing warnings remain
        # non-blocking and are tracked for follow-up.
        run: npx eslint client/src --quiet
