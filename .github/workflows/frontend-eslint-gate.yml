name: Frontend ESLint Gate

# Kjører ESLint på frontend-app-koden (client/src) på hver PR. Frem til
# 22.07.2026 gatet INGENTING lint i CI — `frontend/eslint.config.js` fantes,
# men var aldri wiret inn i pipeline, og configen manglet dessuten
# `eslint-plugin-react-hooks` (så ~60 `// eslint-disable react-hooks/*`-
# direktiver pekte på en uregistrert regel → «rule not found»-errors som
# ingen så). Denne gaten feiler PR-en på enhver ESLint-ERROR (warnings er
# tillatt via --quiet — kodebasen har mange pre-eksisterende warnings som
# ikke skal blokkere).
#
# Baseline ved innføring: 0 errors i client/src. Gaten hindrer regresjon.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: frontend-eslint-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-eslint:
    name: Frontend ESLint (client/src)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (errors only)
        run: npx eslint client/src --quiet
