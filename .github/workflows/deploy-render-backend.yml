name: Deploy shared Render backend

# Manual releases must pass through the same migration, ownership, concurrency,
# exact-SHA and smoke-test gates as automatic main releases. This workflow does
# not contain a second Render deploy path.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Require current main workflow ref
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main dispatches
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "::error::Production releases must be dispatched from the current main branch"
            exit 1
          fi

  release:
    name: Run the production migration and backend release gate
    needs: guard
    permissions:
      contents: write
    uses: ./.github/workflows/auto-migrate-on-push.yml
    with:
      commit: ${{ github.sha }}
    # Deliberately forward no caller secrets. The reusable workflow's only
    # secret-consuming job binds `environment: Production`, so GitHub resolves
    # only PRODUCTION_MIGRATION_DATABASE_URL and RENDER_API_KEY from that
    # protected environment at execution time.
