name: Deploy shared Render backend

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Main-commit to deploy (defaults to selected ref HEAD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-shared-render-backend
  cancel-in-progress: false

env:
  BACKEND_URL: https://creatorhub-backend-rtbl.onrender.com
  RENDER_SERVICE_ID: srv-d76ob60ule4c73dv2p60

jobs:
  deploy:
    name: Deploy exact main commit to Render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate main commit
        id: target
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          candidate="${REQUESTED_SHA:-$GITHUB_SHA}"
          if [[ ! "$candidate" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "::error::commit_sha must be a 7-40 character hexadecimal Git SHA"
            exit 1
          fi
          target_sha=$(git rev-parse "$candidate^{commit}")
          if ! git merge-base --is-ancestor "$target_sha" origin/main; then
            echo "::error::$target_sha is not an ancestor of origin/main"
            exit 1
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Validated main commit: $target_sha"

      - name: Trigger exact Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY secret is not configured"
            exit 1
          fi
          payload=$(printf '{"commitId":"%s","clearCache":"do_not_clear"}' "$TARGET_SHA")
          set +e
          http_code=$(curl -sS --connect-timeout 5 -m 30 \
            -o /tmp/render-deploy-response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")
          curl_exit=$?
          set -e
          echo "Render trigger: curlExit=$curl_exit HTTP=${http_code:-<none>}"
          if [ "$curl_exit" != "0" ] || { [ "$http_code" != "200" ] && [ "$http_code" != "201" ] && [ "$http_code" != "202" ]; }; then
            python3 -c 'import json; print(json.load(open("/tmp/render-deploy-response.json")).get("message", "Render deploy request failed"))' 2>/dev/null || true
            exit 1
          fi
          deploy_id=$(python3 -c 'import json; print(json.load(open("/tmp/render-deploy-response.json")).get("id", ""))')
          echo "Render accepted deploy ${deploy_id:-<unknown>} for $TARGET_SHA"

      - name: Wait for exact commit and verify health
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 80); do
            version_json=$(curl -sS --connect-timeout 3 -m 10 "$BACKEND_URL/api/version" || true)
            deployed=$(printf '%s' "$version_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)
            echo "[$i] deployed=${deployed:-<unknown>}"
            if [ "$deployed" = "$TARGET_SHA" ]; then
              curl -fsS --connect-timeout 3 -m 15 "$BACKEND_URL/api/health"
              echo
              echo "Render backend is live and healthy at $TARGET_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Render did not expose $TARGET_SHA within 20 minutes"
          exit 1
