name: Deploy shared Render backend

# Manual releases must pass through the same migration, ownership, concurrency,
# exact-SHA and smoke-test gates as automatic main releases. This workflow only
# dispatches the canonical workflow; it does not contain a second deploy path.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Require current main workflow ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject non-main dispatches
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "::error::Production releases must be dispatched from the current main branch"
            exit 1
          fi

  release:
    name: Dispatch the canonical production release gate
    needs: guard
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Start canonical workflow on current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-migrate-on-push.yml --repo "$GITHUB_REPOSITORY" --ref main
