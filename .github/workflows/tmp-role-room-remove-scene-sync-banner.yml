name: One-shot Role Room scene sync banner recovery

on:
  push:
    branches:
      - fix/role-room-remove-scene-sync-banner-20260815

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/role-room-remove-scene-sync-banner-20260815
          fetch-depth: 0

      - name: Remove stale scene sync detector and banner
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('frontend/client/src/components/role-room/components/ManuscriptPanel.tsx')
          text = p.read_text()

          helper = """// Trekker ut normaliserte scene-headinger fra Fountain-tekst. Brukes til å
          // oppdage at DB-scenene er ute av synk med manuset (ulik sekvens av headinger).
          const SCENE_HEADING_DETECT_RE = /^(\\.)?((?:INT|EXT|EST|INT\\.?\\/EXT|I\\/E)[.\\s])/i;
          const extractFountainSceneHeadings = (content: string | undefined): string[] => {
            if (!content) return [];
            const out: string[] = [];
            for (const raw of content.split('\\n')) {
              const line = raw.trim();
              if (SCENE_HEADING_DETECT_RE.test(line)) {
                out.push(line.replace(/^\\./, '').trim().toUpperCase().replace(/\\s+/g, ' '));
              }
            }
            return out;
          };

          """

          detector = """  // Er DB-scenene ute av synk med manuset? (Ulik sekvens av scene-headinger.)
            // Stateless: sammenligner Fountain-headinger mot scene-listas headinger.
            const scenesOutOfSync = useMemo(() => {
              if (!selectedManuscript || scenes.length === 0) return false;
              const contentHeadings = extractFountainSceneHeadings(selectedManuscript.content);
              if (contentHeadings.length === 0) return false;
              const sceneHeadings = scenes.map((s) => (s.sceneHeading || s.heading || '').trim().toUpperCase().replace(/\\s+/g, ' '));
              if (contentHeadings.length !== sceneHeadings.length) return true;
              return contentHeadings.some((h, i) => h !== sceneHeadings[i]);
            }, [selectedManuscript, scenes]);

          """

          banner = """        {selectedManuscript && scenesOutOfSync && (
                    <Alert
                      severity=\"info\"
                      icon={<WarningAmberIcon fontSize=\"inherit\" />}
                      sx={{ mt: responsive.spacing }}
                      action={
                        <Button
                          color=\"inherit\"
                          size=\"small\"
                          disabled={isLoading || !autoBreakdownEnabled}
                          onClick={handleAutoBreakdown}
                        >
                          Kjør Auto Breakdown
                        </Button>
                      }
                    >
                      Scene-listen er ute av synk med manuset (ulike scene-overskrifter). Kjør Auto Breakdown for å oppdatere — produksjonsdata (storyboard, props) på scener som fortsatt finnes beholdes.
                    </Alert>
                  )}

          """

          for name, block in [('helper', helper), ('detector', detector), ('banner', banner)]:
              count = text.count(block)
              assert count == 1, f'{name}: expected 1 exact match, got {count}'
              text = text.replace(block, '', 1)

          p.write_text(text)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/tmp-role-room-remove-scene-sync-banner.yml

      - name: Verify recovery scope
        shell: bash
        run: |
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git diff --exit-code -- . ':!.github/workflows/tmp-role-room-remove-scene-sync-banner.yml' ':!frontend/client/src/components/role-room/components/ManuscriptPanel.tsx'
          ! grep -Fq 'SCENE_HEADING_DETECT_RE' frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          ! grep -Fq 'extractFountainSceneHeadings' frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          ! grep -Fq 'scenesOutOfSync' frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          ! grep -Fq 'Scene-listen er ute av synk med manuset' frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          grep -Fq 'WarningAmberIcon' frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          grep -Fq 'Ikke-destruktiv merge' frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          grep -Fq 'const mergedScenes = autoScenes.map' frontend/client/src/components/role-room/components/ManuscriptPanel.tsx

      - name: Commit recovered fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/client/src/components/role-room/components/ManuscriptPanel.tsx .github/workflows/tmp-role-room-remove-scene-sync-banner.yml
          git commit -m "fix(role-room): remove noisy scene sync banner"
          git push origin HEAD:fix/role-room-remove-scene-sync-banner-20260815
