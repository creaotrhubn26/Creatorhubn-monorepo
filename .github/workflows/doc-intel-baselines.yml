name: Doc-intel baselines

# Ukentlig mekanisk baseline (Documentation Intelligence repo-intelligence-laget):
# avhengighets-baseline per app + ekstern-API-bruksmap, committet til
# docs/baselines/. Gjør impact-spørsmål diff-bare («ny release X — hvilke av
# VÅRE symboler rører den») og gir git-historikk over egen API-flate.

on:
  schedule:
    - cron: '47 5 * * 1'   # mandager ~05:47 UTC (før release-monitor 06:23)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: doc-intel-baselines
  cancel-in-progress: false

jobs:
  build-baselines:
    name: Bygg baselines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generer baselines + symbolkart
        run: |
          mkdir -p docs/baselines
          SKILL=.claude/skills/documentation-intelligence
          for APP in backend frontend apps/resolve-script-manager; do
            SLUG=$(echo "$APP" | tr '/' '-')
            node "$SKILL/scripts/build-baseline.mjs" "$APP" > "docs/baselines/$SLUG.yaml"
          done
          sh "$SKILL/scripts/grep-symbols.sh" all . > docs/baselines/external-api-usage.txt

      # main er beskyttet (required checks) → branch + PR, aldri direkte push.
      # Fast grennavn = én stående PR som oppdateres (force-push), ikke ukentlig PR-spam.
      - name: Commit til baseline-gren + PR ved endring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add docs/baselines
          if git diff --cached --quiet; then
            echo "Ingen baseline-endringer."
            exit 0
          fi
          git config user.name "doc-intel-baselines[bot]"
          git config user.email "noreply@creatorhubn.com"
          git checkout -B chore/doc-intel-baselines
          git commit -m "chore(doc-intel): ukentlig baseline-oppdatering"
          git push -f origin chore/doc-intel-baselines
          if ! gh pr list --head chore/doc-intel-baselines --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base main --head chore/doc-intel-baselines \
              --title "chore(doc-intel): ukentlig baseline-oppdatering" \
              --body "Automatisk generert av doc-intel-baselines-workflowen: \`build-baseline.mjs\` (backend/frontend/resolve-script-manager) + \`grep-symbols.sh all\` → \`docs/baselines/\`. Diffen ER innholdet — endret ekstern API-flate siden sist."
          fi
