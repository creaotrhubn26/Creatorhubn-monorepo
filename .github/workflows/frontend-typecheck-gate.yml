name: Frontend Typecheck Gate

# Runs the full frontend `tsc --noEmit` on every PR. The Story Arc and Visual
# Editor gates only typecheck narrow allowlists / run vite (which esbuild-strips
# types and ships them silently), so genuine type errors — e.g. a missing import
# that ReferenceErrors at runtime, or a TDZ — could ship undetected. This gate
# fails the PR on any frontend type error.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: frontend-typecheck-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-typecheck:
    name: Frontend tsc --noEmit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (full frontend)
        # The bare `typecheck` script does not raise the heap; the full project
        # needs more than the 4 GB default or tsc OOMs.
        run: NODE_OPTIONS=--max-old-space-size=8192 npm run typecheck
