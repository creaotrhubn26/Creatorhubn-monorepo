name: SenseAid Explore TestFlight

# Bygger SenseAid Explore (ipad/Reiseguide, iPhone) og laster opp til
# TestFlight via fastlane. Manuell trigger (workflow_dispatch) så hver
# testversjon er et bevisst valg. Samme mønster og samme repo-secrets som
# leadmap-testflight.yml:
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_CONTENT   (.p8 base64-encoded)
#   BUILD_CERTIFICATE_BASE64            (Apple Distribution .p12 base64)
#   P12_PASSWORD
#   KEYCHAIN_PASSWORD
#   APP_STORE_TEAM_ID / APP_STORE_CONNECT_TEAM_ID (valgfrie, Appfile)
#
# Engangs-steg som må gjøres i Apple Developer / App Store Connect før
# første kjøring står i ipad/Reiseguide/TESTFLIGHT.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA som skal bygges (tom = grenen workflowen kjøres fra)"
        required: false
        default: ""

concurrency:
  group: senseaid-testflight
  cancel-in-progress: false

jobs:
  beta:
    # macos-26 har Xcode 26 og iOS 26 SDK (Apple krever det ved opplasting fra 2026).
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ipad/Reiseguide
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Verifiser Xcode-versjon
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios | head -5

      - name: Install XcodeGen
        run: brew install xcodegen

      # Apple Distribution-cert inn i en midlertidig keychain (Apples
      # standardmønster). Keychainen forsvinner med VM-en.
      - name: Importer signing certificate til midlertidig keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        working-directory: ${{ github.workspace }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          echo "Cert importert til $KEYCHAIN_PATH"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: fastlane ios beta (archive + upload TestFlight)
        run: fastlane ios beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_TEAM_ID: ${{ secrets.APP_STORE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"

      - name: Last opp IPA som artifact (feilsøking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senseaid-explore-ipa
          path: ipad/Reiseguide/build/*.ipa
          if-no-files-found: ignore

      - name: Last opp gym-logg ved feil
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: senseaid-gym-log
          path: ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
