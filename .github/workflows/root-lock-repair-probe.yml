name: Root Lock Repair Probe

on:
  push:
    branches:
      - ci/baseline-dependency-consistency-20260814-170909
  workflow_dispatch:

permissions:
  contents: write

jobs:
  root-lock:
    name: Regenerate and publish root workspace lock
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ci/baseline-dependency-consistency-20260814-170909

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate root workspace lock
        run: |
          npm install --package-lock-only --ignore-scripts
          cp package-lock.json /tmp/package-lock.first.json
          npm install --package-lock-only --ignore-scripts
          cmp /tmp/package-lock.first.json package-lock.json

      - name: Validate backend workspace install
        working-directory: backend
        run: npm ci

      - name: Commit synchronized root lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Root lock already synchronized; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix(ci): synchronize root workspace lock after frontend repair'
          git push origin HEAD:ci/baseline-dependency-consistency-20260814-170909
