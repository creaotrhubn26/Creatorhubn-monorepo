name: Role Room deadline reminders

on:
  schedule:
    # Daglig kl. 07:09 UTC (~09:00 norsk sommertid). Sprer last fra andre cron.
    - cron: '9 7 * * *'
  workflow_dispatch:
    inputs:
      horizon_hours:
        description: 'Frist-horisont i timer (default 48)'
        required: false
        default: '48'
      dry_run:
        description: 'Dry-run (skanner + teller uten å varsle)'
        required: false
        default: 'false'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call deadline-reminder endpoint
        env:
          CRON_TRIGGER_TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL || 'https://creatorhub-backend-rtbl.onrender.com' }}
          HORIZON_HOURS: ${{ github.event.inputs.horizon_hours || '48' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ -z "$CRON_TRIGGER_TOKEN" ]; then
            echo "::error::CRON_TRIGGER_TOKEN secret er ikke satt"
            exit 1
          fi

          URL="$BACKEND_BASE_URL/api/role-room/internal/deadline-reminders/run?horizonHours=$HORIZON_HOURS&dryRun=$DRY_RUN"
          echo "Calling: $URL"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$URL" \
            -H "x-cron-trigger-token: $CRON_TRIGGER_TOKEN" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq . || echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Deadline-reminder feilet med HTTP $HTTP_CODE"
            exit 1
          fi
