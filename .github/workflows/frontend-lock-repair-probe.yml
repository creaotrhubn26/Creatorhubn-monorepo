name: Frontend Lock Repair Probe

on:
  push:
    branches:
      - ci/baseline-dependency-consistency-20260814-170909
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    name: Regenerate, validate, and publish frontend repair
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ci/baseline-dependency-consistency-20260814-170909

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply verified candidate repair
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.dependencies ??= {};
          pkg.devDependencies ??= {};
          pkg.dependencies.quill = '^1.3.7';
          pkg.dependencies['jspdf-autotable'] = '^5.0.8';
          pkg.dependencies.eventemitter3 = '^5.0.4';
          pkg.devDependencies['@types/three'] = '^0.182.0';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');

          const servicePath = 'client/src/services/BackgroundUploadService.ts';
          let service = fs.readFileSync(servicePath, 'utf8');
          service = service.replace("import { EventEmitter } from 'events';", "import EventEmitter from 'eventemitter3';");
          service = service.replace('id: taskd,', 'id: taskId,');
          fs.writeFileSync(servicePath, service);
          NODE

      - name: Regenerate standalone frontend lock
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm install --package-lock-only --workspaces=false --ignore-scripts
          cp package-lock.json /tmp/frontend-package-lock.first.json
          npm install --package-lock-only --workspaces=false --ignore-scripts
          cmp /tmp/frontend-package-lock.first.json package-lock.json

      - name: Install standalone frontend dependencies
        working-directory: frontend
        run: npm ci --workspaces=false

      - name: Inspect critical dependency graph
        working-directory: frontend
        run: |
          npm ls --workspaces=false loupe quill react-quill eventemitter3 three @types/three jspdf jspdf-autotable vitest @vitest/utils @mui/material @mui/system @mui/icons-material @mui/x-date-pickers || true

      - name: Full frontend typecheck
        working-directory: frontend
        run: NODE_OPTIONS=--max-old-space-size=8192 npm run typecheck

      - name: Story Arc unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Make frontend CI installs explicitly standalone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('.github/workflows/frontend-typecheck-gate.yml'),
              Path('.github/workflows/frontend-eslint-gate.yml'),
              Path('.github/workflows/story-arc-e2e-gate.yml'),
              Path('.github/workflows/visual-editor-e2e-gate.yml'),
          ]
          for path in paths:
              text = path.read_text()
              old = '        run: npm ci\n'
              new = '        run: npm ci --workspaces=false\n'
              if old not in text:
                  raise SystemExit(f'expected npm ci line missing in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary probe and commit verified repair
        run: |
          git rm .github/workflows/frontend-lock-repair-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json frontend/client/src/services/BackgroundUploadService.ts \
            .github/workflows/frontend-typecheck-gate.yml \
            .github/workflows/frontend-eslint-gate.yml \
            .github/workflows/story-arc-e2e-gate.yml \
            .github/workflows/visual-editor-e2e-gate.yml
          git diff --cached --check
          git commit -m 'fix(frontend): restore deterministic standalone CI dependencies'
          git push origin HEAD:ci/baseline-dependency-consistency-20260814-170909
