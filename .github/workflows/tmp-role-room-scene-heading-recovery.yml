name: One-shot Role Room scene heading recovery

on:
  push:
    branches:
      - fix/role-room-no-en-scene-heading-20260815

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/role-room-no-en-scene-heading-20260815
          fetch-depth: 0

      - name: Apply exact NO/EN scene-heading recovery
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/client/src/components/role-room/components/ManuscriptPanel.tsx')
          text = path.read_text()

          insert_after = """const extractFountainSceneHeadings = (content: string | undefined): string[] => {
  if (!content) return [];
  const out: string[] = [];
  for (const raw of content.split('\\n')) {
    const line = raw.trim();
    if (SCENE_HEADING_DETECT_RE.test(line)) {
      out.push(line.replace(/^\\./, '').trim().toUpperCase().replace(/\\s+/g, ' '));
    }
  }
  return out;
};
"""

          helper = """

type SceneTimeOfDay = NonNullable<SceneBreakdown['timeOfDay']>;

const SCENE_TIME_OF_DAY_MAP: Record<string, SceneTimeOfDay> = {
  DAY: 'DAY',
  NIGHT: 'NIGHT',
  DAWN: 'DAWN',
  DUSK: 'DUSK',
  CONTINUOUS: 'CONTINUOUS',
  LATER: 'LATER',
  MORNING: 'MORNING',
  EVENING: 'EVENING',
  SAME: 'CONTINUOUS',
  DAG: 'DAY',
  NATT: 'NIGHT',
  DEMRING: 'DAWN',
  GRYNING: 'DAWN',
  SKUMRING: 'DUSK',
  KONTINUERLIG: 'CONTINUOUS',
  SENERE: 'LATER',
  MORGEN: 'MORNING',
  KVELD: 'EVENING',
};

const normalizeSceneTimeOfDay = (value?: string): SceneTimeOfDay => {
  const token = (value || '').trim().replace(/\\.$/, '').toUpperCase();
  return SCENE_TIME_OF_DAY_MAP[token] ?? 'DAY';
};

const parseSceneHeadingLine = (
  line: string,
): { intExt: SceneBreakdown['intExt']; location: string; timeOfDay: SceneTimeOfDay } | null => {
  const match = line.trim().match(
    /^(INT|EXT|EST|INT\\.?\\/EXT|I\\/E)[.\\s]+(.+?)(?:\\s*[-–—]\\s*(DAY|NIGHT|DAWN|DUSK|CONTINUOUS|LATER|MORNING|EVENING|SAME|DAG|NATT|DEMRING|GRYNING|SKUMRING|KONTINUERLIG|SENERE|MORGEN|KVELD)\\.?)?$/i,
  );
  if (!match) return null;

  const prefix = match[1].toUpperCase().replace('.', '');
  const intExt: SceneBreakdown['intExt'] =
    prefix === 'I/E' || prefix.includes('INT/EXT')
      ? 'INT/EXT'
      : prefix.startsWith('EXT') || prefix === 'EST'
        ? 'EXT'
        : 'INT';

  return {
    intExt,
    location: (match[2] || '').trim(),
    timeOfDay: normalizeSceneTimeOfDay(match[3]),
  };
};
"""

          old_auto_types = """      let sceneNumber = 1;
      let currentScene: Partial<SceneBreakdown> | null = null;
      let currentCharacters: string[] = [];
      const validSceneTimesOfDay = ['DAY', 'NIGHT', 'DAWN', 'DUSK', 'CONTINUOUS', 'LATER', 'MORNING', 'EVENING'] as const;
      type SceneTimeOfDay = NonNullable<SceneBreakdown['timeOfDay']>;
"""
          new_auto_types = """      let sceneNumber = 1;
      let currentScene: Partial<SceneBreakdown> | null = null;
      let currentCharacters: string[] = [];
"""

          old_auto_heading = """        // Scene heading detection (INT. / EXT.)
        if (line.match(/^(INT\\.|EXT\\.)/i)) {
"""
          new_auto_heading = """        // Scene heading detection supports Fountain INT/EXT variants and NO/EN time-of-day.
        const parsedHeading = parseSceneHeadingLine(line);
        if (parsedHeading) {
"""

          old_auto_parse = """          // Parse new scene heading
          const parts = line.split('-').map(p => p.trim());
          const intExt = parts[0].startsWith('INT') ? 'INT' : 'EXT';
          const location = parts[0].replace(/^(INT\\.|EXT\\.)\\s*/i, '');
          const timeRaw = parts[1] || 'DAY';
          const timeOfDay: SceneTimeOfDay =
            validSceneTimesOfDay.includes(timeRaw.toUpperCase() as SceneTimeOfDay)
              ? timeRaw.toUpperCase() as SceneTimeOfDay
              : 'DAY';

          currentScene = {
            sceneHeading: line,
            intExt,
            locationName: location,
            timeOfDay,
"""
          new_auto_parse = """          currentScene = {
            sceneHeading: line,
            intExt: parsedHeading.intExt,
            locationName: parsedHeading.location,
            timeOfDay: parsedHeading.timeOfDay,
"""

          old_manual_match = """    lines.forEach((line, lineIndex) => {
      const trimmed = line.trim();
      const sceneMatch = trimmed.match(/^(INT|EXT|EST|INT\\.?\\/EXT|I\\/E)[.\\s]+(.+?)(?:\\s*-\\s*(DAY|NIGHT|DAWN|DUSK|CONTINUOUS|LATER|MORNING|EVENING|SAME))?$/i);
      
      if (sceneMatch) {
"""
          new_manual_match = """    lines.forEach((line, lineIndex) => {
      const trimmed = line.trim();
      const sceneHeading = parseSceneHeadingLine(trimmed);
      
      if (sceneHeading) {
"""

          old_manual_fields = """        currentSceneData = {
          heading: trimmed,
          intExt: sceneMatch[1].toUpperCase().replace('.', '').replace('/', '/'),
          location: sceneMatch[2]?.trim() || '',
          timeOfDay: sceneMatch[3]?.toUpperCase() || 'DAY',
"""
          new_manual_fields = """        currentSceneData = {
          heading: trimmed,
          intExt: sceneHeading.intExt,
          location: sceneHeading.location,
          timeOfDay: sceneHeading.timeOfDay,
"""

          replacements = [
            (insert_after, insert_after + helper, 'shared helper insertion'),
            (old_auto_types, new_auto_types, 'remove duplicated auto time types'),
            (old_auto_heading, new_auto_heading, 'auto heading detection'),
            (old_auto_parse, new_auto_parse, 'auto heading parse'),
            (old_manual_match, new_manual_match, 'manual heading detection'),
            (old_manual_fields, new_manual_fields, 'manual heading fields'),
          ]

          for old, new, label in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected exactly one match, found {count}')
            text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Remove one-shot workflow
        run: rm .github/workflows/tmp-role-room-scene-heading-recovery.yml

      - name: Verify scope and parser invariants
        run: |
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git diff --exit-code -- . ':!.github/workflows/tmp-role-room-scene-heading-recovery.yml' ':!frontend/client/src/components/role-room/components/ManuscriptPanel.tsx'
          grep -F "KVELD: 'EVENING'" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          grep -F "const parsedHeading = parseSceneHeadingLine(line);" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          grep -F "const sceneHeading = parseSceneHeadingLine(trimmed);" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          ! grep -F "line.split('-')" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx

      - name: Commit recovered fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/client/src/components/role-room/components/ManuscriptPanel.tsx .github/workflows/tmp-role-room-scene-heading-recovery.yml
          git commit -m "fix(role-room): parse Norwegian scene time-of-day"
          git push origin HEAD:fix/role-room-no-en-scene-heading-20260815
