name: One-shot Role Room scene heading recovery

on:
  push:
    branches:
      - fix/role-room-no-en-scene-heading-20260815

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/role-room-no-en-scene-heading-20260815
          fetch-depth: 0

      - name: Apply exact NO/EN scene-heading recovery
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/client/src/components/role-room/components/ManuscriptPanel.tsx')
          text = path.read_text()
          insert_after = "const extractFountainSceneHeadings = (content: string | undefined): string[] => {\n  if (!content) return [];\n  const out: string[] = [];\n  for (const raw of content.split('\\n')) {\n    const line = raw.trim();\n    if (SCENE_HEADING_DETECT_RE.test(line)) {\n      out.push(line.replace(/^\\./, '').trim().toUpperCase().replace(/\\s+/g, ' '));\n    }\n  }\n  return out;\n};\n"
          helper = "\ntype SceneTimeOfDay = NonNullable<SceneBreakdown['timeOfDay']>;\n\nconst SCENE_TIME_OF_DAY_MAP: Record<string, SceneTimeOfDay> = {\n  DAY: 'DAY',\n  NIGHT: 'NIGHT',\n  DAWN: 'DAWN',\n  DUSK: 'DUSK',\n  CONTINUOUS: 'CONTINUOUS',\n  LATER: 'LATER',\n  MORNING: 'MORNING',\n  EVENING: 'EVENING',\n  SAME: 'CONTINUOUS',\n  DAG: 'DAY',\n  NATT: 'NIGHT',\n  DEMRING: 'DAWN',\n  GRYNING: 'DAWN',\n  SKUMRING: 'DUSK',\n  KONTINUERLIG: 'CONTINUOUS',\n  SENERE: 'LATER',\n  MORGEN: 'MORNING',\n  KVELD: 'EVENING',\n};\n\nconst normalizeSceneTimeOfDay = (value?: string): SceneTimeOfDay => {\n  const token = (value || '').trim().replace(/\\.$/, '').toUpperCase();\n  return SCENE_TIME_OF_DAY_MAP[token] ?? 'DAY';\n};\n\nconst parseSceneHeadingLine = (\n  line: string,\n): { intExt: SceneBreakdown['intExt']; location: string; timeOfDay: SceneTimeOfDay } | null => {\n  const match = line.trim().match(\n    /^(INT|EXT|EST|INT\\.?\\/EXT|I\\/E)[.\\s]+(.+?)(?:\\s*[-–—]\\s*(DAY|NIGHT|DAWN|DUSK|CONTINUOUS|LATER|MORNING|EVENING|SAME|DAG|NATT|DEMRING|GRYNING|SKUMRING|KONTINUERLIG|SENERE|MORGEN|KVELD)\\.?)?$/i,\n  );\n  if (!match) return null;\n\n  const prefix = match[1].toUpperCase().replace('.', '');\n  const intExt: SceneBreakdown['intExt'] =\n    prefix === 'I/E' || prefix.includes('INT/EXT')\n      ? 'INT/EXT'\n      : prefix.startsWith('EXT') || prefix === 'EST'\n        ? 'EXT'\n        : 'INT';\n\n  return {\n    intExt,\n    location: (match[2] || '').trim(),\n    timeOfDay: normalizeSceneTimeOfDay(match[3]),\n  };\n};\n"
          old_auto_types = "      let sceneNumber = 1;\n      let currentScene: Partial<SceneBreakdown> | null = null;\n      let currentCharacters: string[] = [];\n      const validSceneTimesOfDay = ['DAY', 'NIGHT', 'DAWN', 'DUSK', 'CONTINUOUS', 'LATER', 'MORNING', 'EVENING'] as const;\n      type SceneTimeOfDay = NonNullable<SceneBreakdown['timeOfDay']>;\n"
          new_auto_types = "      let sceneNumber = 1;\n      let currentScene: Partial<SceneBreakdown> | null = null;\n      let currentCharacters: string[] = [];\n"
          old_auto_heading = "        // Scene heading detection (INT. / EXT.)\n        if (line.match(/^(INT\\.|EXT\\.)/i)) {\n"
          new_auto_heading = "        // Scene heading detection supports Fountain INT/EXT variants and NO/EN time-of-day.\n        const parsedHeading = parseSceneHeadingLine(line);\n        if (parsedHeading) {\n"
          old_auto_parse = "          // Parse new scene heading\n          const parts = line.split('-').map(p => p.trim());\n          const intExt = parts[0].startsWith('INT') ? 'INT' : 'EXT';\n          const location = parts[0].replace(/^(INT\\.|EXT\\.)\\s*/i, '');\n          const timeRaw = parts[1] || 'DAY';\n          const timeOfDay: SceneTimeOfDay =\n            validSceneTimesOfDay.includes(timeRaw.toUpperCase() as SceneTimeOfDay)\n              ? timeRaw.toUpperCase() as SceneTimeOfDay\n              : 'DAY';\n\n          currentScene = {\n            sceneHeading: line,\n            intExt,\n            locationName: location,\n            timeOfDay,\n"
          new_auto_parse = "          currentScene = {\n            sceneHeading: line,\n            intExt: parsedHeading.intExt,\n            locationName: parsedHeading.location,\n            timeOfDay: parsedHeading.timeOfDay,\n"
          old_manual_match = "    lines.forEach((line, lineIndex) => {\n      const trimmed = line.trim();\n      const sceneMatch = trimmed.match(/^(INT|EXT|EST|INT\\.?\\/EXT|I\\/E)[.\\s]+(.+?)(?:\\s*-\\s*(DAY|NIGHT|DAWN|DUSK|CONTINUOUS|LATER|MORNING|EVENING|SAME))?$/i);\n      \n      if (sceneMatch) {\n"
          new_manual_match = "    lines.forEach((line, lineIndex) => {\n      const trimmed = line.trim();\n      const sceneHeading = parseSceneHeadingLine(trimmed);\n      \n      if (sceneHeading) {\n"
          old_manual_fields = "        currentSceneData = {\n          heading: trimmed,\n          intExt: sceneMatch[1].toUpperCase().replace('.', '').replace('/', '/'),\n          location: sceneMatch[2]?.trim() || '',\n          timeOfDay: sceneMatch[3]?.toUpperCase() || 'DAY',\n"
          new_manual_fields = "        currentSceneData = {\n          heading: trimmed,\n          intExt: sceneHeading.intExt,\n          location: sceneHeading.location,\n          timeOfDay: sceneHeading.timeOfDay,\n"
          replacements = [(insert_after, insert_after + helper, 'shared helper insertion'), (old_auto_types, new_auto_types, 'remove duplicated auto time types'), (old_auto_heading, new_auto_heading, 'auto heading detection'), (old_auto_parse, new_auto_parse, 'auto heading parse'), (old_manual_match, new_manual_match, 'manual heading detection'), (old_manual_fields, new_manual_fields, 'manual heading fields')]
          for old, new, label in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected exactly one match, found {count}')
            text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Remove one-shot workflow
        run: rm .github/workflows/tmp-role-room-scene-heading-recovery.yml

      - name: Verify scope and parser invariants
        run: |
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git diff --exit-code -- . ':!.github/workflows/tmp-role-room-scene-heading-recovery.yml' ':!frontend/client/src/components/role-room/components/ManuscriptPanel.tsx'
          grep -F "KVELD: 'EVENING'" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          grep -F "const parsedHeading = parseSceneHeadingLine(line);" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          grep -F "const sceneHeading = parseSceneHeadingLine(trimmed);" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx
          ! grep -F "line.split('-')" frontend/client/src/components/role-room/components/ManuscriptPanel.tsx

      - name: Commit recovered fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/client/src/components/role-room/components/ManuscriptPanel.tsx .github/workflows/tmp-role-room-scene-heading-recovery.yml
          git commit -m "fix(role-room): parse Norwegian scene time-of-day"
          git push origin HEAD:fix/role-room-no-en-scene-heading-20260815
