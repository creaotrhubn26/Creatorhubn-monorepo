name: SenseAid Explore seed demo-innhold

# Legger demo-innholdet for SenseAid Explore (Kvadraturen, Akershus festning,
# Operaen: område, kategorier, seks steder, manus nb/en, quiz) inn i
# produksjonsdatabasen med `npm run seed:reiseguide`. Idempotent (upsert på
# id): kan kjøres på nytt etter hver manusendring i
# backend/server/reiseguide-demo-data.ts. Rører aldri lydfiler, teksting eller
# brukernes vurderinger og besøkslogg.
#
# Etter seeden henter `npm run reiseguide:images` heltebilder fra Wikimedia
# Commons (bare fri lisens: CC0, public domain, CC BY / CC BY-SA 2.0–4.0) og
# skriver bilde-URL, fotograf og lisens på stedene. Runneren har åpent nett;
# utviklings-skymiljøet når ikke Commons. Steder uten godkjent bilde gir
# en advarsel, ikke feil. Velg «images_dry_run» for å se valget uten å skrive.
#
# Manuell trigger, og jobben ligger i Production-miljøet slik at den bruker
# samme PRODUCTION_MIGRATION_DATABASE_URL som auto-migrate-on-push.yml.
# Migrasjonene 0640–0642, 0662 og 0663 må være kjørt først (deploy-porten gjør
# det ved merge); 0663 gir kolonnene for bildekreditering.

on:
  workflow_dispatch:
    inputs:
      images_dry_run:
        description: "Commons-bilder: bare vis valget (skriv ingen bilder)"
        type: boolean
        default: false

concurrency:
  group: senseaid-seed-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: Seed SenseAid Explore demo-innhold
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate production credentials
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_MIGRATION_DATABASE_URL is not configured in the Production environment"
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          node -e 'const u=new URL(process.env.DATABASE_URL);if(!["postgres:","postgresql:"].includes(u.protocol)||!u.hostname||!u.username)process.exit(1)'

      # tsx er en devDependency, så dev-pakker må med (i motsetning til
      # migrasjonsrunneren). --ignore-scripts hopper over puppeteer-nedlasting.
      # Optional-pakker MÅ med: esbuild (som tsx bruker) leverer plattform-
      # binæren @esbuild/linux-x64 som optionalDependency, og uten den
      # stopper tsx med «The package @esbuild/linux-x64 could not be found»
      # (kjøring 35833288845, 23.09.2026).
      - name: Install backend runtime (tsx + pg)
        run: npm ci --prefix backend --workspaces=false --ignore-scripts
      - name: Verify tsx can transform TypeScript
        run: |
          ./backend/node_modules/.bin/tsx --eval 'const n: number = 1; console.log("tsx ok", n)'

      - name: Verify migration role before writing
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          MIGRATION_LOGIN_ROLE: creatorhub_migration_login
          MIGRATION_OWNER_ROLE: creatorhub_schema_owner
          MIGRATION_OWNED_SCHEMAS: public
        run: node backend/scripts/run-production-migrations.mjs --preflight-only

      - name: Seed demo-innhold (idempotent)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          MIGRATION_OWNER_ROLE: creatorhub_schema_owner
        run: npm run seed:reiseguide --prefix backend

      # Heltebilder fra Wikimedia Commons (0663). Tabellen i loggen viser sted,
      # fil, fotograf og lisens; feiler ikke når et sted mangler bilde.
      - name: Hent heltebilder fra Wikimedia Commons
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          MIGRATION_OWNER_ROLE: creatorhub_schema_owner
          IMAGES_DRY_RUN: ${{ inputs.images_dry_run }}
        run: |
          set -euo pipefail
          if [ "$IMAGES_DRY_RUN" = "true" ]; then
            npm run reiseguide:images --prefix backend -- --dry-run
          else
            npm run reiseguide:images --prefix backend
          fi

      - name: Verify public API serves the demo area
        env:
          BACKEND_URL: https://creatorhub-backend-rtbl.onrender.com
        run: |
          set -euo pipefail
          areas=$(curl -fsS --connect-timeout 5 --max-time 20 -H "Accept: application/json" "$BACKEND_URL/api/guide/areas")
          count=$(jq -r '.areas | length' <<<"$areas")
          slug=$(jq -r '.areas[0].slug // ""' <<<"$areas")
          echo "Områder i produksjon: $count (første: $slug)"
          if [ "$count" -lt 1 ]; then
            echo "::error::GET /api/guide/areas returnerte ingen områder etter seed"
            exit 1
          fi
          area=$(curl -fsS --connect-timeout 5 --max-time 20 -H "Accept: application/json" "$BACKEND_URL/api/guide/areas/$slug?lang=nb")
          poi_count=$(jq -r '.pois | length' <<<"$area")
          echo "Steder i $slug: $poi_count"
          if [ "$poi_count" -lt 6 ]; then
            echo "::error::Ventet minst 6 steder i $slug, fikk $poi_count"
            exit 1
          fi
          image_count=$(jq -r '[.pois[] | select(.heroImageUrl != null)] | length' <<<"$area")
          credit_count=$(jq -r '[.pois[] | select(.heroImageCredit != null)] | length' <<<"$area")
          echo "Steder med heltebilde: $image_count av $poi_count (med kreditering: $credit_count)"
          if [ "$image_count" -lt "$poi_count" ]; then
            echo "::warning::$((poi_count - image_count)) av $poi_count steder mangler heltebilde; se tabellen i Commons-steget"
          fi
