name: Visual Editor E2E Gate

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: visual-editor-e2e-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kostnadsvakt: PR-er som ikke rører frontend/ (backend-, docs-, iPad-PR-er)
  # hopper over denne 90-minutters jobben. Hoppet over via `if` rapporteres som
  # «skipped», som GitHub godtar for påkrevde sjekker — i motsetning til et
  # workflow-nivå `paths:`-filter, som ville latt en påkrevd sjekk henge.
  # merge_group og workflow_dispatch kjører alltid.
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff against base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELF: visual-editor-e2e-gate.yml
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" || true)
          if [ -z "$files" ] || echo "$files" | grep -qE "^(frontend/|package(-lock)?\.json$|\.github/workflows/$SELF$)"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "Ingen frontend-endringer — hopper over."
          fi

  visual-editor-regression:
    name: Visual Editor Regression
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --workspaces=false

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run visual editor hardened regression
        run: npm run test:e2e:visual-editor-hardened

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual-editor
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-visual-editor
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
