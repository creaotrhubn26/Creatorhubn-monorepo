name: Visual Editor E2E Gate

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: visual-editor-e2e-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-editor-regression:
    name: Visual Editor Regression
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run visual editor hardened regression
        run: npm run test:e2e:visual-editor-hardened

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual-editor
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-visual-editor
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
