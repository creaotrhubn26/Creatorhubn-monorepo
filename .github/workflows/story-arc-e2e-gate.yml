name: Story Arc E2E Gate

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: story-arc-e2e-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  story-arc-hardened:
    name: Story Arc Hardened E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Story Arc hardened E2E gate
        run: npm run test:e2e:story-arc-hardened

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-story-arc
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-story-arc
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
