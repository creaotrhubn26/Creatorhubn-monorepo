name: Release Creatorhub One Desk

# Triggered by pushing a tag matching creatorhub-one-desk-v*  (e.g.
# creatorhub-one-desk-v0.1.1). Builds the macOS Tauri app, signs it with
# the updater minisign key, and uploads .app.tar.gz + .app.tar.gz.sig +
# latest.json manifest to a GitHub Release. The Tauri updater plugin reads
# latest.json from
#   https://github.com/<owner>/<repo>/releases/latest/download/creatorhub-one-desk-darwin-aarch64.json
# (and -x86_64) to detect new versions.
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY_ONE_DESK (the contents of
# ~/.tauri/one-desk on the dev machine that generated the keypair). NB:
# separat fra Post Agent's TAURI_SIGNING_PRIVATE_KEY så de to appene
# aldri kan utilsiktet bytte signing-nøkler.

on:
  push:
    tags:
      - 'creatorhub-one-desk-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-mac:
    name: Build (macOS ${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: darwin-aarch64
          - target: x86_64-apple-darwin
            arch_label: darwin-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/creatorhub-one-desk-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/creatorhub-one-desk/src-tauri

      - name: Install npm deps
        working-directory: apps/creatorhub-one-desk
        run: npm ci || npm install

      # Importer Apple Developer ID-sertifikatet til en midlertidig
      # keychain. Tauri-build leser signingIdentity fra tauri.conf.json
      # og signerer .app + .dmg + .app.tar.gz automatisk.
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Bekreft at signing identity faktisk er tilgjengelig
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build Tauri app (signed)
        working-directory: apps/creatorhub-one-desk
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_ONE_DESK }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_ONE_DESK_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      # Notariser med App Store Connect API. notarytool venter på
      # Apple's malware-skanning (typisk 1-5 min). Etter suksess
      # stapler vi notarisasjon-billetten på .app + .dmg så Gatekeeper
      # godkjenner offline.
      - name: Notarize .app + .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          BUNDLE_DIR="apps/creatorhub-one-desk/src-tauri/target/${{ matrix.target }}/release/bundle"
          APP_PATH=$(find "$BUNDLE_DIR/macos" -name "*.app" | head -1)
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" 2>/dev/null | head -1)

          # Zip .app for notarisering (notarytool tar imot .zip, .dmg, .pkg)
          APP_ZIP=$RUNNER_TEMP/app.zip
          ditto -c -k --keepParent "$APP_PATH" "$APP_ZIP"

          echo "::group::Notarize .app"
          xcrun notarytool submit "$APP_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "::endgroup::"

          # Stapler ticket på .app så Gatekeeper kan validere offline
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          if [ -n "$DMG_PATH" ]; then
            echo "::group::Notarize .dmg"
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            echo "::endgroup::"
            xcrun stapler staple "$DMG_PATH"
            xcrun stapler validate "$DMG_PATH"
          fi

          rm -f "$APP_ZIP"
          echo "::notice::✓ App + DMG signed and notarized — no Gatekeeper warning for users"

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="apps/creatorhub-one-desk/src-tauri/target/${{ matrix.target }}/release/bundle"
          TARBALL=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" | head -1)
          SIG=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz.sig" | head -1)
          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" 2>/dev/null | head -1)
          if [ -z "$TARBALL" ] || [ -z "$SIG" ]; then
            echo "::error::Expected .app.tar.gz + .sig in $BUNDLE_DIR/macos"
            ls -R "$BUNDLE_DIR" || true
            exit 1
          fi
          mkdir -p staging
          cp "$TARBALL" "staging/creatorhub-one-desk-${{ matrix.arch_label }}.app.tar.gz"
          cp "$SIG"     "staging/creatorhub-one-desk-${{ matrix.arch_label }}.app.tar.gz.sig"
          if [ -n "$DMG" ]; then
            cp "$DMG"   "staging/creatorhub-one-desk-${{ matrix.arch_label }}.dmg"
          fi
          echo "tarball=staging/creatorhub-one-desk-${{ matrix.arch_label }}.app.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sig=staging/creatorhub-one-desk-${{ matrix.arch_label }}.app.tar.gz.sig" >> "$GITHUB_OUTPUT"
          [ -n "$DMG" ] && echo "dmg=staging/creatorhub-one-desk-${{ matrix.arch_label }}.dmg" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest
        shell: bash
        run: |
          SIG_CONTENT=$(cat "${{ steps.artifacts.outputs.sig }}")
          PUB_URL="https://github.com/${{ github.repository }}/releases/download/creatorhub-one-desk-v${{ steps.ver.outputs.version }}/creatorhub-one-desk-${{ matrix.arch_label }}.app.tar.gz"
          cat > "staging/creatorhub-one-desk-${{ matrix.arch_label }}.json" <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "notes": "Se release-notes på GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "${{ matrix.arch_label == 'darwin-aarch64' && 'darwin-aarch64' || 'darwin-x86_64' }}": {
                "signature": "$SIG_CONTENT",
                "url": "$PUB_URL"
              }
            }
          }
          EOF
          cat "staging/creatorhub-one-desk-${{ matrix.arch_label }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: creatorhub-one-desk-${{ matrix.arch_label }}
          path: staging/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="creatorhub-one-desk-v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
