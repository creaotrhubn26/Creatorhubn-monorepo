name: Release Post Agent

# Triggered by pushing a tag matching post-agent-v*  (e.g. post-agent-v0.1.1).
# Builds the macOS Tauri app, signs it with the updater minisign key, and
# uploads .app.tar.gz + .app.tar.gz.sig + latest.json manifest to a GitHub
# Release. The Tauri updater plugin reads latest.json from
#   https://github.com/<owner>/<repo>/releases/latest/download/post-agent-darwin-aarch64.json
# (and -x86_64) to detect new versions.

on:
  push:
    tags:
      - 'post-agent-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.1)'
        required: true

permissions:
  contents: write  # needed to create a Release + upload artifacts

env:
  CARGO_TERM_COLOR: always

jobs:
  build-mac:
    name: Build (macOS ${{ matrix.target }})
    runs-on: macos-14  # Apple Silicon runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_label: darwin-aarch64
          - target: x86_64-apple-darwin
            arch_label: darwin-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Strip "post-agent-v" prefix from tag
            VERSION="${GITHUB_REF#refs/tags/post-agent-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/resolve-script-manager/src-tauri

      - name: Install npm deps
        working-directory: apps/resolve-script-manager
        run: npm ci

      # Importer Apple Developer ID-sertifikatet til en midlertidig
      # keychain. Tauri-build leser signingIdentity fra tauri.conf.json
      # og signerer .app + .dmg + .app.tar.gz automatisk.
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build Tauri app (signed)
        working-directory: apps/resolve-script-manager
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      # Notariser med App Store Connect API. Submit uten --wait, så
      # wait i separat retry-loop (Apple notary-API kan droppe network
      # midt i poll — vi retry'er max 3× med stigende backoff).
      - name: Notarize .app + .dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        # 350 min = rikelig rom for 3 × 40 min retry-ventene + byggetid selv når
        # Apples notary-kø henger. En enkelt submission tar normalt 5-15 min, men
        # under kø-incidenter (2026-06-05, 06-07, 06-08) har den stått «In Progress»
        # i 90+ min. v0.2.22 traff den gamle 160-grensen og feilet (update_failed)
        # selv om 3/4 submissions var Accepted. Job-default er 360, så 350 er trygt.
        timeout-minutes: 350
        run: |
          BUNDLE_DIR="apps/resolve-script-manager/src-tauri/target/${{ matrix.target }}/release/bundle"
          APP_PATH=$(find "$BUNDLE_DIR/macos" -name "*.app" | head -1)
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" 2>/dev/null | head -1)

          notarize_with_retry() {
            local target="$1"
            local label="$2"
            local submission_id=""
            local attempts=0
            local max_attempts=3

            echo "::group::Submit $label for notarization"
            submission_id=$(xcrun notarytool submit "$target" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
            echo "Submission ID: $submission_id"
            echo "::endgroup::"

            if [ -z "$submission_id" ]; then
              echo "::error::Failed to submit $label for notarization"
              return 1
            fi

            while [ $attempts -lt $max_attempts ]; do
              attempts=$((attempts + 1))
              echo "::group::Wait for notarization (attempt $attempts/$max_attempts)"
              if xcrun notarytool wait "$submission_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --timeout 40m; then
                echo "::endgroup::"
                local status
                status=$(xcrun notarytool info "$submission_id" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" \
                  --output-format json | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))")
                if [ "$status" = "Accepted" ]; then
                  echo "::notice::$label notarized successfully"
                  return 0
                fi
                echo "::error::Notarization status: $status (expected Accepted)"
                return 1
              fi
              echo "::endgroup::"
              echo "::warning::Notary wait failed (likely Apple-side network blip), retrying..."
              sleep $((attempts * 30))
            done
            # IKKE-fatal ved timeout: Apple-køen kan henge i timevis (incident
            # 2026-06-05/07) selv om innsendingen til slutt blir Accepted. Vi lar
            # releasen publisere USTAPLET — appen er fortsatt notarisert async og
            # passerer Gatekeeper online. Staple kan gjøres ved re-kjøring senere.
            echo "::warning::$label: notarisering ikke bekreftet innen vinduet ($submission_id). Publiserer ustaplet — sjekk 'notarytool info $submission_id' senere; re-kjør for staple."
            return 0
          }

          APP_ZIP=$RUNNER_TEMP/app.zip
          ditto -c -k --keepParent "$APP_PATH" "$APP_ZIP"

          notarize_with_retry "$APP_ZIP" ".app"
          # Best-effort staple: feiler hvis notarisering ikke er bekreftet ennå —
          # da publiserer vi ustaplet (virker online) i stedet for å felle releasen.
          xcrun stapler staple "$APP_PATH" || echo "::warning::.app ikke staplet (notarisering ikke bekreftet ennå)"
          xcrun stapler validate "$APP_PATH" || true

          if [ -n "$DMG_PATH" ]; then
            notarize_with_retry "$DMG_PATH" ".dmg"
            xcrun stapler staple "$DMG_PATH" || echo "::warning::.dmg ikke staplet (notarisering ikke bekreftet ennå)"
            xcrun stapler validate "$DMG_PATH" || true
          fi

          rm -f "$APP_ZIP"
          echo "::notice::✓ Post Agent .app + .dmg signed and notarized"

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          BUNDLE_DIR="apps/resolve-script-manager/src-tauri/target/${{ matrix.target }}/release/bundle"
          TARBALL=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" | head -1)
          SIG=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz.sig" | head -1)
          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1)
          if [ -z "$TARBALL" ] || [ -z "$SIG" ]; then
            echo "::error::Expected .app.tar.gz + .sig in $BUNDLE_DIR/macos"
            ls -R "$BUNDLE_DIR" || true
            exit 1
          fi
          # Rename so the GitHub Release filename is predictable for the updater URL
          mkdir -p staging
          cp "$TARBALL" "staging/post-agent-${{ matrix.arch_label }}.app.tar.gz"
          cp "$SIG"     "staging/post-agent-${{ matrix.arch_label }}.app.tar.gz.sig"
          if [ -n "$DMG" ]; then
            cp "$DMG"   "staging/post-agent-${{ matrix.arch_label }}.dmg"
          fi
          echo "tarball=staging/post-agent-${{ matrix.arch_label }}.app.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sig=staging/post-agent-${{ matrix.arch_label }}.app.tar.gz.sig" >> "$GITHUB_OUTPUT"
          [ -n "$DMG" ] && echo "dmg=staging/post-agent-${{ matrix.arch_label }}.dmg" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest
        shell: bash
        run: |
          SIG_CONTENT=$(cat "${{ steps.artifacts.outputs.sig }}")
          PUB_URL="https://github.com/${{ github.repository }}/releases/download/post-agent-v${{ steps.ver.outputs.version }}/post-agent-${{ matrix.arch_label }}.app.tar.gz"
          cat > "staging/post-agent-${{ matrix.arch_label }}.json" <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "notes": "See release notes on GitHub",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "${{ matrix.arch_label == 'darwin-aarch64' && 'darwin-aarch64' || 'darwin-x86_64' }}": {
                "signature": "$SIG_CONTENT",
                "url": "$PUB_URL"
              }
            }
          }
          EOF
          cat "staging/post-agent-${{ matrix.arch_label }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: post-agent-${{ matrix.arch_label }}
          path: staging/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-mac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="post-agent-v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

      # #10: hold marketplace-nedlastingen aktuell automatisk. Laster release-
      # assets til B2 + bumper POST_AGENT_LATEST_VERSION på Render. Best-effort
      # (continue-on-error) + henter B2-creds via Render-API'et med RENDER_API_KEY,
      # så ingen ekstra B2-secrets trengs. Hopper over hvis nøkkelen ikke er satt.
      - name: Auto-bump marketplace download (B2 + Render)
        continue-on-error: true
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
          SID: srv-d76ob60ule4c73dv2p60
        shell: bash
        run: |
          set -e
          pip install --quiet boto3
          curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$SID/env-vars?limit=100" > /tmp/env.json
          TAGV="${TAG#post-agent-}"
          TAGV="$TAGV" python3 - <<'PY'
          import os, json, glob, boto3
          from botocore.config import Config
          envs = {e["envVar"]["key"]: (e["envVar"]["value"] or "").strip() for e in json.load(open("/tmp/env.json"))}
          region = envs.get("B2_REGION") or "eu-central-003"
          s3 = boto3.client("s3", region_name=region, endpoint_url=f"https://s3.{region}.backblazeb2.com",
            aws_access_key_id=envs["B2_ROLE_ROOM_APPLICATION_KEY_ID"], aws_secret_access_key=envs["B2_ROLE_ROOM_APPLICATION_KEY"],
            config=Config(s3={"addressing_style":"path"}))
          bucket = envs["B2_ROLE_ROOM_BUCKET_NAME"]; tagv = os.environ["TAGV"]
          ct = {".dmg":"application/x-apple-diskimage",".gz":"application/gzip",".sig":"text/plain",".json":"application/json"}
          for f in sorted(glob.glob("dist/*")):
              if not os.path.isfile(f): continue
              n = os.path.basename(f)
              with open(f,"rb") as fh:
                  s3.put_object(Bucket=bucket, Key=f"downloads/post-agent/{tagv}/{n}", Body=fh.read(),
                                ContentType=ct.get(os.path.splitext(n)[1],"application/octet-stream"))
              print("uploaded", n)
          PY
          curl -s -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d "{\"value\":\"$TAGV\"}" "https://api.render.com/v1/services/$SID/env-vars/POST_AGENT_LATEST_VERSION" >/dev/null
          echo "✓ B2-opplastet + POST_AGENT_LATEST_VERSION=$TAGV"
