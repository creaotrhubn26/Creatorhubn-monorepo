name: iPad Capture CI

on:
  pull_request:
    paths:
      - 'ipad/**'
      - '.github/workflows/ipad-capture-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ipad/**'

jobs:
  build:
    # macos-15 (Sequoia) inkluderer Xcode 16+ som trengs for Swift 6.0.
    # macos-14 har bare Xcode 15.x og kan ikke kompilere prosjektet.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ipad/CaptureApp
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest-stable)
        # Bruker samme Xcode-valg som capture-testflight.yml — `latest-stable`
        # har iOS 26-SDK (FoundationModels) + nyere Swift-concurrency. Runner-
        # defaulten (/Applications/Xcode.app) kan være eldre og feilet på
        # `canImport(FoundationModels)` + actor-isolasjon → falsk-rød build.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: |
          brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen

      - name: SwiftLint
        run: swiftlint --strict

      - name: Build (no test)
        # CI runneren har ikke konkrete simulator-enheter pre-installert
        # (kun placeholder). Bruker generic platform så vi kun bygger.
        # Tester må kjøres lokalt eller via separat job med simulator-setup.
        run: |
          xcodebuild \
            -project CaptureApp.xcodeproj \
            -scheme CaptureApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
