name: iPad Capture CI

on:
  pull_request:
    paths:
      - 'ipad/**'
      - '.github/workflows/ipad-capture-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ipad/**'

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ipad/CaptureApp
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install tooling
        run: |
          brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen

      - name: SwiftLint
        run: swiftlint --strict

      - name: Build + test
        run: |
          xcodebuild \
            -project CaptureApp.xcodeproj \
            -scheme CaptureApp \
            -destination 'platform=iOS Simulator,name=iPad Pro (12.9-inch) (6th generation),OS=17.5' \
            -configuration Debug \
            clean build test \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
