name: iPad Capture CI

on:
  pull_request:
    paths:
      - 'ipad/**'
      - '.github/workflows/ipad-capture-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ipad/**'

jobs:
  build:
    # macos-15 (Sequoia) inkluderer Xcode 16+ som trengs for Swift 6.0.
    # macos-14 har bare Xcode 15.x og kan ikke kompilere prosjektet.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ipad/CaptureApp
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        # Prosjektet bruker SWIFT_VERSION 6.0 (krever Xcode 16+). Bruker
        # /Applications/Xcode.app som peker til runner-ens nyeste Xcode.
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install tooling
        run: |
          brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen

      - name: SwiftLint
        run: swiftlint --strict

      - name: Build + test
        run: |
          xcodebuild \
            -project CaptureApp.xcodeproj \
            -scheme CaptureApp \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=latest' \
            -configuration Debug \
            clean build test \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
