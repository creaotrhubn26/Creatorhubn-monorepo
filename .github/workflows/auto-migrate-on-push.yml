name: Production migrations and backend deploy

# This workflow is the only owner of CreatorHub backend production deploys.
# Transition commits must include [skip render] until this workflow has disabled
# Render auto-deploy for the service.

on:
  pull_request:
    paths:
      - ".github/workflows/auto-migrate-on-push.yml"
      - "backend/migrate.sh"
      - "backend/migrations/**"
      - "backend/scripts/run-production-migrations.mjs"
      - "scripts/deploy/render-backend.mjs"
      - "render.yaml"
      - "backend/render.yaml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full main commit SHA to deploy; blank uses the workflow SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: creatorhub-production-database-and-backend
  cancel-in-progress: false

env:
  BACKEND_URL: https://creatorhub-backend-rtbl.onrender.com
  RENDER_SERVICE_ID: srv-d76ob60ule4c73dv2p60
  TARGET_SHA: ${{ inputs.commit || github.sha }}

jobs:
  validate:
    name: Validate production deploy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify migration fail-fast contract
        run: node backend/scripts/run-production-migrations.mjs --self-test

      - name: Verify Render deploy contract
        run: node scripts/deploy/render-backend.mjs --self-test

      - name: Verify shell entrypoint
        run: bash -n backend/migrate.sh

  migrate-deploy:
    name: Migrate, deploy Render, and smoke test
    if: github.event_name != 'pull_request'
    needs: validate
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact deploy commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate Render credential
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY is not configured"
            exit 1
          fi
          echo "::add-mask::$RENDER_API_KEY"

      - name: Disable Render auto-deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/deploy/render-backend.mjs disable-auto-deploy

      - name: Validate dedicated migration credential
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PRODUCTION_MIGRATION_DATABASE_URL is not configured in the Production environment"
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          node -e "const u=new URL(process.env.DATABASE_URL);if(![\"postgres:\",\"postgresql:\"].includes(u.protocol)||!u.hostname||!u.username)process.exit(1)"

      - name: Install pinned migration runtime
        run: npm ci --prefix backend --workspaces=false --omit=dev --omit=optional --ignore-scripts

      - name: Acquire database lock and apply migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: backend/migrate.sh

      - name: Deploy exact commit and verify production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/deploy/render-backend.mjs deploy-and-verify "$TARGET_SHA"
