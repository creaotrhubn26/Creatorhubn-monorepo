name: Leadgrid plan-grace expire

# Kjører daglig kl. 03:00 UTC. POST /api/leadgrid/plan-grace/expire
# lokker org ned til Solo Free hvis grace-perioden er utløpt + sender
# notify-mail.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daglig
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leadgrid-grace-expire
  cancel-in-progress: false

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run grace-expire
        env:
          TOKEN: ${{ secrets.LEADGRID_CRON_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::LEADGRID_CRON_TRIGGER_TOKEN secret er ikke satt"
            exit 1
          fi
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-cron-trigger-token: $TOKEN" \
            -H "Content-Type: application/json" \
            "https://creatorhub-backend-rtbl.onrender.com/api/leadgrid/plan-grace/expire")
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Grace-expire feilet (HTTP $CODE)"
            exit 1
          fi
