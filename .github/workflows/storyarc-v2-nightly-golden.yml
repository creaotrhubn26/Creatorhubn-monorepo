name: Story Arc V2 Nightly Golden Benchmark

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  nightly-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run nightly benchmark (fail on regression)
        env:
          STORYARC_BASE_URL: ${{ secrets.STORYARC_BASE_URL }}
          STORYARC_GOLDEN_MANIFEST: scripts/storyarc-v2-golden.manifest.example.json
        run: |
          if [ -z "${STORYARC_BASE_URL}" ]; then
            echo "STORYARC_BASE_URL secret is missing; skipping nightly benchmark."
            exit 0
          fi
          npm run storyarc:v2:benchmark:nightly -- --base-url "${STORYARC_BASE_URL}" --manifest "${STORYARC_GOLDEN_MANIFEST}"

      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyarc-v2-golden-nightly
          path: backend/tmp/storyarc-v2-golden-nightly-latest.json
          if-no-files-found: ignore
          retention-days: 14
