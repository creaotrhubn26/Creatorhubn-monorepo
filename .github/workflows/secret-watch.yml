name: Control Center secret-watch

# Proaktiv nøkkelvakt: prober daglig gyldigheten (+ GitHub-PAT-utløpsdato) til
# de kritiske plattform-nøklene og varsler super_admin FØR en nøkkel utløper/
# roteres-vekk. Token-gated via CRON_TRIGGER_TOKEN (samme som cockpit-cron).
#
# Endepunkt: POST /api/control-center/secret-watch/run

on:
  schedule:
    - cron: '17 6 * * *'   # daglig kl. ~06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-watch
  cancel-in-progress: false

env:
  BACKEND_URL: https://creatorhub-backend-rtbl.onrender.com

jobs:
  run-secret-watch:
    name: Prob nøkler + utløp
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/control-center/secret-watch/run
        env:
          CRON_TRIGGER_TOKEN: ${{ secrets.CRON_TRIGGER_TOKEN }}
        run: |
          if [ -z "$CRON_TRIGGER_TOKEN" ]; then
            echo "::error::CRON_TRIGGER_TOKEN GitHub-secret er ikke satt."
            exit 1
          fi
          RES=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-trigger-token: $CRON_TRIGGER_TOKEN" \
            --max-time 120 \
            "$BACKEND_URL/api/control-center/secret-watch/run")
          CODE=$(echo "$RES" | tail -1)
          BODY=$(echo "$RES" | sed '$d')
          echo "HTTP $CODE"
          echo "Body: $BODY"
          if [ "$CODE" = "401" ]; then
            echo "::error::CRON_TRIGGER_TOKEN matcher ikke Render-env."
            exit 1
          fi
          if [ "$CODE" -ge 500 ]; then
            echo "::error::Backend-feil ($CODE)"
            exit 1
          fi
          PROBLEMS=$(echo "$BODY" | jq -r '.problems // 0' 2>/dev/null || echo 0)
          if [ "$PROBLEMS" != "0" ] && [ -n "$PROBLEMS" ]; then
            echo "::warning::$PROBLEMS nøkkel(er) ugyldig/utløper — se Control Center «Nøkler»/e-post."
          fi
          echo "::notice::Secret-watch ferdig"
