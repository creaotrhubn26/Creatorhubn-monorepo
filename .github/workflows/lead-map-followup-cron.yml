name: Lead Map followup-notifications

# Hver 15. min finner forfalt follow-up + trigger varsler til
# tildelt selger. Per (recipient, lead): 1 varsel pr 24t (throttle
# i backend).

on:
  schedule:
    - cron: "*/15 * * * *"   # hver 15. min
  workflow_dispatch:        # manuell trigger fra UI

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger backend
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://creatorhub-backend-rtbl.onrender.com/api/admin-room/lead-map/cron/followup-notifications" \
            -H "x-cron-trigger-token: ${{ secrets.MIGRATE_TRIGGER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body" | head -c 1000
          if [ "$status" != "200" ]; then
            echo "::error::Cron failed with status $status"
            exit 1
          fi
          sent=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('notifications_sent', 0))" || echo "?")
          echo "Sent $sent notifications" >> "$GITHUB_STEP_SUMMARY"
