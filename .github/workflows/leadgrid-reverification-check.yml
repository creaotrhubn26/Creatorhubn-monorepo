name: Leadgrid re-verification check

# Kjører daglig 04:00 UTC. Sjekker partnere som har <30 dager til
# next_verification_due og oppretter admin-alerts (severity basert på
# hvor nær eller utgått).

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leadgrid-reverification
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run re-verification check
        env:
          TOKEN: ${{ secrets.LEADGRID_CRON_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::LEADGRID_CRON_TRIGGER_TOKEN secret er ikke satt"
            exit 1
          fi
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-cron-trigger-token: $TOKEN" \
            "https://creatorhub-backend-rtbl.onrender.com/api/leadgrid/reverifications/check")
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Re-verification-check feilet (HTTP $CODE)"
            exit 1
          fi
