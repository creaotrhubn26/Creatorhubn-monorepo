[package]
name = "creatorhub-one-desk"
version = "0.1.10"
description = "Creatorhub One Desk — Mac-companion til iPad CaptureApp og minnekort-ingest"
authors = ["CreatorHub Norge"]
edition = "2024"

[lib]
name = "creatorhub_one_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dirs = "5"
urlencoding = "2"
notify = "6"
walkdir = "2"
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
mdns-sd = "0.11"
rand = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
futures-util = "0.3"
libloading = "0.7"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "test-util"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }
