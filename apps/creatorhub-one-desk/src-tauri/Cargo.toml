[package]
name = "creatorhub-one-desk"
version = "0.1.0"
description = "Creatorhub One Desk — Mac-companion til iPad CaptureApp og minnekort-ingest"
authors = ["CreatorHub Norge"]
edition = "2024"

[lib]
name = "creatorhub_one_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5"
urlencoding = "2"
notify = "6"
walkdir = "2"
libc = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
mdns-sd = "0.11"
rand = "0.8"
