[package]
name = "creatorhub-protools-companion"
version = "0.3.1"
description = "Creatorhub Pro Tools Companion — native agent som synker Pro Tools-markører og bounces til EaseVerse / Sound Room"
authors = ["CreatorHub Norge"]
edition = "2021"

[lib]
name = "creatorhub_protools_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "6"
dirs = "5"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
hound = "3.5"
ebur128 = { version = "0.1.10", features = ["precision-true-peak"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
