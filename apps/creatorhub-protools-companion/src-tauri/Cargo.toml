[package]
name = "creatorhub-protools-companion"
version = "0.1.1"
description = "Creatorhub Pro Tools Companion — native agent som synker Pro Tools-markører og bounces til EaseVerse / Sound Room"
authors = ["CreatorHub Norge"]
edition = "2021"

[lib]
name = "creatorhub_protools_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "6"
dirs = "5"

[dev-dependencies]
tempfile = "3"
