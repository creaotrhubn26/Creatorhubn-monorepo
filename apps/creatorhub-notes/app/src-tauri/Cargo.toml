[package]
name = "creatorhub-notes-app"
version = "0.1.0"
description = "Notater — skriv, søk og gjenfinn prosjektnotater offline"
authors = ["CreatorHub Norge"]
edition = "2021"

[lib]
name = "creatorhub_notes_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
creatorhub-notes-indexer = { path = "../../indexer" }

[dev-dependencies]
tempfile = "3"
