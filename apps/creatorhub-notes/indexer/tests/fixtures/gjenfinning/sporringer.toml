# Gjenfinningsdatasettet: norske søk og hva de skal finne.
#
# `treff` er de ekte treffene — notatet handler om det hun spurte om.
# `sammensetning` er et annet ord som begynner likt («utstyr» →
# «utstyrsregister»): akseptabelt, men svakere, og telles for seg.
# Alt annet notatet som kommer tilbake er et falskt treff. Korpuset er
# hele verden her, så «falskt» er målbart og ikke en vurdering.

[[sporring]]
# bestemt form skal finne grunnform
q = "utstyret"
treff = ["2026-03-04-nytt-utstyr.md", "2026-03-11-lageret-i-lillestrom.md"]
sammensetning = ["2026-04-02-utstyrsregisteret.md"]

