<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Post Agent Bridge</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 12px;
        color: #ddd;
        background: #1f1f1f;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 10px;
        letter-spacing: 0.3px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #2a2a2a;
        margin-bottom: 10px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #888;
        flex-shrink: 0;
      }
      .dot.ok { background: #3fb950; }
      .dot.bad { background: #f85149; }
      .meta {
        font-size: 11px;
        color: #888;
        line-height: 1.5;
      }
      .log {
        margin-top: 10px;
        background: #141414;
        border-radius: 6px;
        padding: 8px 10px;
        font-family: ui-monospace, SF Mono, Menlo, monospace;
        font-size: 10.5px;
        line-height: 1.45;
        max-height: 160px;
        overflow-y: auto;
        color: #aaa;
      }
      .log .row { padding: 1px 0; }
      .log .row.err { color: #f85149; }
      .log .row.ok { color: #3fb950; }
      button {
        background: #2a2a2a;
        color: #ddd;
        border: 1px solid #3a3a3a;
        padding: 4px 10px;
        font-size: 11px;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 4px;
      }
      button:hover { background: #333; }
    </style>
  </head>
  <body>
    <h1>Post Agent Bridge</h1>
    <div class="status">
      <div id="dot" class="dot"></div>
      <div>
        <div id="state">Frakoblet</div>
        <div class="meta" id="meta">ws://localhost:1733</div>
      </div>
    </div>
    <div>
      <button id="reconnect">Koble til på nytt</button>
    </div>
    <div class="log" id="log"></div>
    <script src="index.js"></script>
  </body>
</html>
