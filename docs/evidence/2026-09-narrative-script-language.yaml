  - frontend/shared/narrative-format/ (eksport/import/Markdown/standalone — Fase 3, levert)
  - frontend/shared/narrative-player/ + frontend/client/public/embed/narrative-player.js (Fase 3)
  - backend/server/role-room-narrative-routes.ts (export.json, export.md, import, share-links, public/:token)
