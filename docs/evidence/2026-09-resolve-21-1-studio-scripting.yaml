claim: >
  DaVinci Resolve 21.1 (released 2026-09-07/08) makes advanced/external
  scripting a Resolve Studio-only feature and drops Python 2 support
  entirely; neither change affects Post Agent because bridge.py already
  hard-requires "DaVinci Resolve Studio.app" install paths and is already
  spawned with system python3. 21.1 also adds ~20 new scripting APIs
  (multicam create/flatten, SmartSwitch, timeline clip auto-align, Media
  Pool transcription w/ speaker+timing, codec/audio render-setting queries,
  keyboard/render presets, built-in console) that are pure opportunity.
source_type: release_notes
source: >
  Release coverage 2026-09-07/08 (cined.com "DaVinci Resolve 21.1 Released –
  AI Assistant Integration via MCP, Individual HDR Trims, and Python
  Scripting Moves to Studio", provideocoalition.com, newsshooter.com,
  digitalproduction.com); repo check: apps/resolve-script-manager/python/bridge.py
  (RESOLVE_SCRIPT_LIB fallback paths, python3 spawn) and health_check.py
  (Studio-required warning strings).
authority_tier: 2
vendor: Blackmagic Design
product: DaVinci Resolve (scripting API)
version_scope: "21.1"
publication_date: "2026-09-21"
valid_from: "2026-09"
valid_to: "until the next Resolve minor/point release changes the scripting surface again (watch weekly via doc-intel-impact-vurdering)"
evidence_summary: >
  bridge.py:36 and :44 already only search "DaVinci Resolve Studio.app"
  paths for fusionscript.so/DaVinciResolve.mcpb; health_check.py:147/190
  already warn "Install Resolve Studio" when the module or app isn't
  reachable. Post Agent has never supported the free edition, so 21.1's
  new Studio-only gate on advanced scripting is a no-op for us. bridge.py:156
  confirms Tauri already spawns scripts with system python3 — the removed
  Python 2 support is likewise a non-issue. Blackmagic's own VERSION API
  (www.blackmagicdesign.com) was blocked by this session's egress proxy
  again, so version confirmation is WebSearch-corroborated (Tier 3
  corroborating Tier 2 release coverage), not a live Tier 1 fetch —
  strong_evidence, not Verified.
interpretation: >
  No migration or gating work needed for the version bump itself. The new
  scripting surface (multicam, transcription-with-timing, render-setting
  queries) is additive opportunity work, not a compatibility requirement —
  see project_impact and the Produktmuligheter section of
  docs/impact-reports/2026-09-21-impact.md.
project_impact: >
  apps/resolve-script-manager/python/scripts/timeline/edit_assistants.py
  (multicam + auto-align fit wedding/highlight curation flows),
  apps/resolve-script-manager/python/scripts/export/delivery_manager.py
  (codec/audio render-setting queries, keyboard/render presets),
  apps/resolve-script-manager/python/scripts/qc/technical_qc.py
  (transcription w/ speaker+timing as a QC data source).
confidence: strong_evidence
decision: >
  GO — stay current with Resolve 21.1; no migration work, no code change
  required by the version bump itself. Supersedes the "no version gap"
  framing in docs/evidence/2026-08-resolve-21-impact.yaml (that file was
  written against 21.0.4; the Studio-only scripting gate introduced in 21.1
  is the first version-bump that could in principle have broken us, and it
  didn't, because we were already Studio-only by our own design, not by
  Blackmagic's).
affected:
  - apps/resolve-script-manager/python/bridge.py
  - apps/resolve-script-manager/python/health_check.py
  - apps/resolve-script-manager/python/scripts/timeline/edit_assistants.py
  - apps/resolve-script-manager/python/scripts/export/delivery_manager.py
  - apps/resolve-script-manager/python/scripts/qc/technical_qc.py
lesson: >
  A vendor tightening a paid-tier gate is only a compatibility risk if the
  project was relying on the looser (free-tier) behavior. Repo-intelligence
  before version-intelligence caught that we weren't — checking our own
  fallback/error-message strings settled this faster than reading the full
  21.1 release notes for scripting-tier language.
