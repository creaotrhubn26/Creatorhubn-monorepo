evidence_summary: >
  Decisions with long tails: (1) manuscript import is dry-run first and never deletes — missing
  scenes/lines become open questions (AGENTS.md rule); (2) the CI webhook stores its secret in
  plaintext (HMAC needs the raw secret; Leadgrid precedent) and is mounted before the global body
  parser (raw body); gate writes go through setSceneGate so "passed requires evidence" also binds
  CI; (3) the script guardian runs deterministic rules without a model first and sends only
  scenes changed since the last run to claude-opus-5 (effort medium, cache_control, strict tool),
  accept = open question, never a script edit; (4) playtest telemetry is always-204 with sha256
  project tokens and no PII (random session id only), 500/batch, 600/min/token, 90-day retention
  (manual delete for now); (5) the Swift runtime cannot be compiled in Linux CI — parity is by
  fixture transcript + CHECKLIST §3 (`swift test` locally); (6) AI reference frames go through the
  existing storyboard generate-frame (no persistence, no cost control) and are capped at 10/day
  per project in our own persist route; the shared /api/ai/tts endpoint has no billing gate —
  UI-gated only, documented hole; (7) `ci_evidence` and `playtest_telemetry` are Studio features
  from 0645; existing hooks/tokens keep working because the webhook/ingest check only secret/token;
  (8) maxProjects is enforced at the first Story Graph write in a new project (the film project
  creation route is shared and does not know the game plan).
interpretation: >
  The vertical is now a closed loop for our own studio and sellable to others: data flows in from
  the manuscript and the build, out to the iPad runtime, and back as telemetry, with the guardian
  reading fresh data.
project_impact: >
  Any change to the plan model (game_plan features), the webhook mount order in index.ts, the
  telemetry token scheme, or the runtime packages must revisit this file and the docs in
  docs/role-room/STORY_GRAPH_{MANUSCRIPT_IMPORT,CI_EVIDENCE,PLAYTEST_TELEMETRY,STUDIO_GUIDE,API}.md.
