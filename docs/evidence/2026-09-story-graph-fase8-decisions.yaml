claim: >
  Story Graph Fase 8 (8a–8g) closes three loops — manuscript → Story Graph (document import with
  dry-run diff), game build → gates (HMAC CI evidence webhook), Story Graph → game (Swift runtime,
  onEvent hook, always-204 playtest telemetry) — plus a deterministic-first script guardian, scene
  table read / AI reference frames, and a sales-ready packaging (templates, plan features, hardening).
source_type: code_analysis
