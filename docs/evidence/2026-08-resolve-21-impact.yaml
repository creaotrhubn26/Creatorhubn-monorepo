claim: >
  DaVinci Resolve 21.0.4 (released 2026-08-05) removes none of the 27 scripting
  API methods Post Agent actually uses; v21 adds scripting APIs (timeline clip
  selection, timeline object from media pool entry, SetRenderSettings
  handles/extents/data-burn) that are pure opportunity for the edit-assistant
  and render pipeline.
source_type: api_reference
source: >
  Scripting API doc v21.0 (community-mirrored README,
  https://gist.github.com/X-Raym/2f2bf453fc481b9cca624d7ca0e19de8) +
  release coverage 21.0.4 (cined.com, nofilmschool.com, newsshooter.com
  2026-08-05) + local install check.
authority_tier: 2
vendor: Blackmagic Design
product: DaVinci Resolve (scripting API)
version_scope: "21.0 / 21.0.4"
publication_date: "2026-08-09"
evidence_summary: >
  Impact run (first live use of documentation-intelligence pipeline):
  repo-intelligence extracted 27 distinct scripting methods actually called in
  apps/resolve-script-manager/python (heaviest: GetName, GetClipProperty,
  GetCurrentTimeline, GetItemListInTrack, AppendToTimeline, ImportMedia,
  render pipeline SetRenderSettings/AddRenderJob/StartRendering/
  GetRenderJobList/LoadRenderPreset). All 27 present in v21.0 docs. Deprecation
  notes in v21 concern dict→list return formats in folder-listing calls we do
  not use, and 1-based nodeIndex for SetLUT/SetCDL (v16.2-era, not used).
  Local installed Resolve is already 21.0.4 — no version gap.
interpretation: >
  No breaking intersection between Resolve 21.x and Post Agent's actual API
  surface. Tier 2 confidence because Blackmagic publishes the authoritative
  scripting README only inside the app bundle (Developer/Scripting/README);
  community mirror used for symbol check, local install confirms runtime.
project_impact: >
  Post Agent Resolve integration (python/bridge.py + scripts) unaffected.
  Opportunity: 21.0.4 timeline-clip-selection API fits edit_assistants.py
  review flows; SetRenderSettings handles/extents fits delivery_manager.py.
confidence: strong_evidence
decision: >
  GO — stay current with Resolve 21.x; no migration work. Follow-up
  opportunity ticket: adopt 21.0.4 clip-selection API in edit assistants.
affected:
  - apps/resolve-script-manager/python (bridge + scripts)
lesson: >
  First live pipeline run took ~10 min: mechanical symbol extraction (git grep)
  → version intelligence (web) → API validation against version-matched doc →
  local host check. The release-monitor resolve watch cannot parse Blackmagic's
  JS-rendered support page (honest error status by design); release detection
  for Resolve relies on news coverage until a parseable official source is
  found.
