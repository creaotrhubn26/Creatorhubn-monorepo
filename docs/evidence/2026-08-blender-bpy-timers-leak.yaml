claim: >
  Blender 5.2.1 (LTS maintenance release, 2026-08-25) fixes a resource leak
  in the return value of bpy.app.timers — the exact registration/unregister
  pattern apps/blender-bridge/extension/server.py uses to drain its command
  queue on Blender's main thread as a long-lived, persistent timer
  (persistent=True). No new API surface in 5.2.1 — bugfix-only point release
  (VSE prefetch/cache fixes, Geometry Nodes empty-bundle-list crash, Grease
  Pencil fill-stroke regression, armature edit-mode crash).
source_type: release_notes
source: >
  Blender 5.2 LTS release notes (developer.blender.org/docs/release_notes/5.2/,
  blocked by this session's egress proxy — fetched via WebSearch corroboration:
  steamdb.info/patchnotes/24921459/ "Blender 5.2.1 LTS Maintenance Release",
  2026-08-25) + blender.org/releases/5-2/ (Tier 1, named in
  sources/vendors.yaml but not directly fetchable this run).
authority_tier: 3
vendor: Blender Foundation
product: Blender (bpy, headless)
version_scope: "5.2.0 → 5.2.1"
publication_date: "2026-08-31"
evidence_summary: >
  repo-intelligence (grep-symbols.sh blender) surfaced apps/blender-bridge
  (new since the 2026-08-09 baseline, per docs/specs/2026-08-10-blender-bridge-
  fase1-design.md) as the highest-relevance consumer: extension/server.py
  registers _drain_commands via bpy.app.timers.register(..., persistent=True)
  and keeps it alive for the lifetime of the Blender session (Claude×Blender
  MCP bridge, blender_version_min = 4.2.0 in blender_manifest.toml). A
  bpy.app.timers return-value leak in a long-running, persistently-registered
  timer is a slow-accumulating memory/resource issue exactly in this pattern.
  mockup-studio's Blender cinematic export (mockupCinematicExport.ts,
  src-tauri/src/blender.rs) spawns Blender per-job rather than persistently,
  so is lower risk from this specific leak.
interpretation: >
  Probable, not Strong/Verified. Per shared/SOURCE_POLICY.md, steamdb.info is
  a Tier 3 third-party database and a WebSearch snippet is a discovery aid,
  not final evidence — neither is corroboration from a Tier 1/2 first-party
  source. developer.blender.org and docs.blender.org (the pinned Tier 1
  sources in sources/vendors.yaml) were both blocked by network egress
  policy this run and were never actually fetched, so this claim rests
  entirely on a Tier 3 mirror. Downstream (decision below) should not be
  over-trusted on this basis alone; re-verify against
  blender.org/releases/5-2/ or developer.blender.org/docs/release_notes/5.2/
  directly once egress allows, before treating the leak-fix claim as settled.
project_impact: >
  apps/blender-bridge is unreleased/early (fase 1, no version pin recorded
  in CI yet). Low urgency, but the fix targets the bridge's core persistence
  mechanism directly — if the claim holds up on re-verification.
confidence: probable
decision: >
  GO_WITH_TESTS, conditional on re-verifying the claim against a Tier 1/2
  source (see interpretation) before treating it as settled — bump to
  Blender 5.2.1 before/alongside blender-bridge's first real deployment.
  Validation gap (flagged in PR review, confirmed against the actual test
  files): neither existing test exercises the fixed code path.
  `headless_selftest.py` only imports `core` and never touches
  `extension.server`'s timer registration. `run_headless_server.py` runs
  under `blender --background`, which has no `bpy.app.timers` event loop —
  the script says so in its own header comment and calls
  `server._drain_commands()` directly from the script thread, bypassing
  the timer dispatcher entirely. Neither test can detect a regression in,
  or confirm the fix of, a bpy.app.timers return-value leak. Real
  validation needs a foreground/GUI Blender session with the extension
  installed and `bpy.app.timers.register(..., persistent=True)` actually
  dispatching — not present in this repo today. Until that harness exists,
  treat "no regression" as unverified even after bumping; do not claim the
  leak fix was confirmed by CI.
affected:
  - apps/blender-bridge (extension/server.py bpy.app.timers persistent drain loop)
  - apps/resolve-script-manager/src-tauri/src/blender.rs (mockup-studio, lower risk)
lesson: >
  A "bugfix-only" point release is not automatically zero product relevance —
  cross-check the fix list against any newly-added integration (blender-bridge
  postdates the 2026-08-09 baseline) before dismissing a maintenance release
  as noise. Also: writing "GO_WITH_TESTS — run X and Y to validate" requires
  actually reading X and Y first. Both proposed test scripts here explicitly
  document (in their own header comments) that they bypass the exact
  mechanism under test; caught in PR review (Codex), not before. Applies
  the SOURCE_POLICY.md Tier discipline to test evidence too, not just
  external claims: a validation step that doesn't exercise the changed
  code path is not evidence of anything.
