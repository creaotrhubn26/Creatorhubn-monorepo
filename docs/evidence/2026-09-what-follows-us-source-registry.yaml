claim: >
  The seed project «What Follows Us — Episode One: The Seeker» in Story Graph
  (frontend/shared/narrative-fixtures/what-follows-us.json) is a structured extraction of the
  studio's 16 source documents; the original Word screenplay (W) and the cult PDF (K) are NOT
  committed — only their SHA-256 checksums are, and every scene/line carries a source tag
  (W/K kildehendelse, U brukertillegg, A iscenesettelsesforslag, E bevart engelsk, T ny oversettelse).
source_type: internal_document
source: >
  Studio uploads 2026-09-17 (16 unique files): OPENING-HYBRID-v2, SCENE-PLAN-v3, Storyline-v2,
  OPENING-DIALOGUE-v2, FIRST-BOUND-ENCOUNTER-v1, HUMAN-SHELTERS-AND-ESCAPE-v1, POWER-PROGRESSION-v1,
  WEAPONS-1817-AND-FACTION-NAMES, CINEMATIC-M1-QUALITY-v1, MOVEMENT-ANIMATION-CONTRACT-v1,
  PROLOGUE-IMPLEMENTATION-v1, P01-STAGING-v1, P01-SCHOOL-DETAILS-v1, Elise-source, Elise-opening-source,
  AGENTS.md. Checksums of each md/txt file are stored in fixture.sources[].sha256.
