product: What Follows Us — Episode One: The Seeker (screenplay + production notes)
version_scope: "Word DOCX sha256 553a5e2f0ea0a8302e6981f4a219c4ef8329b1226803c7259885aa26e6201633; cult PDF sha256 aef8dde76b8db133548da056bd0547bdfbbc3823c67de333e700c9168d0988c7; markdown set dated 2026-09-13"
publication_date: "2026-09-17"
