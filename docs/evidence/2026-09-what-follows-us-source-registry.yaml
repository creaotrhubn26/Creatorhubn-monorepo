lesson: >
  Mechanical extraction by smaller models is fine for fixture content when the contract (types,
  tag rules, «never drop a line», «passed needs evidence») is explicit and a stronger model
  verifies against the sources afterwards; ambiguous speaker labels and episode mapping must be
  recorded as interpretation, not silently normalised.
