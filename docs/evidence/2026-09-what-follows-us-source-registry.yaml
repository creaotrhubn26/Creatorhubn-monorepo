evidence_summary: >
  49 explicit W-lines (W01–W10) plus game shouts/inscriptions, U04/U05/U11 additions and the
  approved counting continuation are all present (no line dropped); G03A lines are marked A
  (staging proposal); K-scene working translations are marked T with unnamed speakers noted.
  Gates are «passed» only where a build/test count is cited (P01-STAGING «68 bestått», PROLOGUE-
  IMPLEMENTATION «60 beståtte tester», DOCX checksum re-read); picture/audio gates are not_started
  because the documents state no Foley/voice/SFX jobs were ordered. Platform target values (30 fps,
  ~33.3 ms, GPU 25–28 ms, CPU 8–12 ms, 65–80 % internal resolution, 30–45 min warm test, iPadOS 17,
  iPad Pro M1 8 GB) come from CINEMATIC-M1-QUALITY-v1; MetalFX gates are unverified there too.
interpretation: >
  Episode assignment for scenes (E01: P01–P06, E02: P07–P09+G01, E03: P10–P12+G02, E04: G03/G03A,
  E05: G04, E06: G05, E07: G06, E08: G08, E10: G09, E11: G10, E12: K07–K08) is editorial, not
  stated in the sources; G07, H01–H03 and K01–K06 are intentionally left without episode. Character
  voice casts for adults (except Desmond) are absent in the sources and left empty, not guessed.
  «BLIR HAN AVBRUTT» in FIRST-BOUND-ENCOUNTER is read as the man being interrupted (speaker MANNEN,
  perspective noted). Active power tier 1 for the four leads is an interpretation of «første
  kontroll», not a number from the document.
project_impact: >
  backend/scripts/seed-what-follows-us.ts (idempotent, via service layer); backend/server/
  narrative-fixture.test.ts validates schema, unique codes, references and idempotent re-seed;
  Playwright mocks seed the same fixture (`seed: 'what-follows-us'`). A new screenplay version
  must update fixture.sources[].sha256 and re-run the extraction with the same AGENTS.md rules.
confidence: verified
decision: >
  Commit the structured fixture (not the source documents); keep provenance per field via
  sourceRefs/sourceType; treat every gate/requirement as unverified until evidence is quoted.
affected:
  - frontend/shared/narrative-fixtures/what-follows-us.json
  - frontend/shared/narrative-fixtures/types.ts
  - backend/server/narrative-fixture-seed.ts
