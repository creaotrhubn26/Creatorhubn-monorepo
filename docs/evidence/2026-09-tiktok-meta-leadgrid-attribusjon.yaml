verified_against_repo: >
  Lest i backend/server 2026-09-18. 51 filer rører Meta eller TikTok. Det som
  finnes er ekte og i bruk — men ingenting av det tar veien innom Leadgrid:

    client-meta-suite.ts       pixler, custom conversions, custom audiences,
                               sendMetaCapiEvent, listMetaCapiEvents
    client-tiktok-suite.ts     pixler, reporting, listTiktokLeadForms,
                               syncTiktokLeads, syncCrmEventToTiktok,
                               fetchTiktokAttribution, audiences, creators
    meta-conversions-api.ts    server-side CAPI for VÅRE EGNE nettsteder
                               (creatorhubn.com og theroleroom.com), egen
                               pixel per site, valgt på Origin-header
    role-room-instagram-*.ts   OAuth, publisering, webhook, bildeopplasting
    social-publisher-*.ts      publisering til Facebook Page, Instagram, TikTok
    role-room-ads-oauth.ts     OAuth-scopes finnes bare for google og linkedin;
                               Meta og TikTok har egne OAuth-veier

  De to funksjonene som ser ut som løsningen, er det ikke:
    syncTiktokLeads      skriver til tiktok_lead_records (mig 261), som bare
                         leses av client-ads-routes.ts. Nøklet på
                         producer_user_id og config_id. Når aldri crm_customers.
    syncCrmEventToTiktok og sendMetaCapiEvent tar begge producerUserId og
                         bruker byråets egen annonsekonto-kobling. De kan ikke
                         sende på vegne av et Leadgrid-prosjekt.

  Meta Graph API-versjon i bruk i repoet: 41 treff på v21.0, 3 på v22.0,
  1 på v18.0. Ikke samstemt, og ikke verifisert mot gjeldende versjon.
authority_tier: 1
vendor: Meta / TikTok
product: Conversions API (Meta), Events API + Offline Events (TikTok)
version_scope: "Meta Graph v21.0/v22.0 i repoet. TikTok Business API v1.3."
publication_date: "2026-09-18"
valid_from: "2026-09-18"
valid_to: "2027-03-18"
interpretation: >
  Strukturen er identisk med Google-funnet fra tidligere samme dag: hele
  annonse- og attribusjonsstakken finnes, men den bor på byråsiden (Role Room)
  og kjenner bare producer_user_id. Leadgrid — der kundens leads og avtaler
  faktisk ligger — har ingen kobling til noen av dem.

  Det betyr at lederspørsmålet «vi får mange henvendelser fra kampanje A, men
  er det kampanje B som gir kundene med størst avtaleverdi?» ikke kunne
  besvares for noen plattform, og at ingen plattform kunne få vite hvilke
  leads som ble til penger.
project_impact: >
  Lukket 2026-09-18 (mig 0637): innkommende skjema lagrer nå gclid, fbclid og
  ttclid på crm_customers, med indeks på hver. fbclid dekker Facebook og
  Instagram. Attribusjonen står på bedriften, avtalebeløpet på salget
  (mig 0635) — de henger sammen via customer_id, så spørsmålet er svarbart
  med én join.

  Gjenstår, i rekkefølgen som gir mest per time:
    1. Tilbakerapportering ved vunnet avtale. Plumbingen finnes
       (sendMetaCapiEvent, syncCrmEventToTiktok), men må kunne kjøre på et
       Leadgrid-prosjekts annonsekonto i stedet for byråets. Uten dette
       optimaliserer plattformene fortsatt mot skjema-utfyllinger.
    2. Lead-annonser rett inn. TikTok har allerede listTiktokLeadForms og
       syncTiktokLeads — de skriver bare til feil tabell. Meta har ingen
       leadgen-webhook i det hele tatt.
    3. Per-prosjekt OAuth for Meta og TikTok. role-room-ads-oauth.ts har bare
       google og linkedin; Meta og TikTok har egne veier som ikke er
       prosjekt-scopet.
confidence: strong_evidence
decision: >
  Lagre klikk-ID-ene FØRST, resten etterpå. En klikk-id som ikke ble lagret da
  henvendelsen kom inn, kan ikke rekonstrueres senere — den finnes bare i det
  ene GET-parameteret på landingssiden. Alt annet i lista over kan bygges når
  som helst mot data vi allerede har; dette ene kan bare bygges FRAMOVER.

  Derfor ble mig 0637 utvidet med fbclid og ttclid før noe av
  tilbakerapporteringen er påbegynt, selv om ingenting leser dem ennå.
