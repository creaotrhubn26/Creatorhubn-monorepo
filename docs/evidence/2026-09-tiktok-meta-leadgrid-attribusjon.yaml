claim: >
  Meta (Facebook + Instagram) og TikTok har begge en ferdig vei for å lukke
  sløyfen fra annonse til vunnet avtale, og begge krever at klikk-ID-en
  lagres på leadet.

  Meta: Conversions API tar CRM-hendelser på POST /events med
  action_source: "system_generated", user_data (lead_id fra lead-annonsen,
  eller sha256-hashet em/ph) og custom_data { lead_event_source, event_source:
  "crm" }. Det er dette som driver «Conversion Leads Optimization» — altså at
  Meta optimaliserer mot avtaler som faktisk lukkes, ikke mot skjema-
  utfyllinger. fbc bygges av fbclid etter mønsteret
  fb.<subdomain_index>.<creation_time_ms>.<fbclid>, så fbclid alene er nok å
  lagre. Samme klikk-id gjelder BÅDE Facebook og Instagram.

  TikTok: offline-konverteringer går via event sets
  (POST /open_api/v1.3/offline/create/, GET /open_api/v1.3/offline/get/), og
  server-til-server-hendelser via POST /pixel/track/ og /pixel/batch/.
  Klikk-ID-en ttclid sendes IKKE som et felt ved navn «ttclid», men som
  context.ad.callback. Gyldighetstiden følger CTA-vinduet i Attribution
  Manager.
