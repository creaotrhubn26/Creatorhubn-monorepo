lesson: >
  «Vi har allerede TikTok-integrasjon» var sant og likevel ubrukelig for
  spørsmålet som ble stilt. Funksjonsnavnet syncTiktokLeads lover nøyaktig det
  man leter etter; først når man leser hvilken TABELL den skriver til, ser man
  at leadene aldri når CRM-et. Sjekk alltid hvor data lander, ikke bare at det
  finnes en funksjon med riktig navn.
