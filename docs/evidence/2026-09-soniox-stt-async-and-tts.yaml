lesson: >
  Leverandørens produktflate kan ha flyttet seg siden beslutningen ble tatt (Soniox var
  «bare STT» i skissen, men har nå TTS med tidsstempler). Sjekk vendor-docs på nytt før
  et pipeline-steg bygges, ikke bare før leverandøren velges.
