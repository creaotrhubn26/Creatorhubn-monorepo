claim: >
  backend/package.json pins "stripe": "^19.3.0" while stripe/stripe-node's
  latest release is v22.6.2 (2026-09-09) — three major versions of drift.
  This record's first draft claimed the drift was low-risk because
  "we explicitly pin the Stripe API version per-client" — that claim was
  checked against one call site and is false at repo scale: a `new Stripe(`
  grep across backend/server/*.ts returns ~35 constructor call sites, and
  exactly one (backend/server/lead-map-routes.ts:128) passes an explicit
  apiVersion. Every other client (including all five constructEvent
  webhook handlers) is constructed bare and therefore floats to whatever
  API version the installed stripe-node build defaults to. The changelog
  review itself was also scoped wrong: it covered v22.4.0→v22.6.2 (the
  range between the last two weekly checks) but the repo is on ^19.3.0, so
  v20, v21, and v22.0–v22.3 were never reviewed — "no breaking-change
  intersection found" was true only for a slice of the actual gap.
source_type: changelog
