claim: >
  backend/package.json pins "stripe": "^19.3.0", three major versions
  behind the SDK's tracked-latest v22.6.2. stripe-node v20-v22 carry real
  breaking changes (v20: indexed array param serialization; v21: decimal
  fields become Stripe.Decimal, Node 16 dropped; v22: ES6-class
  constructor, callback support removed, per-request host/key overrides
  removed).
  CORRECTION (post-review, 2026-09-14): the original version of this claim
  said our apiVersion pins are "currently what keeps legacy metering
  working" — that is WRONG and was caught by chatgpt-codex-connector's
  review of this PR. Verified directly against the installed package:
  `backend/server/storage-quota-service.ts:390` constructs its Stripe
  client as `new Stripe(stripeKey)` with NO apiVersion at all — the pins
  elsewhere in the repo do not govern this call site. Worse: fetching and
  extracting the actual stripe@19.3.0 tarball from the npm registry
  (registry.npmjs.org/stripe/-/stripe-19.3.0.tgz) shows
  `cjs/resources/SubscriptionItems.js` exposes only
  create/retrieve/update/list/del — `createUsageRecord` does NOT exist on
  this resource in v19.3.0 at all (confirmed by reading the generated
  resource file directly, not just types). The call at
  storage-quota-service.ts:397 (`(stripe as any).subscriptionItems
  .createUsageRecord(...)`, guarded by a `@ts-ignore` that already
  signals the author suspected a type mismatch) throws a TypeError at
  runtime on every invocation, which the surrounding try/catch swallows
  into `{ pushed: false, reason: "stripe_error: ..." }` — logged via
  console.error but not raised as a hard failure anywhere else found in
  this pass. This is a PRESENT, CONFIRMED bug: storage-overage billing has
  not been pushing usage to Stripe, not a hypothetical future risk from an
  eventual SDK upgrade.
source_type: official_changelog
