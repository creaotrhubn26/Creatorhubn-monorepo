lesson: >
  A region code (eu-west-2) is not self-explanatory and definitely isn't
  a jurisdiction — always resolve it to the actual physical
  country/regulatory status before writing it into a compliance
  document, the way this session's earlier claim ("Ireland") got both
  the country AND the region code wrong despite looking specific and
  authoritative. "In Europe" and "in the EU/EEA" are not synonyms
  post-Brexit, and treating them as interchangeable is exactly the kind
  of rounding-error that a real SOC 2/GDPR auditor would catch.
