lesson: >
  Sjekk om en "ny integrasjon" egentlig er en ny kilde inn i en motor som
  allerede finnes. Her var import-sporing, dedup og feltmapping bygget for to
  år siden; det dyre er ikke uttaket fra vendoren, men målmodellen vi mangler
  (pipeline-stadier). Avklar hvilke objekter vi faktisk kan ta imot FØR
  connector-siden lover dem.
