claim: >
  Role Room's backend compute (creatorhub-backend, the nextrole cron job,
  and the gfpgan-runner image-processing service) runs on Render, in
  Oregon (US West), not EU/EEA. Originally a prediction from render.yaml's
  silence on `region:`; CONFIRMED same-day directly via the Render API.

source_type: primary
source: >
  Code audit: `render.yaml` (root, 3 services) and `backend/render.yaml`
  (1 service) — neither has a `region:` field on any service block.
  Cross-checked against Render's own Blueprint YAML Reference and Regions
  docs (WebSearch, 2026-08-15): 5 available regions (oregon, ohio,
  virginia, frankfurt, singapore); "The default region is Oregon. If
  omitted, the default value is oregon." Frankfurt is Render's only EU
  region. A Render community thread ("Cannot change region for blueprint
  deploy") confirms region is fixed at service creation and can't be
  changed in-place afterward — moving to Frankfurt requires recreating
  the service, not editing config on the running one.

  CONFIRMED 2026-08-15 via `GET https://api.render.com/v1/services` (run
  by the account owner from outside the sandbox — this session's own
  egress proxy blocks api.render.com, so the prediction above could not
  be verified from inside the coding session itself):
    creatorhub-backend        | oregon | srv-d76ob60ule4c73dv2p60
    creatorhub-gfpgan-runner  | oregon | srv-d7dm8va8qa3s73bjthh0
  Both Role Room-relevant services are Oregon, exactly as the render.yaml
  default predicted. Two adjacent services on the same Render account are
  also relevant context (not Role Room, but same infra decision pattern):
  `tidum-backend` (oregon) and an unlabeled legacy `backend` service
  (oregon) are US too; the `reknaren-*` service group is mostly Frankfurt
  (reknaren, reknaren-market-refresh, reknaren-reminders,
  reknaren-stripe-sync) except reknaren-bank-sync and reknaren-gmail-scan,
  which are Oregon — so EU-pinning is evidently an active, deliberate
  choice made for that product, not a platform-wide default here.

authority_tier: 1
vendor: Render Services, Inc.
product: Web Service / Cron Job hosting (Blueprint deploys)
version_scope: "Role Room backend, 2026-08"
publication_date: "2026-08-15"

evidence_summary: >
  Both render.yaml files in this repo (root: creatorhub-backend web
  service + creatorhub-nextrole-cron + creatorhub-gfpgan-runner; backend/:
  a second creatorhub-backend definition) omit `region:` entirely on every
  service block. Render's own docs state the default is `oregon` (US
  West) when the field is absent. This means — unless someone manually
  overrode the region in the Render dashboard after the Blueprint was
  first synced, which would NOT be reflected in this file — all backend
  compute processing Role Room personal data (candidate profiles,
  audition videos, script content, casting decisions) runs in the US,
  not the EU/EEA the GDPR/DPA docs assume for the platform as a whole.
  This sits alongside the existing R2 (non-jurisdiction-pinned) and Neon
  (unverifiable from code) gaps documented in
  `2026-08-role-room-eu-region-status.yaml` — Render was not checked in
  that earlier pass and is a 5th data point in the same pattern.

interpretation: >
  render.yaml is the source of truth for a Render Blueprint deploy's
  initial region; its silence here was itself the finding, and the
  API confirmation removes any remaining doubt — Role Room backend
  compute is US (Oregon), not EU/EEA. The reknaren-* group on the same
  account proves Frankfurt is a normal, reachable choice on this Render
  account when someone deliberately picks it — nothing platform-level is
  stopping Role Room's services from being moved there.

project_impact: >
  Closes the "unverified" status on Render (backend compute) that sat
  alongside Neon (still genuinely unverifiable from code) and Cloudflare
  R2 (not jurisdiction-pinned) in the EU/EEA-residency gap this project
  tracks. This one is no longer open-as-unknown — it's open-as-confirmed-
  problem: Role Room's actual candidate/production data is processed on
  US infrastructure right now.
  `THE-ROLE-ROOM-DATABEHANDLERAVTALE-MAL.md` §5 (leverandørliste) and
  `docs/soc2/03-leverandorrisiko-policy.md` §3 already list Render under
  "applikasjonshosting" with region "US, SCC-er" — that listing is now
  fully substantiated, not a placeholder guess.

confidence: confirmed
decision: >
  Confirmed via Render API by the account owner (2026-08-15); not fixed
  in this session. Migrating region requires recreating the Render
  service (documented Render limitation: region can't be changed
  in-place), which is a live-production, user-initiated action — planned
  downtime + DNS/env re-point — not something to do from a coding
  session. Left `docs/soc2/03-leverandorrisiko-policy.md`'s existing
  "US, SCC-er" listing for Render as-is; it was already correct.

affected:
  - docs/soc2/03-leverandorrisiko-policy.md
  - THE-ROLE-ROOM-DATABEHANDLERAVTALE-MAL.md
  - docs/evidence/2026-08-role-room-eu-region-status.yaml (sibling gap, same class)

lesson: >
  An absent config field is not "unknown" when the platform has a
  documented default — check the vendor's own docs for what silence
  means before treating it as an open question, and the render.yaml
  prediction here turned out exactly right against the live API. Region
  migration on Render specifically requires service recreation, not a
  config edit, so this class of gap can't be closed from inside a coding
  session even once confirmed; it needs to be logged as a user-actioned
  infra change with a known cost (downtime + DNS/env re-point), not
  folded into a PR. Sibling services on the same account being
  Frankfurt-pinned (reknaren-*) is useful corroborating evidence that
  moving Role Room there is a known, exercised path, not new ground.
