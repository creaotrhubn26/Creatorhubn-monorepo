# Weekly-checked "latest known version" per vendor tracked by the
# Documentation Intelligence impact-assessment agent (release-monitor watch
# list, sources/vendors.yaml). Compared against the previous run each week;
# a version bump here triggers an impact assessment in the same run's
# docs/impact-reports/<date>-impact.md.
#
# Do not hand-edit version numbers — they come from the pinned Tier 1/2
# sources named per entry. Update `checked_at` only via the agent run.

bootstrap: true
bootstrap_note: >
  First run of this tracker (2026-08-09). No prior state existed, so no
  impact assessment was performed this run — see 2026-08-09-impact.md.
  Future runs diff against this file.

vendors:
