# Weekly-checked "latest known version" per vendor tracked by the
# Documentation Intelligence impact-assessment agent (release-monitor watch
# list, sources/vendors.yaml). Compared against the previous run each week;
# a version bump here triggers an impact assessment in the same run's
# docs/impact-reports/<date>-impact.md.
#
# Do not hand-edit version numbers — they come from the pinned Tier 1/2
# sources named per entry. Update `checked_at` only via the agent run.

bootstrap: false
bootstrap_note: >
  Bootstrap run was 2026-08-09 (see 2026-08-09-impact.md). This file is now
  the running baseline; each week's agent diffs against it.

vendors:
  blackmagic-resolve:
    product: DaVinci Resolve
    version: "21.0.4"
    source: "https://www.blackmagicdesign.com/api/support/latest-stable-version/davinci-resolve/mac"
    source_note: >
      Primary source again blocked by this session's network egress policy
      (www.blackmagicdesign.com, curl exit 56) at run time. Corroborated via
      WebSearch (latestupdate.io, videohelp.com — 21.0.4 build dated
      2026-08-05/08-12) — unchanged from the 2026-08-09 baseline. Confidence:
      strong_evidence, not Verified, per Freshness Rule (no live Tier 1 fetch
      this run either).
    checked_at: "2026-08-17"

  xcode-apple-sdk:
    product: Xcode / Apple SDK
    channel: stable
    version: "Xcode 26.6 (17F113)"
    source: "https://developer.apple.com/news/releases/rss/releases.rss (first Stable/GA title matching /Xcode \\d/, excluding beta/RC per release-monitor/SKILL.md Stable-vs-Preview rule)"
    checked_at: "2026-08-17"
    preview_channel_note: >
      Xcode 27 beta 5 (27A5237l, 2026-08-10) is now the current preview
      build (same feed) — advanced from beta 4. Tracked here for awareness
      only, NOT as the diff-triggering baseline —
      docs/evidence/2026-07-ios27-fm-symbols.yaml pins the project to the
      iOS 26 / Xcode 26 FM surface until Xcode 27 ships stable. Promote to
      the primary `version` field once Xcode 27 leaves beta.

  moodle:
    product: Moodle LMS
    version: "v5.2.2"
    source: "https://api.github.com/repos/moodle/moodle/tags (git ls-remote --tags, filtered to ^v\\d+\\.\\d+(\\.\\d+)?$)"
    source_note: >
      api.github.com and moodledev.io/download.moodle.org both blocked by
      egress policy this run (403 / EGRESS_BLOCKED). Corroborated via
      WebSearch — moodle.org forum thread confirms 5.2.2 shipped
      2026-08-10 as scheduled and no 5.2.3 has been announced. Unchanged
      from baseline. Confidence: strong_evidence, not Verified.
    checked_at: "2026-08-17"

  blender:
    product: Blender
    version: "v5.2.0"
    source: "https://api.github.com/repos/blender/blender/tags (git ls-remote --tags, filtered to ^v\\d+\\.\\d+(\\.\\d+)?$)"
    source_note: >
      api.github.com blocked (403) this run. Corroborated via WebSearch
      (blender.org release notes) — 5.2 LTS shipped 2026-07-14, matches
      baseline tag v5.2.0, no newer tag reported. Confidence: strong_evidence.
    checked_at: "2026-08-17"

  stripe-node:
    product: Stripe Node SDK
    version: "v22.5.0"
    previous_version: "v22.4.0"
    source: "https://github.com/stripe/stripe-node/releases (api.github.com blocked, 403; used the public releases page directly — Tier 1, vendor-owned)"
    checked_at: "2026-08-17"
    change_note: >
      New non-prerelease tag since last run (v22.4.0 → v22.5.0, released
      2026-08-10). Prerelease tags (v22.5.0-alpha.*, v22.6.0-alpha.1) were
      seen but excluded per the ^v\d+\.\d+(\.\d+)?$ tag filter. Impact
      assessment in 2026-08-17-impact.md.
