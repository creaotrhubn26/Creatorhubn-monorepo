# Weekly-checked "latest known version" per vendor tracked by the
# Documentation Intelligence impact-assessment agent (release-monitor watch
# list, sources/vendors.yaml). Compared against the previous run each week;
# a version bump here triggers an impact assessment in the same run's
# docs/impact-reports/<date>-impact.md.
#
# Do not hand-edit version numbers — they come from the pinned Tier 1/2
# sources named per entry. Update `checked_at` only via the agent run.

vendors:
  blackmagic-resolve:
    product: DaVinci Resolve
    version: "21.0.4"
    source: "https://www.blackmagicdesign.com/api/support/latest-stable-version/davinci-resolve/mac"
    source_note: >
      Primary source again blocked by this session's network egress policy
      (www.blackmagicdesign.com, CONNECT 403) at run time. Corroborated via
      WebSearch (cined.com, newsshooter.com — no release after 21.0.4/
      2026-08-05 found) — unchanged from last run. Confidence: strong_evidence,
      not Verified, per Freshness Rule (no live Tier 1 fetch this run, second
      consecutive week this domain is blocked).
    checked_at: "2026-08-24"

  xcode-apple-sdk:
    product: Xcode / Apple SDK
    channel: stable
    version: "Xcode 26.6 (17F113)"
    source: "https://developer.apple.com/news/releases/rss/releases.rss (first Stable/GA title matching /Xcode \\d/, excluding beta/RC per release-monitor/SKILL.md Stable-vs-Preview rule)"
    checked_at: "2026-08-24"
    preview_channel_note: >
      Xcode 27 beta 5 (27A5237l) is the current preview build (same feed,
      up from beta 4 last run). Tracked here for awareness only, NOT as the
      diff-triggering baseline — docs/evidence/2026-07-ios27-fm-symbols.yaml
      pins the project to the iOS 26 / Xcode 26 FM surface until Xcode 27
      ships stable. Promote to the primary `version` field once Xcode 27
      leaves beta.

  moodle:
    product: Moodle LMS
    version: "v5.2.2"
    source: "https://github.com/moodle/moodle (git ls-remote --tags, filtered to ^v\\d+\\.\\d+(\\.\\d+)?$)"
    checked_at: "2026-08-24"

  blender:
    product: Blender
    version: "v5.2.0"
    source: "https://github.com/blender/blender (git ls-remote --tags, filtered to ^v\\d+\\.\\d+(\\.\\d+)?$)"
    checked_at: "2026-08-24"

  stripe-node:
    product: Stripe Node SDK
    version: "v22.5.0"
    source: "https://github.com/stripe/stripe-node CHANGELOG.md (git ls-remote --tags + CHANGELOG cross-check)"
    checked_at: "2026-08-24"
    previous_version: "v22.4.0"
    repo_pinned_version_note: >
      backend/package.json pins "stripe": "^19.3.0" — three majors behind
      this tracked latest. See docs/evidence/2026-08-stripe-node-sdk-gap.yaml.
