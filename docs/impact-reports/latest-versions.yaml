    version: "21.1"
    previous_version: "21.0.4"
    source: "https://www.blackmagicdesign.com/api/support/latest-stable-version/davinci-resolve/mac"
    source_note: >
      Primary source blocked again by this session's network egress policy
      (www.blackmagicdesign.com); version corroborated via WebSearch
